/* ---------------- MESSAGERIE DIRECTE ÉLÈVE <-> PROF (indépendante des groupes) ---------------- */
// Un seul abonnement temps réel par session (et non un par conversation) : la
// prof reçoit les messages de TOUS les élèves, l'élève ceux de son propre fil.
// Ainsi la pastille "non lu", le bip et le titre de l'onglet fonctionnent
// depuis n'importe quelle page de l'outil.
const BASE_TITLE = document.title;
const DM_FIELDS = 'id,student_id,author_id,author_name,body,audio_url,created_at';

async function loadDMState(){
  INBOX = {}; STUDENT_LAST_DM = null;
  try{
    if(PROFILE.role==='teacher'){
      const { data } = await sb.from('direct_messages').select(DM_FIELDS).order('created_at',{ascending:false}).limit(2000);
      (data||[]).forEach(m=>{ if(!INBOX[m.student_id]) INBOX[m.student_id] = m; });
    } else {
      const { data } = await sb.from('direct_messages').select(DM_FIELDS).eq('student_id', SESSION.user.id).order('created_at',{ascending:false}).limit(1);
      STUDENT_LAST_DM = (data && data[0]) || null;
    }
  }catch(e){ /* table absente : la messagerie reste simplement vide */ }
}
function lastDMOf(threadId){ return PROFILE.role==='teacher' ? INBOX[threadId] : STUDENT_LAST_DM; }
function dmSeenAt(threadId){ const v = (PROFILE.dm_seen||{})[threadId]; return v ? new Date(v).getTime() : 0; }
// "Non lu" = le dernier message de la conversation vient de l'autre personne
// et date d'après la dernière fois que cette conversation a été ouverte.
function isThreadUnread(threadId){
  const last = lastDMOf(threadId);
  if(!last || last.author_id === SESSION.user.id) return false;
  return new Date(last.created_at).getTime() > dmSeenAt(threadId);
}
function unreadDMCount(){
  if(!PROFILE || !SESSION) return 0;
  if(PROFILE.role==='teacher') return Object.keys(INBOX).filter(isThreadUnread).length;
  return isThreadUnread(SESSION.user.id) ? 1 : 0;
}
function updateTitleBadge(){
  const n = unreadDMCount();
  document.title = (n>0 ? `(${n}) ` : '') + BASE_TITLE;
}
function dmTabLabel(key){
  const n = unreadDMCount();
  if(key==='inbox') return '💬 Messages' + (n>0 ? ` <span style="background:var(--seal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${n}</span>` : '');
  return '💬 Messagerie' + (n>0 ? ' <span style="color:var(--seal);">●</span>' : '');
}
// Met à jour les pastilles des onglets SUR PLACE, sans reconstruire la page :
// un message qui arrive ne doit jamais effacer ce que la prof est en train de
// saisir ailleurs (par exemple une leçon dans "Gérer les leçons").
function refreshTabBadges(){
  ['inbox','dm'].forEach(k=>{
    const b = document.querySelector(`.level-tab[data-space="${k}"]`);
    if(b) b.innerHTML = dmTabLabel(k);
  });
}
function markThreadSeen(threadId){
  const last = lastDMOf(threadId);
  const ts = last ? last.created_at : new Date().toISOString();
  PROFILE.dm_seen = Object.assign({}, PROFILE.dm_seen || {}, { [threadId]: ts });
  // sans la migration, la colonne n'existe pas : l'erreur est ignorée (le "lu"
  // n'est alors simplement pas retenu d'une session à l'autre)
  sb.from('profiles').update({ dm_seen: PROFILE.dm_seen }).eq('id', SESSION.user.id).then(()=>{}, ()=>{});
  updateTitleBadge();
}
function rememberLastDM(m){
  if(PROFILE.role==='teacher'){
    const cur = INBOX[m.student_id];
    if(!cur || new Date(m.created_at) >= new Date(cur.created_at)) INBOX[m.student_id] = m;
  } else if(m.student_id === SESSION.user.id){
    if(!STUDENT_LAST_DM || new Date(m.created_at) >= new Date(STUDENT_LAST_DM.created_at)) STUDENT_LAST_DM = m;
  }
}
function isDMThreadVisible(threadId){
  if(PROFILE.role==='teacher') return state.space==='inbox' && ACTIVE_DM_STUDENT_ID===threadId;
  return state.space==='dm' && threadId===SESSION.user.id;
}
// Point d'entrée UNIQUE pour tout message qui arrive dans une conversation :
// écho immédiat de ses propres envois ET messages reçus en temps réel
// (dédoublonnés par id, donc sans doublon si les deux arrivent).
async function onIncomingDM(m){
  if(!m) return;
  const already = DM.some(x=>x.id===m.id);
  rememberLastDM(m);
  const mine = m.author_id === SESSION.user.id;
  if(!mine && !already) playNotifSound();
  if(isDMThreadVisible(m.student_id)){
    if(!already) DM.push(m);
    markThreadSeen(m.student_id);
  }
  updateTitleBadge();
  const onMessagesPage = PROFILE.role==='teacher' ? state.space==='inbox' : state.space==='dm';
  if(!onMessagesPage){ refreshTabBadges(); return; }
  if(VOICE_BUSY) return;                       // ne pas casser un enregistrement vocal en cours
  const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.dmInput==='1';
  await render();
  if(typing){
    const i = document.querySelector('input[data-dm-input="1"]');
    if(i){ i.focus(); const L = i.value.length; try{ i.setSelectionRange(L,L); }catch(e){} }
  }
}

function subscribeDM(){
  unsubscribeDM();
  if(!SESSION || !PROFILE) return;
  const cfg = { event:'INSERT', schema:'public', table:'direct_messages' };
  if(PROFILE.role!=='teacher') cfg.filter = `student_id=eq.${SESSION.user.id}`;
  DM_SUB = sb.channel('dm_global_'+SESSION.user.id)
    .on('postgres_changes', cfg, payload=> onIncomingDM(payload.new))
    .subscribe();
}
function unsubscribeDM(){ if(DM_SUB){ sb.removeChannel(DM_SUB); DM_SUB=null; } }

function shortTime(iso){
  const d = new Date(iso), now = new Date();

    ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});

/* ---- Sauvegarde des leçons de la professeure ---- */
function lessonsToText(rows){
  const LV = Object.assign({ hyeseon:'Hyeseon' }, LEVEL_LABELS);
  const out = [];
  let lastSpace = null;
  rows.forEach(l=>{
    if(l.space!==lastSpace){ lastSpace = l.space; out.push('##########  ' + (LV[l.space]||l.space).toUpperCase() + '  ##########', ''); }
    out.push('=== ' + l.title + ' ===');
    const segTxt = sg=> (sg.kr||'') + (sg.fr ? ' = ' + sg.fr : '');
    const dlg = Array.isArray(l.dialogue) ? l.dialogue : [];
    if(dlg.length){
      out.push('Dialogue :');
      dlg.forEach(ex=>{
        const who = ex.speaker ? ex.speaker + (ex.role?' ('+ex.role+')':'') + ' : ' : '';
        out.push('  ' + who + (ex.segments||[]).map(segTxt).join(' | '));
      });
    }
    const vo = Array.isArray(l.vowels) ? l.vowels : [];
    if(vo.length){ out.push('Voyelles :'); vo.forEach(v=>out.push('  ' + (v.kr||'') + (v.rom?' ['+v.rom+']':'') + (v.fr?' = '+v.fr:''))); }
    const vc = Array.isArray(l.vocab) ? l.vocab : [];
    if(vc.length){ out.push('Vocabulaire :'); vc.forEach(v=>out.push('  ' + (v.kr||'') + (v.rom?' ['+v.rom+']':'') + (v.fr?' = '+v.fr:''))); }
    const gr = Array.isArray(l.grammar) ? l.grammar : [];
    if(gr.length){ out.push('Grammaire :'); gr.forEach(g=>out.push('  ' + (typeof g==='string' ? g : JSON.stringify(g)))); }
    out.push('');
  });
  return out.join('\n');
}
async function exportLessons(fmt){
  const { data, error } = await sb.from('lessons').select('*').order('space').order('position');
  if(error || !data){ alert("Sauvegarde impossible pour le moment. Réessaie dans un instant."); return; }
  const d = new Date(); const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const isJson = fmt==='json';
  const content = isJson ? JSON.stringify({ exporte_le: d.toISOString(), nombre_de_lecons: data.length, lecons: data }, null, 2) : lessonsToText(data);
  const blob = new Blob([content], { type: isJson ? 'application/json' : 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'lecons-' + stamp + (isJson ? '.json' : '.txt');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ---- Suggestions : idées et problèmes des élèves, lus par la professeure ---- */
async function sbSuggestions(){
  try{
    const { data, error } = await sb.from('suggestions').select('*, author:profiles(name)').order('created_at', { ascending:false }).limit(300);
    if(error){ SUGGEST_OK = false; return []; }
    SUGGEST_OK = true; return data || [];
  }catch(e){ SUGGEST_OK = false; return []; }
}
function suggestTabLabel(){
  const n = (SUGGESTIONS||[]).filter(x=>x.status==='nouveau').length;
  return '💡 Suggestions' + (n>0 ? ` <span style="background:var(--seal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${n}</span>` : '');
}
// Où l'élève se trouvait avant d'ouvrir l'onglet : aide la professeure à comprendre le message
function suggestContextLabel(){
  if(!PROFILE || PROFILE.role!=='student') return '';
  if(state.space==='groupe') return 'Cours en groupe';
  if(state.space==='dm') return 'Messagerie';
  if(state.reviewMode) return 'Mots à revoir';
  if(state.grammarMode) return 'Aide-mémoire grammaire';
  if(state.listenMode) return 'Mot entendu';
  if(state.puzzleMode) return 'Puzzle';
  if(state.globalQuizMode) return 'Quiz global';
  const lvl = LEVEL_LABELS[state.level] || state.level || '';
  if(state.lessonId){
    const l = (LESSONS_CACHE[state.level]||[]).find(x=>x.id===state.lessonId);
    const tabs = { cours:'Cours', memoriser:'À mémoriser', exercices:'Exercices', traduction:'Traduction', pratique:"Texte d'entraînement", quiz:'Quiz', controle:'Contrôle', revision:'Révision' };
    return (lvl + ' · ' + (l ? l.title : 'leçon') + ' · ' + (tabs[state.tab] || state.tab)).slice(0,300);
  }
  return lvl;
}
const SUGGEST_KIND = { idee:'💡 Idée', probleme:'⚠️ Problème' };
function suggestDate(t){ try{ return new Date(t).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>false);
  try{ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return Promise.resolve(ok); }catch(e){ return Promise.resolve(false); }
}
function renderSuggestions(){
  const teacher = PROFILE.role==='teacher';
  const box = el('<div class="main-card"></div>');
  box.appendChild(el('<h2 style="margin:0 0 4px;">💡 Suggestions</h2>'));
  if(!SUGGEST_OK){
    box.appendChild(el('<div class="note">Cette fonction n\'est pas encore activée : il faut lancer <b>migration-suggestions.sql</b> dans Supabase.</div>'));
    return box;
  }
  if(!teacher){
    box.appendChild(el('<div class="note" style="margin-bottom:16px;">Une idée pour améliorer l\'outil, ou un problème rencontré ? Écris-le ici : ta professeure le lira. Pour une question sur le coréen, utilise plutôt la 💬 Messagerie.</div>'));
    const form = el('<div class="field"></div>');
    let kind = 'idee';
    const kinds = el('<div style="display:flex;gap:8px;margin-bottom:10px;"></div>');
    const kb = {};
    Object.keys(SUGGEST_KIND).forEach(k=>{
      const b = el(`<button type="button" class="level-tab ${k===kind?'active':''}">${SUGGEST_KIND[k]}</button>`);
      b.onclick = ()=>{ kind = k; Object.keys(kb).forEach(x=>kb[x].classList.toggle('active', x===kind)); };
      kb[k] = b; kinds.appendChild(b);
    });
    form.appendChild(kinds);
    const ta = el('<textarea maxlength="2000" style="min-height:110px;" placeholder="Décris ton idée ou le problème (que s\'est-il passé ? sur quelle page ?)"></textarea>');
    form.appendChild(ta);
    if(SUGGEST_CTX) form.appendChild(el(`<div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">📍 Page jointe automatiquement : ${escapeHtml(SUGGEST_CTX)}</div>`));
    const msg = el('<div style="margin-top:8px;font-size:13px;"></div>');
    const send = el('<button class="btn celadon" style="margin-top:10px;">Envoyer</button>');
    send.onclick = async ()=>{
      const body = ta.value.trim();
      if(!body){ msg.innerHTML = '<span class="error-text">Écris d\'abord ton message.</span>'; return; }
      send.disabled = true;
      const { error } = await sb.from('suggestions').insert({ author_id:SESSION.user.id, kind, body, context:SUGGEST_CTX || null });
      if(error){ send.disabled = false; msg.innerHTML = '<span class="error-text">Envoi impossible pour le moment. Réessaie plus tard.</span>'; return; }
      SUGGESTIONS = await sbSuggestions(); state.suggestSent = true; render();
    };
    form.appendChild(send); form.appendChild(msg);
    if(state.suggestSent){ state.suggestSent = false; box.appendChild(el('<div class="note" style="border-color:var(--celadon-dark);margin-bottom:14px;">Merci, ton message a bien été envoyé à ta professeure ! 🙏</div>')); }
    box.appendChild(form);
    if(SUGGESTIONS.length){
      box.appendChild(el('<h3 style="margin:26px 0 8px;font-size:15px;">Mes messages envoyés</h3>'));
      SUGGESTIONS.forEach(x=>{
        box.appendChild(el(`<div class="item-card" style="text-align:left;padding:12px 14px;margin-bottom:8px;"><div style="font-size:12px;color:var(--ink-soft);">${SUGGEST_KIND[x.kind]||''} · ${suggestDate(x.created_at)}${x.status==='traite'?' · ✔ vu par la professeure':''}</div><div style="margin-top:4px;white-space:pre-wrap;">${escapeHtml(x.body)}</div></div>`));
      });
    }
    return box;
  }
  // --- côté professeure
  const all = !!state.suggestAll;
  const list = SUGGESTIONS.filter(x=> all || x.status==='nouveau');
  const nNew = SUGGESTIONS.filter(x=>x.status==='nouveau').length;
  box.appendChild(el('<div class="note" style="margin-bottom:14px;">Idées et problèmes envoyés par les élèves. Marque-les « traité » une fois lus. Le bouton « Copier » rassemble les messages non traités en un seul texte, pratique pour les transmettre à la personne qui s\'occupe de l\'outil.</div>'));
  const bar = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div>');
  const fb = el(`<button class="btn ghost small">${all?'Voir seulement les non traités':'Voir aussi les traités'}</button>`);
  fb.onclick = ()=>{ state.suggestAll = !all; render(); };
  const cp = el(`<button class="btn celadon small">📋 Copier les non traités (${nNew})</button>`);
  cp.onclick = async ()=>{
    const rows = SUGGESTIONS.filter(x=>x.status==='nouveau');
    if(!rows.length){ cp.textContent = 'Rien à copier'; return; }
    const txt = rows.map(x=> `[${(SUGGEST_KIND[x.kind]||'').replace(/^\S+\s/,'')}] ${(x.author&&x.author.name)||'?'} — ${suggestDate(x.created_at)}${x.context?`\nPage : ${x.context}`:''}\n${x.body}`).join('\n\n---\n\n');
    const ok = await copyText(txt);
    cp.textContent = ok ? '✔ Copié !' : 'Copie impossible';
  };
  bar.appendChild(fb); bar.appendChild(cp); box.appendChild(bar);
  if(!list.length) box.appendChild(el('<div class="empty-state">Aucune suggestion pour le moment.</div>'));
  list.forEach(x=>{
    const done = x.status==='traite';
    const card = el(`<div class="item-card" style="text-align:left;padding:12px 14px;margin-bottom:10px;${done?'opacity:.65;':''}"></div>`);
    card.appendChild(el(`<div style="font-size:12px;color:var(--ink-soft);">${SUGGEST_KIND[x.kind]||''} · <b>${escapeHtml((x.author&&x.author.name)||'?')}</b> · ${suggestDate(x.created_at)}${x.context?` · 📍 ${escapeHtml(x.context)}`:''}</div>`));
    card.appendChild(el(`<div style="margin:6px 0 10px;white-space:pre-wrap;">${escapeHtml(x.body)}</div>`));
    const row = el('<div style="display:flex;gap:8px;flex-wrap:wrap;"></div>');
    const tg = el(`<button class="btn ghost small">${done?'↩ Rouvrir':'✔ Traité'}</button>`);
    tg.onclick = async ()=>{ const { error } = await sb.from('suggestions').update({ status: done?'nouveau':'traite' }).eq('id', x.id); if(!error){ x.status = done?'nouveau':'traite'; render(); } };
    const rp = el('<button class="btn ghost small">💬 Répondre</button>');
    rp.onclick = ()=> enterInbox(x.author_id);
    const rm = el('<button class="btn ghost small">🗑 Supprimer</button>');
    rm.onclick = async ()=>{ if(!confirm('Supprimer cette suggestion ?')) return; const { error } = await sb.from('suggestions').delete().eq('id', x.id); if(!error){ SUGGESTIONS = SUGGESTIONS.filter(y=>y.id!==x.id); render(); } };
    row.appendChild(tg); row.appendChild(rp); row.appendChild(rm); card.appendChild(row); box.appendChild(card);
  });
  return box;
}

/* ---- Boîte de réception de la prof : une conversation par élève ---- */
async function enterInbox(preferredStudentId){
  state.space = 'inbox'; state.lessonId = null; state.reviewMode=false; state.grammarMode=false; state.listenMode=false; state.puzzleMode=false; state.globalQuizMode = false;
  unsubscribeChat();
  ALL_PROFILES = await sbAllProfiles();
  await loadDMState();
  const students = ALL_PROFILES.filter(p=>p.role==='student');
  const has = id => !!id && students.some(s=>s.id===id);
  let id = has(preferredStudentId) ? preferredStudentId : (has(ACTIVE_DM_STUDENT_ID) ? ACTIVE_DM_STUDENT_ID : null);
  if(!id){
    const lastTs = s => INBOX[s.id] ? new Date(INBOX[s.id].created_at).getTime() : 0;
    const unread = students.find(s=>isThreadUnread(s.id));
    const recent = students.slice().sort((a,b)=> lastTs(b)-lastTs(a))[0];
    id = (unread || recent || {}).id || null;
  }
  ACTIVE_DM_STUDENT_ID = id;
  DM = id ? await sbDMMessages(id) : [];
  if(id) markThreadSeen(id);
  render();
}
async function openInboxThread(studentId){
  ACTIVE_DM_STUDENT_ID = studentId;
  DM = await sbDMMessages(studentId);
  markThreadSeen(studentId);
  render();
}
async function renderInbox(){
  const students = ALL_PROFILES.filter(p=>p.role==='student');
  const layout = el('<div class="layout"></div>');

  const side = el('<div class="sidebar"></div>');
  side.appendChild(el('<h3 style="margin:0 0 12px;font-size:15px;">Conversations</h3>'));
  if(students.length===0){ side.appendChild(el('<div class="empty-level">Aucun élève pour l\'instant.</div>')); }
  const lastTs = s => INBOX[s.id] ? new Date(INBOX[s.id].created_at).getTime() : 0;
  students.slice().sort((a,b)=> (lastTs(b)-lastTs(a)) || a.name.localeCompare(b.name)).forEach(st=>{
    const last = INBOX[st.id];
    const unread = isThreadUnread(st.id);
    const preview = !last ? 'Aucun message' : ((last.author_id===SESSION.user.id ? 'Toi : ' : '') + (last.audio_url ? '🎙️ Note vocale' : last.body));
    const active = st.id===ACTIVE_DM_STUDENT_ID;
    const item = el(`<div data-thread="${st.id}" style="border:1.5px solid ${active?'var(--ink)':'var(--line)'};background:${active?'var(--paper-dim)':'transparent'};border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">
        <span style="${unread?'font-weight:700;':''}">${escapeHtml(st.name)}${unread?' <span style="color:var(--seal);">●</span>':''}</span>
        <span class="mono" style="font-size:10px;color:var(--ink-soft);white-space:nowrap;">${last?shortTime(last.created_at):''}</span>
      </div>
      <div style="font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;color:${unread?'var(--ink)':'var(--ink-soft)'};">${escapeHtml(preview)}</div>
    </div>`);
    item.onclick = ()=> openInboxThread(st.id);
    side.appendChild(item);
  });

  const main = el('<div class="main-card"></div>');
  const active = students.find(s=>s.id===ACTIVE_DM_STUDENT_ID);
  if(!active){
    main.appendChild(el('<div class="empty-state">Choisis un élève dans la liste pour voir ou écrire un message.</div>'));
  } else {
    main.appendChild(el(`<h2 style="margin:0 0 4px;">💬 ${escapeHtml(active.name)}</h2>`));
    main.appendChild(el('<div class="note" style="margin-bottom:16px;">Fil privé avec cet élève — personne d\'autre n\'y a accès.</div>'));
    const container = el('<div></div>');
    main.appendChild(container);
    renderDMMessages(container);
  }
  layout.appendChild(side); layout.appendChild(main);
  return layout;
}
