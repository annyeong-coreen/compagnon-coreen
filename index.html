function runApp(sb){

let state = { space:'perso', level:'debutant', lastPersoLevel:'debutant', lessonId:null, tab:'cours',
  controlAnswers:{}, controlResult:null, quizAnswers:{}, quizResult:null,
  exerciseIndex:0, exerciseCorrectCount:0, dashboardExpanded:{}, loginError:null, headerMenuOpen:false,

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

/* ---------------- DATA LAYER (Supabase) ---------------- */
async function sbLessons(space){
  const {data,error} = await sb.from('lessons').select('*').eq('space',space).order('position');
  if(error){ console.error(error); return []; }
  return data||[];
}
async function sbAddLesson(row){ return await sb.from('lessons').insert(row); }
async function sbAllProgressForSelf(){
  const {data} = await sb.from('progress').select('*').eq('student_id', SESSION.user.id);
  const map = {}; (data||[]).forEach(r=>map[r.lesson_id]=r); return map;
}
async function sbUpsertProgress(lessonId, patch){

  const merged = Object.assign({student_id:SESSION.user.id, lesson_id:lessonId}, existing, patch);
  delete merged.updated_at;

}

}

async function sbWeakWords(){ const {data} = await sb.from('weak_words').select('*').order('created_at',{ascending:false}); return data||[]; }
async function sbAddWeakWord(word, meaning, note){
  if(!SESSION || PROFILE.role!=='student') return;
  const existing = WEAK_WORDS.find(w=>w.word===word);
  if(existing) return; // déjà suivi
  const row = {student_id:SESSION.user.id, word, meaning, hit_count:1};
  let savedNote = null;
  if(note){
    const r = await sb.from('weak_words').upsert(Object.assign({note}, row), {onConflict:'student_id,word'});
    if(!r || !r.error) savedNote = note;
    else await sb.from('weak_words').upsert(row, {onConflict:'student_id,word'});   // colonne « note » pas encore créée
  }else{
    await sb.from('weak_words').upsert(row, {onConflict:'student_id,word'});
  }
  WEAK_WORDS.push({word, meaning, note: savedNote || note || null});
}
async function sbAddWeakWordsBulk(items){
  if(!SESSION || PROFILE.role!=='student' || items.length===0) return 0;
  const fresh = items.filter(it=>!WEAK_WORDS.find(w=>w.word===it.kr));
  if(fresh.length===0) return 0;
  const rows = fresh.map(it=>({student_id:SESSION.user.id, word:it.kr, meaning:it.fr, hit_count:1}));
  await sb.from('weak_words').upsert(rows, {onConflict:'student_id,word'});
  fresh.forEach(it=> WEAK_WORDS.push({word:it.kr, meaning:it.fr}));
  return fresh.length;
}
async function sbRemoveWeakWord(word){
  await sb.from('weak_words').delete().eq('student_id', SESSION.user.id).eq('word', word);
  WEAK_WORDS = WEAK_WORDS.filter(w=>w.word!==word);
}
async function sbRemoveWeakWordsBulk(words){
  if(words.length===0) return;
  await sb.from('weak_words').delete().eq('student_id', SESSION.user.id).in('word', words);
  WEAK_WORDS = WEAK_WORDS.filter(w=>!words.includes(w.word));
}
// Aide-mémoire de grammaire : particules, classificateurs et expressions que l'élève a croisés
// (table grammar_seen — voir migration-grammaire.sql). Si la table n'existe pas encore,
// tout continue de marcher, mais la liste n'est gardée que le temps de la session.
let GRAMMAR_SEEN = [];
let GRAMMAR_TABLE_OK = true;
async function sbLoadGrammarSeen(){
  GRAMMAR_SEEN = []; GRAMMAR_TABLE_OK = true;
  if(!SESSION || !PROFILE || PROFILE.role!=='student') return;
  try{
    const res = await sb.from('grammar_seen').select('*').eq('student_id', SESSION.user.id);
    if(res.error) throw res.error;
    GRAMMAR_SEEN = res.data || [];
  }catch(e){ GRAMMAR_TABLE_OK = false; }
}
async function markGrammarSeen(kind, key){
  if(!SESSION || !PROFILE || PROFILE.role!=='student') return;
  if(GRAMMAR_SEEN.some(g=>g.kind===kind && g.key===key)) return;
  GRAMMAR_SEEN.push({ kind, key, created_at:new Date().toISOString(), _session:true });
  if(!GRAMMAR_TABLE_OK) return;
  try{
    const res = await sb.from('grammar_seen').upsert({ student_id:SESSION.user.id, kind, key }, { onConflict:'student_id,kind,key', ignoreDuplicates:true });
    if(res && res.error) GRAMMAR_TABLE_OK = false;
  }catch(e){ GRAMMAR_TABLE_OK = false; }
}
// Repère « dernière visite de l'aide-mémoire » : sert uniquement à afficher « nouveau » (confort propre à
// cet appareil, jamais essentiel). null = stockage du navigateur indisponible.
let GRAMMAR_VISIT_BASELINE = null;
function grammarVisitKey(){ return 'grammarNotebookVisit:' + (SESSION ? SESSION.user.id : ''); }
function openGrammarNotebookVisit(){
  try{
    GRAMMAR_VISIT_BASELINE = localStorage.getItem(grammarVisitKey()) || '';
    localStorage.setItem(grammarVisitKey(), new Date().toISOString());
  }catch(e){ GRAMMAR_VISIT_BASELINE = null; }
}
function isGrammarEntryNew(entry){
  return !!(entry && (entry._session || (GRAMMAR_VISIT_BASELINE!==null && (entry.created_at||'') > GRAMMAR_VISIT_BASELINE)));
}
async function unmarkGrammarSeen(kind, key){
  GRAMMAR_SEEN = GRAMMAR_SEEN.filter(g=>!(g.kind===kind && g.key===key));
  if(!GRAMMAR_TABLE_OK) return;
  try{ await sb.from('grammar_seen').delete().eq('student_id', SESSION.user.id).eq('kind', kind).eq('key', key); }catch(e){}
}
// Traduction automatique coréen -> français via MyMemory : API publique, gratuite,
// sans clé ni compte requis. Elle traduit chaque mot isolément (sans regarder
// la phrase autour), donc elle se trompe régulièrement sur des mots courts ou
// ambigus — à prendre comme un indice de départ, jamais comme une certitude.
const KO_PARTICLES = ['에서','으로','에게','한테','까지','부터','이라','라서','이고','에','는','은','이','가','을','를','로','와','과','도','만','의','께'];
function stripKoParticle(word){
  for(const p of KO_PARTICLES){
    if(word.length>p.length && word.endsWith(p)) return word.slice(0, -p.length);
  }
  return word;
}
let KRDICT_UNAVAILABLE = false; // évite de retenter à chaque mot si non configuré

/* GRAMMAR:BEGIN — expressions de grammaire courantes, reconnues localement (gratuit,
   sans API). Un dictionnaire comme KRDict ne connaît que des mots isolés : il ne sait
   pas que "탈 수 있어요" veut dire "pouvoir prendre". Ici, on repère l'expression sur
   plusieurs mots d'une phrase et on affiche son sens.
   - tests : un test par mot consécutif (RegExp ou fonction)
   - fn    : positions des mots purement grammaticaux (수, 있어요…) : pas de recherche
             dictionnaire pour eux, seulement l'explication de l'expression
   - stem  : comment retrouver la forme du dictionnaire du verbe (position 0) */
function hFinal(ch){ const c = (ch||'').charCodeAt(0) - 0xAC00; return (c>=0 && c<11172) ? c % 28 : -1; }
function endsRieul(t){ return t.endsWith('을') || hFinal(t.slice(-1))===8; }
function endsNieun(t){ return t.endsWith('은') || hFinal(t.slice(-1))===4; }
function dropFinal(syl){ const f = hFinal(syl); return f>0 ? String.fromCharCode(syl.charCodeAt(0)-f) : syl; }
function stripSuffixes(t, sufs){
  for(const s of sufs){ if(t.length>s.length && t.endsWith(s)) return t.slice(0,-s.length); }
  return null;
}
// Radical d'une forme en -아/어 : "가" -> "가", "먹어" -> "먹", "해" -> "하", "와" -> "오", "봐" -> "보", "줘" -> "주", "마셔" -> "마시"
function aoBase(t){
  if(!t) return null;
  const last = t.slice(-1), c = last.charCodeAt(0) - 0xAC00;
  if(t.length>1 && (last==='아' || last==='어')) return t.slice(0,-1);
  if(last==='해') return t.slice(0,-1) + '하';
  if(c>=0 && c<11172 && c%28===0){
    const v = Math.floor(c/28) % 21;
    if(v===0 || v===4) return t;                                              // 가, 서, 사… (voyelle de 아/어 absorbée)
    if(v===9 || v===14) return t.slice(0,-1) + String.fromCharCode(0xAC00+c-28);   // 와->오, 봐->보, 줘->주
    if(v===6) return t.slice(0,-1) + String.fromCharCode(0xAC00+c+14*28);          // 셔->시
  }
  return null;
}
const GRAMMAR_STEMS = {
  go:      t=>stripSuffixes(t,['고']),
  ji:      t=>stripSuffixes(t,['지']),
  gi:      t=>stripSuffixes(t,['기']),
  reo:     t=>stripSuffixes(t,['으러','러']),

// Formes de dictionnaire possibles d'un verbe conjugué courant ("가요" -> "가다").
// "strong" : terminaisons qui sont presque toujours un verbe (…요, …습니다) -> on les essaie
// avant le mot entier. "weak" : terminaisons ambiguës (…고, …지 : 바지, 냉장고) -> après le mot entier.
// Tout est vérifié dans KRDict seul : une forme inconnue du dictionnaire est simplement écartée.
function guessVerbBases(t){
  const strong = [], weak = [];
  const add = (arr, b)=>{ if(b && b.length>=2 && !strong.includes(b) && !weak.includes(b)) arr.push(b); };
  let m;
  if((m = t.match(/^(.+)(했어요|했습니다|합니다|해요|하세요)$/))) add(strong, m[1]+'하다');
  if((m = t.match(/^(.+)(습니다|았어요|었어요|아요|어요|으세요|세요)$/))) add(strong, m[1]+'다');
  if(t.endsWith('니다') && hFinal(t.slice(-3,-2))===17) add(strong, t.slice(0,-3)+dropFinal(t.slice(-3,-2))+'다');
  if(t.endsWith('요') && t.length>=2){
    const syl = t.slice(-2,-1), c = syl.charCodeAt(0)-0xAC00;
    if(c>=0 && c<11172 && c%28===0){
      const v = Math.floor(c/28)%21, pre = t.slice(0,-2);
      if(v===0 || v===4) add(strong, t.slice(0,-1)+'다');                                   // 가요, 서요
      else if(v===9 || v===14) add(strong, pre+String.fromCharCode(0xAC00+c-28)+'다');       // 와요 -> 오다, 봐요 -> 보다, 줘요 -> 주다
      else if(v===6)  add(strong, pre+String.fromCharCode(0xAC00+c+14*28)+'다');             // 마셔요 -> 마시다
    }
  }
  if((m = t.match(/^(.+)(하고|하지|하는)$/))) add(weak, m[1]+'하다');
  if((m = t.match(/^(.+)(고|지)$/))) add(weak, m[1]+'다');
  return { strong, weak };
}
function grammarTestOk(test, tok){ return typeof test === 'function' ? !!test(tok) : test.test(tok); }
// words : liste des mots nettoyés d'une phrase (sans ponctuation).
// Renvoie pour chaque mot la liste des expressions qui le contiennent.
function findGrammarPatterns(words){
  const perWord = words.map(()=>[]);
  GRAMMAR_PATTERNS.forEach(pat=>{
    const n = pat.tests.length;
    for(let i=0; i+n<=words.length; i++){
      let ok = true;
      for(let k=0; k<n; k++){ if(!grammarTestOk(pat.tests[k], words[i+k])){ ok=false; break; } }
      if(!ok) continue;
      const text = words.slice(i,i+n).join(' ');
      for(let k=0; k<n; k++) perWord[i+k].push({ pat, pos:k, text });
    }
  });
  return perWord;
}

// Retire jusqu'à 2 particules collées en fin de mot : "서울에서는" -> [{stem:'서울에서', parts:['는']}, {stem:'서울', parts:['에서','는']}]
function particleCandidates(tok){
  const out = []; let cur = tok, parts = [];
  for(let i=0; i<2; i++){
    const hit = PARTICLE_ENDINGS.find(p=> cur.length>p.length && cur.endsWith(p));
    if(!hit) break;
    parts = [hit].concat(parts); cur = cur.slice(0,-hit.length);
    out.push({ stem:cur, parts:parts.slice() });
  }
  return out;

const KO_DET = {한:1,두:2,세:3,석:3,서:3,네:4,넉:4,너:4};
const FR_NUMBERS = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];
// Valeur d'un nombre placé devant un classificateur : chiffres, sino-coréen, natif (한, 두, 세, 네, 스무, 열두…)
function counterNumberValue(w){
  if(/^\d[\d,]*$/.test(w)) return parseInt(w.replace(/,/g,''),10);
  if(w==='스무') return 20;
  if(w in KO_DET) return KO_DET[w];
  for(const t of Object.keys(KO_NATIVE_TENS)){
    if(w.startsWith(t) && (w.slice(t.length) in KO_DET)) return KO_NATIVE_TENS[t] + KO_DET[w.slice(t.length)];
  }
  return koNumeralToNumber(w);
}
function matchCounterWord(w){
  for(const c of COUNTER_KEYS){
    if(w.startsWith(c) && COUNTER_REST.includes(w.slice(c.length))) return c;
  }
  return null;
}
// Pour chaque mot : null, ou { role:'number'|'counter', key, number } quand il fait partie d'un "nombre + classificateur"
function findCounters(words){
  const out = words.map(()=>null);
  for(let i=0; i<words.length; i++){
    const m = words[i].match(/^(\d[\d,]*)(\D.*)$/);                       // 3명, 12개
    if(m){ const c = matchCounterWord(m[2]); if(c) out[i] = { role:'counter', key:c, number:parseInt(m[1].replace(/,/g,''),10) }; continue; }
    if(i+1 >= words.length) continue;
    const val = counterNumberValue(words[i]);
    if(val===null) continue;
    const c = matchCounterWord(words[i+1]);
    if(!c) continue;
    if(words[i]==='이' && !['층','원','월','년','시'].includes(c)) continue;   // "이 분" = « cette personne », pas « 2 personnes »
    out[i]   = { role:'number',  key:c, number:val };
    out[i+1] = { role:'counter', key:c, number:val };
  }
  return out;
}
function frNumberWord(n){ return (n>=0 && n<=20) ? FR_NUMBERS[n] : String(n); }

// Cherche un mot dans KRDict (verbe sous sa forme du dictionnaire, mot entier, particules en moins),
// puis en dernier recours avec le repli habituel. Renvoie { word, variants, particles }.
/* Formules toutes faites : le dictionnaire ne les contient pas telles quelles, et les ramener à un verbe donnerait un faux sens (안녕하세요 ≠ « calme ») */
const FIXED_PHRASES = {
  '안녕하세요':['bonjour (poli)'], '안녕하십니까':['bonjour (très formel)'], '안녕':['salut (familier)','au revoir (familier)'],
  '안녕히계세요':['au revoir (à celui qui reste)'], '안녕히가세요':['au revoir (à celui qui part)'],
  '감사합니다':['merci (formel)'], '고맙습니다':['merci (formel)'], '고마워요':['merci'], '고마워':['merci (familier)'], '감사해요':['merci'],
  '죄송합니다':['je suis désolé(e) (formel)'], '죄송해요':['je suis désolé(e)'], '미안해요':['désolé(e)'], '미안합니다':['désolé(e) (formel)'], '미안해':['désolé(e) (familier)'],
  '괜찮아요':['ça va, ce n\'est pas grave'], '괜찮습니다':['ça va, ce n\'est pas grave (formel)'], '괜찮아':['ça va (familier)'],
  '실례합니다':['excusez-moi','pardon'], '어서오세요':['bienvenue'], '처음뵙겠습니다':['enchanté(e) (première rencontre)'],
  '잘먹겠습니다':['merci pour le repas (avant de manger)'], '잘먹었습니다':['merci pour le repas (après avoir mangé)'],
  '수고하셨습니다':['merci pour votre travail'], '수고하세요':['bon courage'], '안녕히주무세요':['bonne nuit (poli)'],
  '축하해요':['félicitations'], '축하합니다':['félicitations (formel)'], '환영합니다':['bienvenue (formel)'], '또만나요':['à bientôt'],
  '여보세요':['allô'], '화이팅':['courage ! allez !'], '파이팅':['courage ! allez !'], '대박':['incroyable, génial (familier)'], '아이고':['oh là là, aïe'],
  '맞아요':['c\'est ça, exact'], '알겠습니다':['compris (formel)'], '알겠어요':['compris'], '몰라요':['je ne sais pas'], '그래요':['c\'est vrai ? / oui, en effet'],
  '네':['oui'], '아니요':['non'], '잠깐만요':['un instant'], '천만에요':['de rien']
};
async function lookupWordSmart(clean, preferredBase){
  { const fp = FIXED_PHRASES[String(clean).replace(/\s+/g,'')]; if(fp) return { word:clean, variants:fp.slice(), particles:[] }; }
  const tryDict = async (w)=>{
    try{ const v = await translateWordKoFr(w, {dictOnly:true, noStrip:true}); return (v && v.length) ? v : null; }
    catch(e){ return null; }
  };
  const guess = guessVerbBases(clean);
  const strong = (preferredBase ? [preferredBase] : []).concat(guess.strong.filter(b=>b!==preferredBase));
  for(const b of strong){ const v = await tryDict(b); if(v) return { word:b, variants:v, particles:[] }; }
  const cands = particleCandidates(clean);
  const whole = await tryDict(clean);
  // Mot entier connu ET courant (débutant/intermédiaire) : c'est lui. Sinon (ex. "비가" = élégie, rare) on regarde
  // d'abord si "mot + particule" donne un mot courant, car c'est presque toujours ce que l'élève a sous les yeux.
  const wholeIsCommon = whole && (!whole.meta || whole.meta.common !== false);
  if(whole && wholeIsCommon) return { word:clean, variants:whole, particles:[] };
  for(const b of guess.weak){ const v = await tryDict(b); if(v) return { word:b, variants:v, particles:[] }; }
  for(const c of cands){ const v = await tryDict(c.stem); if(v) return { word:c.stem, variants:v, particles:c.parts }; }
  if(whole) return { word:clean, variants:whole, particles:[] };
  const last = cands.length ? cands[cands.length-1] : null;
  const fb = last ? last.stem : clean;
  return { word:fb, variants: await translateWordKoFr(fb, {noStrip:true}), particles: last ? last.parts : [] };
}

async function translateWordKoFr(word, opts){
  opts = opts || {};
  const stem = opts.noStrip ? word : stripKoParticle(word);

  // 1) Dictionnaire coréen officiel (KRDict) si configuré — bien plus fiable
  // que MyMemory pour distinguer les vrais sens différents d'un mot (ex.
  // 새 = "nouveau" et "oiseau" sont deux mots distincts dans un vrai
  // dictionnaire, alors que MyMemory les mélange).
  if(!KRDICT_UNAVAILABLE){
    try{
      const { data, error } = await sb.functions.invoke('krdict-lookup', { body:{ word: stem } });
      if(!error && data){
        if(data.configured === false){ KRDICT_UNAVAILABLE = true; }
        else if(data.senses && data.senses.length){
          let senses = data.senses;
          // Mot exact seulement : KRDict renvoie aussi des mots composés (맛있다 pour 있다, 가요제 pour 가요).
          // (Nécessite la version à jour de la fonction krdict-lookup ; l'ancienne ne donne pas le mot exact.)
          const normHead = x=>String(x||'').replace(/[\s\d\-^·]/g,'');
          if(senses.some(s=>s.word)) senses = senses.filter(s=>normHead(s.word)===normHead(stem));
          // Sens de niveau débutant puis intermédiaire d'abord (les sens rares passent après)
          const GRADE_ORDER = {'초급':0,'중급':1,'고급':2};
          const gradeOf = s=> (s.grade in GRADE_ORDER) ? GRADE_ORDER[s.grade] : 3;
          const hasGrade = senses.some(s=>gradeOf(s)<3);
          if(hasGrade) senses = senses.map((s,i)=>({s,i})).sort((a,b)=> (gradeOf(a.s)-gradeOf(b.s)) || (a.i-b.i)).map(x=>x.s);
          const seenDict = new Set();
          const dictVariants = [];
          senses.forEach(s=>{
            const t = (s.translation||'').trim();
            const key = t.toLowerCase();
            if(t && !seenDict.has(key)){ seenDict.add(key); dictVariants.push(t); }
          });
          if(dictVariants.length){
            const out = dictVariants.slice(0,4);
            out.meta = { common: hasGrade ? senses.some(s=>gradeOf(s)<=1) : null };   // mot courant ? (null = inconnu)
            return out;
          }
        }
      }
    }catch(e){ /* on retombe sur MyMemory en cas de souci */ }
  }

  if(opts.dictOnly) throw new Error('not in dictionary'); // pas de repli : on préfère ne rien afficher que du faux

  // 2) Repli : MyMemory (base de traductions existantes, moins fiable sur les
  // mots courts/ambigus mais fonctionne sans configuration).
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(stem)}&langpair=ko|fr`);
  const data = await res.json();

  // MyMemory renvoie plusieurs correspondances existantes (data.matches),
  // pas qu'une seule "meilleure" réponse — utile pour repérer un mot ambigu
  // comme 새 (nouveau / oiseau) au lieu de se fier aveuglément à un seul choix.
  const seen = new Set();
  const variants = [];
  (data.matches || [])
    .slice()
    .sort((a,b)=> (parseFloat(b.match)||0) - (parseFloat(a.match)||0))
    .forEach(m=>{
      const t = (m.translation||'').trim();
      const key = t.toLowerCase();
      if(t && !seen.has(key)){ seen.add(key); variants.push(t); }
    });

  const best = data && data.responseData && data.responseData.translatedText;
  if(best && !seen.has(best.trim().toLowerCase())){ variants.unshift(best.trim()); }

  if(variants.length===0) throw new Error('no translation');
  return variants.slice(0,4); // jusqu'à 4 propositions
}

// Bouton d'enregistrement réutilisable : câble un bouton + une zone de statut,
// enregistre au clic, envoie au stockage, et appelle onUploaded(url) une fois fait.
function wireVoiceRecorder(recBtn, statusEl, onUploaded){
  let mr = null;
  recBtn.onclick = async ()=>{
    if(mr){ mr.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      mr = new MediaRecorder(stream);
      mr.ondataavailable = (e)=> chunks.push(e.data);
      mr.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        mr = null; VOICE_BUSY = false; recBtn.textContent = '🎙️';
        statusEl.textContent = 'Envoi…';
        try{
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = await sbUploadVoiceNote(blob);
          statusEl.textContent = 'Envoyé ✓';
          onUploaded(url);
        }catch(err){ statusEl.textContent = "Erreur d'envoi."; }
      };
      mr.start(); VOICE_BUSY = true;
      recBtn.textContent = '⏹️';
      statusEl.textContent = 'Enregistrement…';
    }catch(err){
      statusEl.textContent = 'Micro indisponible ou refusé.';
    }
  };
}

  const { data:{ session } } = await sb.auth.getSession();

}
async function loadOwnProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', SESSION.user.id).maybeSingle();
  PROFILE = data;
  if(!PROFILE){
    // Session valide mais plus aucun profil derrière (compte supprimé,
    // ou trigger pas encore passé) — on ne reste jamais bloqué dessus.
    await sb.auth.signOut();
    SESSION = null;
    state.loginError = "Ce compte n'existe plus ou la session a expiré — reconnecte-toi.";
    return;
  }
  {
    state.level = PROFILE.level || 'debutant';
    state.lastPersoLevel = state.level;
    PROGRESS = await sbAllProgressForSelf();
    ASSIGNMENT = await sbMyAssignment();
    GROUPS = await sbAllGroups();
    if(PROFILE.role==='student'){
      ACTIVE_GROUP_ID = PROFILE.group_id || null;
      WEAK_WORDS = await sbWeakWords();
      GIFTS = await sbMyGifts();
      await sbLoadGrammarSeen();
      sb.from('profiles').update({last_activity_at:new Date().toISOString()}).eq('id', SESSION.user.id);
    }
    else { state.space = 'manage'; ALL_PROFILES = await sbAllProfiles(); SUGGESTIONS = await sbSuggestions(); }
    await loadDMState();
    subscribeDM();
    updateTitleBadge();
  }
}

  state.loginError = null;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ state.loginError = error.message + ' (code: ' + (error.status||'?') + ')'; render(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  SESSION = session;
  await loadOwnProfile();
  render();

async function lessonsForLevel(level){

}
function isUnlockedSync(list, idx){
  return true;   // plus de verrouillage : l'élève révise librement, le contrôle sert à voir ce qui est acquis
  if(idx===0) return true;
  const l = list[idx];
  if(ASSIGNMENT && l && ASSIGNMENT.lesson_id===l.id) return true;
  const prev = list[idx-1];
  const pr = PROGRESS[prev.id];
  return !!(pr && pr.control && pr.control.passed);
}

  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!SESSION){ app.appendChild(renderLogin()); return; }
  if(!PROFILE){ app.appendChild(el('<div class="empty-state">Chargement du profil…</div>')); return; }
  if(PROFILE.role==='student' && state.space==='groupe' && !PROFILE.group_id){ state.space='perso'; }

  app.appendChild(renderHeader());
  app.appendChild(await renderAssignmentBanner());

  app.appendChild(renderSpaceTabs());

  if(state.space==='dashboard' && PROFILE.role==='teacher'){
    app.appendChild(await renderDashboard());
  } else if(state.space==='inbox' && PROFILE.role==='teacher'){

    app.appendChild(renderSuggestions());
  } else if(state.space==='dm'){

  } else {
    const grid = el('<div class="layout"></div>');

    // Sur téléphone : la barre latérale se replie derrière un bouton « Menu » pour laisser la place au contenu

/* ---- À mémoriser : on trie ce que la professeure a mis dans le cours ---- */
// Renvoie { kind:'word'|'grammar'|'phrase'|'note', kr, fr, rom }
function classifyStudyItem(v){
  let kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim(); const rom = v.rom||'';
  const hasKo = t => /[가-힣]/.test(t);
  const hasLatin = t => /[A-Za-zÀ-ÿ]{3,}/.test(t);
  // « (exception) 춥다 » : l'annotation entre parenthèses passe du côté du sens
  const ann = [];
  kr = kr.replace(/\(([^()]*)\)/g, (m, inner)=>{ if(hasLatin(inner) && !hasKo(inner)){ ann.push(inner.trim()); return ' '; } return m; }).replace(/\s+/g,' ').trim();
  const annOrig = ann.slice();
  if(ann.length) fr = (fr ? fr + ' ' : '') + '(' + ann.join(', ') + ')';
  if(kr && !hasKo(kr) && fr && hasKo(fr) && !hasLatin(fr)){ const t = kr; kr = fr; fr = t; }   // entrée écrite à l'envers (« nominalisation = 것 ») : on la remet dans le bon sens
  if(!kr || !hasKo(kr) || hasLatin(kr)) return { kind:'note', kr, fr, rom };       // explication en français : sa place est dans le Cours
  if(/[ㄱ-ㅎ]|[가-힣]\/[가-힣ㄱ-ㅎ]|~|…|\.\.\.|\+/.test(kr)) return { kind:'grammar', kr, fr, rom, ann:annOrig };   // ㄹ/을, 은/ㄴ, ~…
  const tokens = kr.split(/\s+/).length;
  if(/[.?!]$/.test(kr) || tokens>=3 || kr.length>14) return { kind:'phrase', kr, fr, rom };
  return { kind:'word', kr, fr, rom, ann:annOrig };
}
// Répare ce que l'analyse du cours a pu abîmer, et sort les petites gloses « mot(sens) » en cartes à part.
function expandStudyItem(v){
  const out = [];
  let kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim(); const rom = v.rom||'';
  const KO = '[\\uAC00-\\uD7A3]', LAT = "[A-Za-zÀ-ÿ' ]";
  const hasKo = t => /[가-힣]/.test(t);
  kr = kr.replace(/^\s*(\d+[.)]|[*•\-–])\s*/, '').trim();                       // « 1. », « * » en début de ligne
  // « 볼 것이 많아요. (=구경할 곳이 많아요.) … » coupé en « 볼 것이 많아요. ( » / « 구경할 곳이 많아요.) … »
  if(/\(\s*$/.test(kr) && fr.indexOf(')')>-1){
    const close = fr.indexOf(')');
    const alt = fr.slice(0, close).replace(/^\s*=\s*/, '').trim();
    let rest = fr.slice(close+1).trim();
    kr = kr.replace(/\(\s*$/, '').trim();
    let tail = rest.match(new RegExp('(?:^|\\s)(' + KO + '+)\\s+(' + LAT + '{3,})$'));
    if(tail){ rest = rest.slice(0, tail.index).trim(); out.push({ kind:'word', kr:tail[1], fr:tail[2].trim(), rom:'' }); }
    if(rest && hasKo(rest)) kr = (kr + ' ' + rest).trim();
    fr = '';
    if(alt && hasKo(alt)) out.push({ kind:'phrase', kr:alt, fr:'', rom:'' });
  }
  // « 킹크랩, 게 crab, 새우 » + « crevette » : une liste de mots avec leurs sens
  if(kr.indexOf(',')>-1 && /[A-Za-zÀ-ÿ]{3,}/.test(kr) && hasKo(kr) && !/[().?!]/.test(kr)){
    const parts = kr.split(',').map(x=>x.trim()).filter(Boolean);
    parts.forEach((part, i)=>{
      const m = part.match(new RegExp('^(' + KO + '[\\uAC00-\\uD7A3 ]*?)\\s+(' + LAT + '+)$'));
      if(m) out.push({ kind:'word', kr:m[1].trim(), fr:m[2].trim(), rom:'' });
      else if(new RegExp('^' + KO + '[\\uAC00-\\uD7A3 ]*$').test(part)) out.push({ kind:'word', kr:part, fr:(i===parts.length-1 && fr && !hasKo(fr)) ? fr : '', rom:'' });
    });
    return out;
  }
  // « 순대국, 감(kaki), 배(poire) 먹어 봤어요. » : les gloses deviennent des cartes, la phrase reste propre
  const gl = [];
  kr = kr.replace(new RegExp('(' + KO + '+)\\(\\s*(' + LAT + '{2,})\\s*\\)', 'g'), (m, w, g2)=>{ gl.push({ kind:'word', kr:w, fr:g2.trim(), rom:'' }); return w; });
  gl.forEach(x=>out.push(x));
  const c = classifyStudyItem({ kr, fr, rom });
  if(c.kind!=='note') out.push(c);
  return out;
}
// Une règle de grammaire garde ses exemples (« 춥다 → 추운 것 ») : on les relie à la règle au lieu d'en faire des mots à part.
function lessonStudyGroups(lesson){
  const out = { word:[], grammar:[], phrase:[], note:[] };
  const seen = new Set();
  const add = (c)=>{ const k = c.kind + '|' + c.kr; if(seen.has(k)) return false; seen.add(k); out[c.kind].push(c); return true; };
  (lesson.vowels||[]).forEach(v=> add({kind:'word', kr:v.kr, fr:v.fr, rom:v.rom||''}));
  const vocab = lesson.vocab || [];
  const isHeading = v=>{ const k = String(v.kr||'').trim(); return !!k && !/[가-힣]/.test(k) && !/[가-힣]/.test(String(v.fr||'')) && !/^\d/.test(k) && k.split(/\s+/).length<=5 && !/[.:?!()=]/.test(k); };
  const syl = t=>{ const n = String(t||'').trim().charCodeAt(0) - 0xAC00; return n>=0 && n<11172 ? [Math.floor(n/588), Math.floor((n%588)/28)] : null; };
  const related = (a,b)=>{ const x = syl(a), y = syl(b); return !!(x && y && x[0]===y[0] && x[1]===y[1]); };   // 먹다 → 먹어 보다, 춥다 → 추운 것
  const cap = t=> t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  const soloWord = v=>{ if(isHeading(v)) return null; const p = expandStudyItem(v); return (p.length===1 && p[0].kind==='word') ? p[0] : null; };
  let heading = null, headingUsed = true, lastRule = null, adj = false;
  for(let i=0; i<vocab.length; i++){
    const v = vocab[i];
    if(isHeading(v)){ heading = String(v.kr).trim(); headingUsed = false; lastRule = null; adj = true; continue; }
    if(adj && (lastRule || !headingUsed)){
      // les paires qui suivent directement une règle (ou un titre) sont ses exemples
      let j = i; const pairs = [];
      while(j+1 < vocab.length){
        const a = soloWord(vocab[j]), b = soloWord(vocab[j+1]);
        if(!a || !b || !related(a.kr, b.kr)) break;
        pairs.push({ a:a.kr, b:b.kr, note:(a.ann||[]).concat(b.ann||[]).join(', ') });
        j += 2;
      }
      if(pairs.length){
        if(!lastRule){ lastRule = { kind:'grammar', kr:heading, fr:'', rom:'', examples:[], isTitle:true }; headingUsed = true; add(lastRule); }
        lastRule.examples.push(...pairs);
        i = j-1; adj = true; continue;
      }
    }
    const parts = expandStudyItem(v);
    parts.forEach(c=>{
      if(c.kind==='grammar'){
        // l'explication du professeur est montrée telle quelle, une seule fois (jamais la traduction automatique de la ligne)
        if(c.ann && c.ann.length) c.fr = cap(c.ann.join(', '));
        c.examples = [];
        headingUsed = true;
        if(add(c)) lastRule = c; else lastRule = out.grammar.find(x=>x.kr===c.kr) || lastRule;
      } else add(c);
    });
    adj = parts.length===1 && parts[0].kind==='grammar';
  }
  // un mot sans sens donné par la professeure mais déjà présent avec un sens : on garde celui qui a un sens
  out.word = out.word.filter(w=> w.fr || !out.word.some(o=> o!==w && o.kr===w.kr && o.fr));
  return out;
}

function buildMCQ(lesson, count){
  const items = (lesson.vowels||[]).concat((lesson.vocab||[]).map(v=>({kr:v.kr,rom:v.rom,fr:v.fr})));
  const shuffled = [...items].sort(()=>Math.random()-0.5).slice(0,count||items.length);
  return shuffled.map((it,i)=>{
    const correct = it.fr || it.rom;
    const distractors = items.filter(x=>x!==it).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.fr||x.rom);
    return {id:'q'+lesson.id+'_'+i, kr:it.kr, options:[...distractors, correct].sort(()=>Math.random()-0.5), answer:correct};
  });
}

function normFr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}
// Réponse acceptée si elle correspond à la traduction entière OU à l'une de ses
// variantes ("être changé / être modifié" -> l'une ou l'autre), sans tenir
// compte des accents, majuscules ni de la ponctuation.
function frAnswerOk(input, expected){
  const exp = (expected||'').trim();
  if(/^[\d\s.,']+$/.test(exp)){            // réponse numérique : seuls les chiffres comptent
    const digits = x=>(x||'').replace(/\D/g,'');
    return digits(input)!=='' && digits(input)===digits(exp);
  }
  const given = normFr(input);
  if(!given) return false;
  const alts = [expected].concat((expected||'').split(/[,;\/]/)).map(normFr).filter(Boolean);
  const noParen = normFr((expected||'').replace(/\([^)]*\)/g,''));
  if(noParen) alts.push(noParen);
  return alts.includes(given);
}

}

const LISTEN = { input:'', note:'', cands:[], tokens:[], result:null, msg:'', busy:false, listening:false, added:null };
function speechRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
async function listenSearch(rawWord){
  const clean = String(rawWord||'').replace(/[^가-힣]/g,'');
  LISTEN.added = null;
  if(!clean){ LISTEN.result=null; LISTEN.msg="Écris le mot en hangul (한글), par exemple copié depuis les sous-titres."; render(); return; }
  LISTEN.busy = true; LISTEN.msg=''; LISTEN.result=null; render();
  try{
    const found = await lookupWordSmart(clean);
    if(found && found.variants && found.variants.length){ LISTEN.result = {heard:clean, word:found.word, variants:found.variants}; }
    else LISTEN.msg = "Je ne trouve pas ce mot dans le dictionnaire. Vérifie l'écriture (sous-titres) ou essaie un autre choix.";
  }catch(e){ LISTEN.msg = "Je ne trouve pas ce mot dans le dictionnaire. Vérifie l'écriture (sous-titres) ou essaie un autre choix."; }
  LISTEN.busy = false; render();
}
function listenSetInput(text, andSearch){
  LISTEN.input = text;
  LISTEN.tokens = String(text).trim().split(/\s+/).filter(t=>/[가-힣]/.test(t));
  if(andSearch){
    if(LISTEN.tokens.length<=1) listenSearch(LISTEN.tokens[0]||text); else { LISTEN.result=null; LISTEN.msg='Plusieurs mots : clique sur celui que tu veux chercher.'; render(); }
  }
}
let LISTEN_REC = null, LISTEN_TIMER = null;
function listenStopMic(){ try{ if(LISTEN_REC) LISTEN_REC.stop(); }catch(e){} }
function listenStartMic(){
  const SR = speechRecognitionCtor(); if(!SR) return;
  if(LISTEN.listening) return;
  let rec; try{ rec = new SR(); }catch(e){ LISTEN.msg="Le micro n'est pas disponible ici. Tape le mot à la place."; render(); return; }
  LISTEN_REC = rec;
  rec.lang='ko-KR'; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
  LISTEN.listening=true; LISTEN.msg=''; LISTEN.result=null; LISTEN.cands=[]; LISTEN.tokens=[]; render();
  const finish = ()=>{ clearTimeout(LISTEN_TIMER); if(LISTEN.listening){ LISTEN.listening=false; render(); } };
  LISTEN_TIMER = setTimeout(()=>{ listenStopMic(); setTimeout(()=>{ if(LISTEN.listening){ LISTEN.msg="Le micro n'a rien renvoyé. Réessaie, ou tape le mot."; finish(); } }, 1500); }, 8000);
  rec.onresult = (ev)=>{
    const r = ev.results && ev.results[0]; const alts=[];
    if(r) for(let i=0;i<r.length;i++){ const t=(r[i].transcript||'').trim(); if(t && !alts.includes(t)) alts.push(t); }
    LISTEN.listening=false; clearTimeout(LISTEN_TIMER);
    const hangul = alts.filter(t=>/[\uAC00-\uD7A3]/.test(t));
    if(hangul.length){ LISTEN.cands = hangul; listenSetInput(hangul[0], true); }
    else if(alts.length){ LISTEN.msg = "J'ai entendu « "+alts[0]+" », mais ce n'est pas du coréen. Réessaie en parlant plus lentement, ou tape le mot."; render(); }
    else { LISTEN.msg="Je n'ai rien compris. Réessaie ou tape le mot."; render(); }
  };
  rec.onerror = (ev)=>{
    const e = ev && ev.error;
    LISTEN.msg = e==='not-allowed' || e==='service-not-allowed' ? "Le micro est bloqué : autorise-le dans ton navigateur (cadenas à côté de l'adresse), ou tape le mot."
      : e==='no-speech' ? "Je n'ai rien entendu. Réessaie en parlant plus près du micro, ou tape le mot."
      : e==='audio-capture' ? "Aucun micro détecté sur cet appareil. Tape le mot."
      : e==='network' ? "La reconnaissance vocale a besoin d'Internet et n'a pas pu joindre son service. Tape le mot."
      : e==='language-not-supported' ? "Ce navigateur ne reconnaît pas le coréen à la voix. Tape le mot."
      : "La reconnaissance vocale n'a pas marché ("+(e||'erreur')+"). Tape le mot (par exemple d'après les sous-titres).";
    finish();
  };
  rec.onspeechend = ()=>{ try{ rec.stop(); }catch(e){} };
  rec.onend = ()=>{ finish(); };
  try{ rec.start(); }catch(e){ LISTEN.listening=false; LISTEN.msg="Le micro n'est pas disponible ici. Tape le mot à la place."; render(); }
}

function puzzleArtUrl(i){ return 'data:image/svg+xml;utf8,' + encodeURIComponent(puzzleArt(i)); }
const PUZZLE_ART_COUNT = 4;
function puzzleShown(){
  const n = puzzleCount(), done = Math.floor(n/PUZZLE_PIECES), cur = n % PUZZLE_PIECES;
  const complete = (cur===0 && n>0);
  return { n, done, pieces: complete ? PUZZLE_PIECES : cur, art: (complete ? done-1 : done) % PUZZLE_ART_COUNT, number: complete ? done : done+1, complete };
}

function puzzleGrid(artIndex, pieces, small){

  for(let i=0;i<PUZZLE_PIECES;i++){

    const x = PUZZLE_COLS>1 ? col*100/(PUZZLE_COLS-1) : 0, y = PUZZLE_ROWS>1 ? row*100/(PUZZLE_ROWS-1) : 0;
    const on = shown.has(i);

/* ===== Texte d'entraînement : construit uniquement à partir du cours ===== */
const PRACTICE_TEMPLATES = [
  { id:'copule', kr:(n)=> n + (hFinal(n.slice(-1))>0 ? '이에요' : '예요') + '.', fr:(f)=> "C'est " + f + '.' },
  { id:'existe', kr:(n)=> n + (hFinal(n.slice(-1))>0 ? '이' : '가') + ' 있어요.', fr:(f)=> 'Il y a ' + f + '.' },
  { id:'aime',   kr:(n)=> '저는 ' + n + (hFinal(n.slice(-1))>0 ? '을' : '를') + ' 좋아해요.', fr:(f)=> "J'aime " + f + '.' }
];
function practiceFrNoun(fr){
  const f = String(fr||'').trim().replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim();
  if(!f) return '';
  if(/^(le|la|l'|l’|les|un|une|des|mon|ma|mes|ton|ta|tes|son|sa|ses)\b/i.test(f) || /^(l'|l’)/i.test(f)) return f;
  return '« ' + f + ' »';
}
function collectLessonMaterial(lesson){
  const sentences = [], nouns = [], seen = new Set();
  const isKo = t => /[가-힣]/.test(t);
  (lesson.dialogue||[]).forEach(ex=>{
    if(ex.equiv) return;
    (ex.segments||[]).forEach(seg=>{
      const kr = String(seg.kr||'').trim(), fr = String(seg.fr||'').trim();
      if(seg.gloss || !kr || !fr || !isKo(kr)) return;
      if(/[A-Za-zÀ-ÿ]{3,}/.test(kr)) return;                 // ligne mêlée de français : on ne la prend pas
      const words = kr.split(/\s+/).length;
      if(words>=2 || /[.?!]$/.test(kr)){ if(!seen.has(kr)){ seen.add(kr); sentences.push({kr, fr}); } }
      else if(!/다$/.test(kr)) nouns.push({kr, fr});
    });
  });
  (lesson.vocab||[]).forEach(v=>{
    const kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim();
    if(!kr || !fr || !isKo(kr) || /\s/.test(kr) || /다$/.test(kr) || /[^가-힣]/.test(kr)) return;
    nouns.push({kr, fr});
  });
  // exemples dans les notes de grammaire : « 한국어 = français », « 한국어 → français » ou « 한국어 (français) »
  (lesson.grammar||[]).forEach(g=>{
    String(g).replace(/<[^>]*>/g,'\n').split(/\n/).forEach(line=>{
      const m = line.match(/([가-힣][가-힣\s,]*[가-힣][.?!]?)\s*(?:=|→|:|\()\s*([^()=→가-힣]{4,}?)\)?\s*$/);
      if(m){ const kr=m[1].trim(), fr=m[2].trim(); if(kr.split(/\s+/).length>=2 && /[a-zà-ÿ]/i.test(fr) && !seen.has(kr)){ seen.add(kr); sentences.push({kr, fr}); } }
    });
  });
  const uniq = []; const sn = new Set(); nouns.forEach(n=>{ if(!sn.has(n.kr)){ sn.add(n.kr); uniq.push(n); } });
  return { sentences, nouns: uniq };
}
function buildPracticeText(lesson, rnd){
  rnd = rnd || Math.random;
  const { sentences, nouns } = collectLessonMaterial(lesson);
  const pick = [];
  if(sentences.length){
    const n = Math.min(5, sentences.length);
    const start = sentences.length>n ? Math.floor(rnd()*(sentences.length-n+1)) : 0;   // fenêtre continue : le texte garde son fil
    sentences.slice(start, start+n).forEach(x=>pick.push(x));
  }
  if(pick.length<4 && nouns.length){
    const pool = nouns.slice().sort(()=>rnd()-0.5);
    for(let i=0; i<pool.length && pick.length<4; i++){
      const noun = pool[i], tpl = PRACTICE_TEMPLATES[(i + Math.floor(rnd()*3)) % PRACTICE_TEMPLATES.length];
      pick.push({ kr: tpl.kr(noun.kr), fr: tpl.fr(practiceFrNoun(noun.fr)), template:true });
    }
  }
  if(pick.length<2) return null;
  return { text: pick.map(x=>x.kr).join('\n'), ref: pick.map(x=>x.fr).join('\n'),
           fromCourse: pick.filter(x=>!x.template).length, generated: pick.filter(x=>x.template).length };
}

function renderTraduction(lesson, opts){
  opts = opts || {};
  const dk = opts.generated ? 'practiceDraft' : 'translationDraft', vk = opts.generated ? 'practiceValidated' : 'translationValidated';
  const wrap = el('<div></div>');
  const items = lesson.translations || [];
  if(items.length===0){
    wrap.appendChild(el('<div class="empty-state">Pas de texte à traduire pour cette leçon pour l\'instant.</div>'));
    return wrap;
  }
  const item = items[0];
  wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">Traduis ce texte en français. Bloqué sur un mot ? Clique dessus directement dans le texte pour voir une proposition de traduction.</div>'));
  wrap.appendChild(el(`<div class="note" style="border-color:var(--seal);margin-bottom:16px;font-size:12.5px;">⚠️ Ces traductions sont automatiques. Quand un mot a plusieurs sens possibles, tu verras plusieurs propositions séparées par "/" — à toi de choisir celle qui colle au contexte, ou de rester prudent si aucune ne te semble sûre. En cas de doute, fie-toi plutôt à la liste préparée par ta professeur ci-dessous, ou demande-lui directement dans le chat.</div>`));

  const textCard = el('<div class="item-card kr" style="text-align:left;font-size:19px;line-height:2.2;padding:20px;margin-bottom:16px;white-space:pre-wrap;"></div>');
  const tokens = (item.text||'').split(/(\s+)/);
  const cleanOf = tok => tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
  // expressions de grammaire (ex. "탈 수 있어요") et "nombre + classificateur" (ex. "세 번")
  const wordsClean = tokens.filter(tok=> tok!=='' && !/^\s+$/.test(tok)).map(cleanOf).filter(Boolean);
  const grammarPerWord = findGrammarPatterns(wordsClean);
  const counterPerWord = findCounters(wordsClean);
  const hasGrammar = grammarPerWord.some(g=>g.length>0) || counterPerWord.some(Boolean);
  let wordIdx = -1;
  let gramOwner = null;
  let openClose = null;                    // une seule bulle de traduction ouverte à la fois
  const gramPanel = el('<div></div>');
  tokens.forEach(tok=>{
    if(tok==='' ){ return; }
    if(/^\s+$/.test(tok)){ textCard.appendChild(document.createTextNode(tok)); return; }
    const clean = cleanOf(tok);
    if(!clean){ textCard.appendChild(document.createTextNode(tok)); return; }
    wordIdx++;
    const gram = grammarPerWord[wordIdx] || [];
    const cinfo = counterPerWord[wordIdx];
    const span = el(`<span style="cursor:pointer;border-bottom:1.5px dashed ${(gram.length||cinfo)?'var(--seal)':'var(--celadon-dark)'};">${escapeHtml(tok)}</span>`);
    const variantsWrap = el('<span></span>');
    let revealed = false;
    const closeMe = ()=>{ revealed = false; variantsWrap.innerHTML = ''; };
    const makeVariantChip = (label, onPick)=>{
      const chip = el(`<button type="button" class="mono var-chip" style="font-size:11px;padding:2px 8px;margin:0 3px 3px 0;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;">${escapeHtml(label)}</button>`);
      chip.onclick = async (e)=>{
        e.stopPropagation();
        [...variantsWrap.querySelectorAll('button.var-chip')].forEach(b=>{ b.style.borderColor='var(--line)'; b.style.background='var(--paper)'; b.style.color='var(--ink)'; });
        chip.style.borderColor='var(--celadon-dark)'; chip.style.background='var(--celadon)'; chip.style.color='#fff';
        await onPick();
      };
      return chip;
    };
    span.onclick = async ()=>{
      if(span.dataset.busy==='1') return;
      if(revealed){
        closeMe(); if(openClose===closeMe) openClose = null;
        if(gramOwner===span){ gramPanel.innerHTML=''; gramOwner=null; }
        return;
      }
      if(openClose) openClose();           // on referme le mot précédemment ouvert
      openClose = closeMe;
      span.dataset.busy = '1';
      variantsWrap.innerHTML = '';
      variantsWrap.appendChild(document.createTextNode(' '));
      gramPanel.innerHTML = ''; gramOwner = span;   // l'explication de grammaire s'affiche sous le texte
      gram.forEach(g=>{ gramPanel.appendChild(buildGrammarChip(g.pat, g.text)); markGrammarSeen('expression', g.pat.label); });
      if(cinfo){ gramPanel.appendChild(buildCounterChip(cinfo.key)); markGrammarSeen('classificateur', cinfo.key); }
      const finish = ()=>{ revealed = true; span.dataset.busy = '0'; };
      // a) mot purement grammatical d'une expression (수, 있어요…) ou classificateur : l'explication suffit
      if((gram.length && gram.every(g=>g.pat.fn.includes(g.pos))) || (cinfo && cinfo.role==='counter')){ finish(); return; }
      // b) nombre placé devant un classificateur : on le calcule (한/두/세/네…)
      if(cinfo && cinfo.role==='number'){
        const fr = frNumberWord(cinfo.number);
        variantsWrap.appendChild(makeVariantChip(`${fr} (${cinfo.number})`, ()=>sbAddWeakWord(clean, fr)));
        finish(); return;
      }
      // c) particule isolée (가, 를, 에서…) : c'est une particule, pas un nom ni un verbe
      const verbHit = gram.find(g=>g.pos===0 && g.pat.stem);
      if(BARE_PARTICLES.includes(clean) && !verbHit){
        const key = PARTICLE_SURFACE_TO_KEY[clean];
        gramPanel.appendChild(buildParticleChip(key)); markGrammarSeen('particule', key);
        finish(); return;
      }
      // d) mot : forme du dictionnaire du verbe ("탈" -> "타다", "가" dans "가 봤어요" -> "가다"),
      //    ou nom + particule(s) collée(s) ("택시를" -> "택시" + 를)
      const loading = el('<span class="mono" style="font-size:11px;color:var(--ink-soft);">…</span>');
      variantsWrap.appendChild(loading);
      const preferred = verbHit ? verbDictionaryForm(clean, verbHit.pat.stem) : null;
      try{
        const found = await lookupWordSmart(clean, preferred);
        if(openClose!==closeMe){ span.dataset.busy='0'; return; }   // l'élève a cliqué ailleurs entre-temps
        loading.remove();
        if(found.word!==clean){
          variantsWrap.appendChild(el(`<span style="font-size:12px;margin-right:4px;color:var(--ink-soft);"><b>${escapeHtml(found.word)}</b> :</span>`));
        }
        found.variants.forEach(v=> variantsWrap.appendChild(makeVariantChip(v, ()=>sbAddWeakWord(found.word, v))));
        particleKeysOf(found.particles || []).forEach(key=>{ gramPanel.appendChild(buildParticleChip(key)); markGrammarSeen('particule', key); });
        revealed = true;
      }catch(e){
        if(openClose!==closeMe){ span.dataset.busy='0'; return; }
        loading.remove();
        if(gram.length){ variantsWrap.appendChild(el('<span style="font-size:11px;color:var(--ink-soft);">(pas de traduction pour ce mot seul)</span>')); revealed = true; }
        else variantsWrap.innerHTML = ' <span style="font-size:11px;color:var(--danger);">(indisponible)</span>';
      }
      span.dataset.busy = '0';
    };
    textCard.appendChild(span);
    textCard.appendChild(variantsWrap);
  });
  wrap.appendChild(textCard);
  wrap.appendChild(gramPanel);
  wrap.appendChild(el(`<div class="note" style="margin-top:-8px;margin-bottom:16px;font-size:12px;">Clique sur la proposition qui te semble la plus juste pour la valider — elle part alors dans "Mots à revoir" (choisie par toi, pas imposée par l'IA). Un mot suivi d'une particule (을/를, 에서, 가…) ? Clique dessus : la particule est expliquée sous le texte.${hasGrammar ? ` Les mots soulignés en <b style="color:var(--seal);">rouge</b> font partie d'une expression de grammaire ou d'un nombre avec son classificateur.` : ''}${PROFILE && PROFILE.role==='student' ? ` Tout ce que tu croises s'ajoute à ton 📒 Aide-mémoire grammaire.` : ''}</div>`));

  if(item.help && item.help.length){

    const revealBtn = el('<button class="btn ghost">Révéler la traduction de référence</button>');

/* ---------- Contrôle : on ne quitte pas la page ---------- */
const CONTROL_MAX_LEAVES = 3;            // à la 3e sortie, le contrôle est annulé
const CONTROL_MIN_AWAY_MS = 1500;        // une sortie plus courte n'est pas comptée
const CONTROL_GUARD = { phase:'idle', leaves:0, awayAt:null, awaySecs:0, view:null, banner:'', reasons:[] };
let TAB_CHANNEL = null; const TAB_ID = Math.random().toString(36).slice(2);
try{
  if(typeof BroadcastChannel!=='undefined'){
    TAB_CHANNEL = new BroadcastChannel('compagnon-coreen-tabs');
    TAB_CHANNEL.onmessage = (e)=>{
      const m = e.data||{}; if(m.from===TAB_ID) return;
      if(m.type==='ping') TAB_CHANNEL.postMessage({type:'pong', from:TAB_ID});
      if(m.type==='hello' && CONTROL_GUARD.phase==='active'){ controlGuardAway('autre onglet ouvert'); controlGuardBack(true); }
    };
    TAB_CHANNEL.postMessage({type:'hello', from:TAB_ID});
  }
}catch(e){ TAB_CHANNEL = null; }
function controlOtherTabOpen(){
  return new Promise(resolve=>{
    if(!TAB_CHANNEL){ resolve(false); return; }
    let found = false;
    const h = (e)=>{ const m=e.data||{}; if(m.type==='pong' && m.from!==TAB_ID) found = true; };
    TAB_CHANNEL.addEventListener('message', h);
    try{ TAB_CHANNEL.postMessage({type:'ping', from:TAB_ID}); }catch(e){}
    setTimeout(()=>{ TAB_CHANNEL.removeEventListener('message', h); resolve(found); }, 400);
  });
}
function controlGuardReset(){ Object.assign(CONTROL_GUARD, { phase:'idle', leaves:0, awayAt:null, awaySecs:0, view:null, banner:'', reasons:[] }); }
function controlGuardAway(reason){
  if(CONTROL_GUARD.phase!=='active' || CONTROL_GUARD.awayAt!==null) return;
  CONTROL_GUARD.awayAt = Date.now(); CONTROL_GUARD.pendingReason = reason;
}
function controlGuardBack(force){
  const g = CONTROL_GUARD;
  if(g.phase!=='active' || g.awayAt===null) return false;
  const dur = Date.now() - g.awayAt; g.awayAt = null;
  if(!force && dur < CONTROL_MIN_AWAY_MS) return false;
  g.leaves++; g.awaySecs += Math.round(dur/1000); g.reasons.push(g.pendingReason||'page quittée');
  if(g.leaves >= CONTROL_MAX_LEAVES){ controlGuardCancel(); }
  else { g.banner = `⚠️ Tu as quitté la page du contrôle (${g.leaves}/${CONTROL_MAX_LEAVES}). À la ${CONTROL_MAX_LEAVES}ᵉ sortie, le contrôle est annulé.`; if(typeof render==='function') render(); }
  return true;
}
async function controlGuardCancel(){
  const g = CONTROL_GUARD, v = g.view || {};
  const lessonId = v.lessonId; const leaves = g.leaves, secs = g.awaySecs;
  g.phase = 'cancelled'; g.banner = '';
  state.controlResult = { cancelled:true, leaves, secs };
  if(lessonId) await sbRecordControl(lessonId, { cancelled:true, leaves, secs });
  render();
}
async function sbRecordControl(lessonId, info){
  // Cumule les sorties de page dans la progression : la professeure les voit dans son tableau de bord
  const prev = (PROGRESS[lessonId] && PROGRESS[lessonId].control) || {};
  const flags = Object.assign({ exits:0, cancelled:0, secs:0 }, prev.flags||{});
  flags.exits += info.leaves||0; flags.secs += info.secs||0; if(info.cancelled) flags.cancelled += 1; flags.last = new Date().toISOString().slice(0,10);
  const ctl = Object.assign({}, prev, { attempts:(prev.attempts||0)+(info.cancelled?1:0), flags });
  if(info.cancelled){ ctl.date = new Date().toISOString().slice(0,10); }
  if(prev.passed===undefined) ctl.passed = false;
  if(prev.score===undefined) ctl.score = 0;
  await sbUpsertProgress(lessonId, { control: ctl });
}
function controlViewMatches(){
  const v = CONTROL_GUARD.view; if(!v) return false;
  return state.tab==='controle' && state.space===v.space && state.level===v.level && (state.lessonId||null)===(v.lessonIdState||null)
    && !state.reviewMode && !state.grammarMode && !state.listenMode && !state.globalQuizMode && !state.puzzleMode;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) controlGuardAway('autre onglet ou application'); else controlGuardBack(); });
window.addEventListener('blur', ()=>{ controlGuardAway('autre fenêtre'); });
window.addEventListener('focus', ()=>{ controlGuardBack(); });
// Appelé à chaque affichage : si l'élève quitte l'écran du contrôle (autre onglet de l'outil, autre leçon…) en plein contrôle, ça compte comme une sortie
function controlGuardCheckView(){
  const g = CONTROL_GUARD;
  if(g.phase==='active' && !controlViewMatches()){
    g.leaves++; g.reasons.push("autre écran de l'outil");
    if(g.leaves>=CONTROL_MAX_LEAVES){ controlGuardCancel(); return true; }
    // le contrôle repart de zéro : on ne laisse pas voir le cours puis revenir sur les mêmes questions
    const lessonId = g.view && g.view.lessonId; const lv = g.leaves;
    controlGuardReset(); g.leaves = lv; g.phase='idle'; g.banner = `⚠️ Tu as quitté l'écran du contrôle (${lv}/${CONTROL_MAX_LEAVES}). Les questions ont changé.`;
    state.controlAnswers = {};
    for(const k of Object.keys(LESSONS_CACHE)){ (LESSONS_CACHE[k]||[]).forEach(l=>{ delete l._control; }); }
    g.carry = lv;
  }
  return false;
}

    const start = el(`<button class="btn seal" ${g.phase==='checking'?'disabled':''}>${g.phase==='checking'?'Vérification…':'Commencer le contrôle'}</button>`);
    start.onclick = async ()=>{

    const total=qs.length, ratio=correct/total, passedNow = ratio >= (lesson.pass_score||0.8);

    const wasPassed = !!prevCtl.passed;
    const piecesBefore = (PROFILE.role==='student') ? puzzleCount() : 0;
    // « réussi » reste acquis : rater un nouvel essai n'enlève ni la réussite ni la pièce
    const passed = passedNow || wasPassed;
    const flags = Object.assign({ exits:0, cancelled:0, secs:0 }, prevCtl.flags||{});
    flags.exits += g.leaves; flags.secs += g.awaySecs; if(g.leaves) flags.last = new Date().toISOString().slice(0,10);
    const ctl = { passed, score: Math.max(prevCtl.score||0, ratio), last_score: ratio, date:new Date().toISOString().slice(0,10), attempts:(prevCtl.attempts||0)+1, flags };
    controlGuardReset();
    state.controlResult = {correct, total, passed:passedNow, wrong};
    await sbUpsertProgress(lesson.id, {control: ctl});
    if(passedNow && PROFILE.role==='student'){
      const after = puzzleCount();
      if(after>piecesBefore){ state.controlResult.newPiece = true; state.controlResult.puzzleDone = (after % PUZZLE_PIECES === 0); }
    }
    render();
  };
  wrap.appendChild(submit);
  return wrap;
}

/* ---------------- TEACHER: manage lessons ---------------- */
function isHangul(s){ return /[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/.test(s||''); }
function hasLatinLetters(s){ return /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(s||''); }

// Tente d'extraire une paire coréen/français d'un fragment de texte qui n'a
// AUCUN séparateur explicite (ex. "바람이 불다 il y a du vent" collé tel quel
// dans des notes de cours). On repère juste où s'arrête le hangeul et où
// commence le texte en alphabet latin — pas besoin de comprendre le sens.
function splitEmbeddedKoFr(segment){
  let lastHangulIdx = -1;
  for(let i=0;i<segment.length;i++){ if(isHangul(segment[i])) lastHangulIdx = i; }
  if(lastHangulIdx===-1) return null; // pas de coréen du tout sur ce fragment
  // la ponctuation collée au dernier mot coréen (. ? ! …) reste avec le coréen
  const tail = segment.slice(lastHangulIdx+1);
  const punct = (tail.match(/^[.?!…。？！~]+/) || [''])[0];
  const kr = (segment.slice(0, lastHangulIdx+1) + punct).trim();
  let fr = tail.slice(punct.length).trim().replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ0-9(]+/, '').trim();
  if(!kr || !(hasLatinLetters(fr) || /\d/.test(fr))) return null; // pas de traduction accolée -> on ignore la ligne
  return {kr, rom:'', fr};
}

function parseVocabText(raw){
  const results = [];
  const seen = new Set();
  raw.split('\n').forEach(rawLine=>{
    let line = rawLine.trim();
    if(!line) return;
    // Retire les puces de correction ("* ..."), les reformulations ("= ...")
    // et les indicatifs de dialogue courts ("A :", "B:", "엄마 :"...)
    line = line.replace(/^[*=]\s*/, '').replace(/^[A-Za-z가-힣]{1,3}\s*[:：]\s*/, '').trim();
    if(!line) return;

    const arrowParts = line.split('→').map(s=>s.trim()).filter(Boolean);
    const segments = arrowParts.length>1 ? arrowParts : [line];

    segments.forEach(seg=>{
      let parts;
      if(seg.includes('\t')) parts = seg.split('\t');
      else if(seg.includes('->')) parts = seg.split('->');
      else if(seg.includes('|')) parts = seg.split('|');
      else if(seg.includes(';')) parts = seg.split(';');
      else if((seg.match(/,/g)||[]).length>=2) parts = seg.split(',');
      else parts = null;

      let entry = null;
      if(parts && parts.length>=2){
        parts = parts.map(s=>s&&s.trim());
        if(parts.length>=3){
          const [kr,rom,fr] = parts;
          if(kr) entry = {kr, rom:rom||'', fr:fr||''};
        } else {
          const [a,b] = parts;
          if(isHangul(a)) entry = {kr:a, rom:'', fr:b||''};
          else if(isHangul(b)) entry = {kr:b, rom:'', fr:a||''};
          else if(a) entry = {kr:a, rom:'', fr:b||''};
        }
      } else {
        entry = splitEmbeddedKoFr(seg);
      }
      if(entry && entry.kr && !seen.has(entry.kr)){
        seen.add(entry.kr);
        results.push(entry);
      }
    });
  });
  return results;
}

// ---------------------------------------------------------------
// Analyseur de cours — lit les notes de la prof telles qu'elle les écrit,
// en acceptant ses DEUX habitudes de notation (souvent mélangées) :
//
//  A) Cours de groupe, avec locuteurs :
//       locuteur (rôle) : segment1 | segment2 = traduction1 | traduction2
//  B) Cours individuel, traduction collée juste après le coréen :
//       역사 histoire
//       이름 모르겠어요. Je ne connais pas le nom.
//
// Règles :
//  - ":" (ou "：") sépare un locuteur court du contenu. Sans ":", pas de locuteur.
//  - "(rôle)" après le nom du locuteur = étiquette affichée, jamais traduite ;
//    s'il manque, on réutilise le dernier rôle vu pour ce même locuteur.
//  - "*" en début de ligne = réponse de l'élève ; "=" en début de ligne =
//    reformulation de la phrase précédente.
//  - "|" sépare plusieurs segments coréens sur une même ligne.
//  - "=" ou "→" suivi de français = traduction MANUELLE du coréen qui précède
//    (fiable : jamais besoin de l'API pour ce bout-là).
//  - Sans séparateur, si du français suit directement le coréen, c'est lu
//    comme une traduction (on repère juste où le hangeul s'arrête).
//  - Une glose entre parenthèses en fin de ligne "(연말 fin d'année)" devient
//    une entrée de vocabulaire à part.
//  - Virgules, points, "!", "?" ne coupent JAMAIS un segment.
//  - Un segment coréen sans traduction reste vide : à compléter à la main ou
//    par suggestion automatique, toujours relue avant de valider.
// ---------------------------------------------------------------
function isFrenchish(s){ return !!s && !isHangul(s) && hasLatinLetters(s); }

function parseContentSegments(content){
  const out = [];
  let gloss = null;

  // glose entre parenthèses en fin de ligne : "phrase (연말 fin d'année)"
  const pm = content.match(/\s*\(([^()]*)\)\s*$/);
  if(pm && isHangul(pm[1])){
    const g = splitEmbeddedKoFr(pm[1]);
    if(g){ gloss = { kr:g.kr, fr:g.fr, manual:true, gloss:true }; content = content.slice(0, pm.index).trim(); }
  }

  if(content){
    const eqIdx = content.indexOf('=');
    if(eqIdx !== -1){
      // "ko1 | ko2 = fr1 | fr2" : les segments des deux côtés se correspondent un par un
      const koSegs = content.slice(0, eqIdx).split('|').map(s=>s.trim()).filter(Boolean);
      const frSegs = content.slice(eqIdx+1).split('|').map(s=>s.trim());
      koSegs.forEach((kr,i)=> out.push({ kr, fr: frSegs[i]||'', manual: !!frSegs[i] }));
    } else if(content.includes('→')){
      const parts = content.split('→').map(s=>s.trim()).filter(Boolean);
      if(parts.length===2 && isFrenchish(parts[1])){
        out.push({ kr: parts[0], fr: parts[1], manual: true });
      } else {
        parts.forEach(p=>{
          const e = splitEmbeddedKoFr(p);
          out.push(e ? { kr:e.kr, fr:e.fr, manual:true } : { kr:p, fr:'', manual:false });
        });
      }
    } else if(content.includes('|')){
      content.split('|').map(s=>s.trim()).filter(Boolean).forEach(kr=> out.push({ kr, fr:'', manual:false }));
    } else {
      const e = splitEmbeddedKoFr(content);
      out.push(e ? { kr:e.kr, fr:e.fr, manual:true } : { kr:content, fr:'', manual:false });
    }
  }
  if(gloss) out.push(gloss);
  return out;
}

function parseDialogueText(raw){
  const exchanges = [];
  const lastRoleBySpeaker = {};
  raw.split('\n').forEach(rawLine=>{
    let line = rawLine.trim();
    if(!line) return;

    let reply = false, equiv = false;
    if(/^\*/.test(line)){ reply = true; line = line.replace(/^\*+\s*/, ''); }
    if(/^=/.test(line)){ equiv = true; line = line.replace(/^=+\s*/, ''); }
    if(!line) return;

    let speaker = null, role = null, content = line;
    const i1 = line.indexOf(':'), i2 = line.indexOf('：');
    const colonIdx = (i1===-1) ? i2 : (i2===-1 ? i1 : Math.min(i1,i2));
    if(colonIdx !== -1){
      const before = line.slice(0, colonIdx).trim();
      // un vrai nom de locuteur est court, contient des lettres, et ne ressemble pas à une phrase
      if(before && before.length<=30 && !/[.?!]/.test(before) && /[A-Za-zÀ-ÖØ-öø-ÿ\uAC00-\uD7A3]/.test(before)){
        content = line.slice(colonIdx+1).trim();
        const m = before.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
        if(m){ speaker = m[1].trim(); role = m[2].trim(); if(speaker) lastRoleBySpeaker[speaker] = role; }
        else { speaker = before; role = lastRoleBySpeaker[speaker] || null; }
      }
    }
    if(!content) return;

    const segments = parseContentSegments(content);
    if(segments.length===0) return;
    exchanges.push({ speaker, role, reply, equiv, segments });
  });
  return exchanges;
}

// Nombres coréens : se CALCULENT (aucune API, aucun quota, aucune ambiguïté
// de traduction). Deux systèmes : sino-coréen (일 이 삼 … 십 백 천 만 억 조)
// et purement coréen (하나 둘 … 열 스물 서른 …).
const KO_SINO_DIGITS = {영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9};
const KO_SINO_SMALL  = {십:10,백:100,천:1000};
const KO_SINO_BIG    = {만:1e4,억:1e8,조:1e12};
const KO_NATIVE_ONES = {하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9};
const KO_NATIVE_TENS = {열:10,스물:20,서른:30,마흔:40,쉰:50,예순:60,일흔:70,여든:80,아흔:90};
function koNumeralToNumber(raw){
  const s = (raw||'').replace(/\s+/g,'').replace(/[.,!?…~]+$/,'');
  if(!s) return null;
  if(/^[영공일이삼사오육칠팔구십백천만억조]+$/.test(s)){
    let total=0, section=0, num=0;
    for(const ch of s){
      if(ch in KO_SINO_DIGITS){ num = KO_SINO_DIGITS[ch]; }
      else if(ch in KO_SINO_SMALL){ section += (num||1)*KO_SINO_SMALL[ch]; num = 0; }
      else { section += num; total += (section||1)*KO_SINO_BIG[ch]; section = 0; num = 0; }
    }
    return total + section + num;
  }
  if(s in KO_NATIVE_ONES) return KO_NATIVE_ONES[s];
  for(const t of Object.keys(KO_NATIVE_TENS)){
    if(s===t) return KO_NATIVE_TENS[t];
    if(s.startsWith(t) && (s.slice(t.length) in KO_NATIVE_ONES)) return KO_NATIVE_TENS[t] + KO_NATIVE_ONES[s.slice(t.length)];
  }
  return null;
}

// Traduction d'une phrase entière via MyMemory — simple suggestion de départ
// pour les segments sans traduction ; la prof relit et corrige avant de valider.
// Le service gratuit a un quota quotidien : on le détecte pour ne jamais
// écrire son message d'avertissement à la place d'une traduction.
async function translateSentenceKoFr(text){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|fr`);
    const data = await res.json();
    const t = (data && data.responseData && data.responseData.translatedText) || '';
    const status = parseInt(data && data.responseStatus, 10);
    if(/MYMEMORY WARNING/i.test(t) || status===429) return { text:'', quota:true };
    if(status && status!==200) return { text:'', quota:false };
    return { text:t, quota:false };
  }catch(e){ return { text:'', quota:false }; }
}

// Widget réutilisable : zone de collage + analyse + tableau de relecture
// éditable, utilisé à la fois pour créer et pour modifier une leçon.
function buildDialogueEditor(initialExchanges){
  let exchanges = (initialExchanges||[]).map(ex=>({ ...ex, segments:(ex.segments||[]).map(s=>({...s})) }));
  const wrap = el('<div></div>');

  const toRaw = (list)=> list.map(ex=>{
    const prefix = (ex.reply?'* ':'') + (ex.equiv?'= ':'') + (ex.speaker ? `${ex.speaker}${ex.role?` (${ex.role})`:''} : ` : '');
    const hasFr = ex.segments.some(s=>s.fr);
    return prefix + ex.segments.map(s=>s.kr).join(' | ') + (hasFr ? ' = ' + ex.segments.map(s=>s.fr||'').join(' | ') : '');
  }).join('\n');
  const rawText = toRaw(exchanges);

  wrap.appendChild(el(`<div class="note" style="margin-bottom:10px;font-size:12px;line-height:1.55;">
    Colle ton cours <b>tel quel</b>. Sont reconnus :<br>
    • coréen suivi de sa traduction sur la même ligne : <code>역사 histoire</code><br>
    • <code>coréen → français</code> ou <code>coréen = français</code><br>
    • dialogues : <code>locuteur (rôle) : coréen | coréen = français | français</code><br>
    • <code>*</code> en début de ligne = réponse de l'élève<br>
    Les phrases sans traduction restent vides : tu les complètes à la main ou avec la suggestion automatique, et tu relis avant d'enregistrer.</div>`));
  const textarea = el(`<textarea style="width:100%;min-height:180px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;font-size:13px;font-family:'IBM Plex Mono',monospace;">${escapeHtml(rawText)}</textarea>`);
  wrap.appendChild(textarea);
  const btnRow = el('<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;"></div>');
  const analyzeBtn = el('<button type="button" class="btn ghost small">Analyser le texte</button>');
  const apiBtn = el('<button type="button" class="btn ghost small" style="display:none;">🌐 Suggérer les traductions manquantes</button>');
  const status = el('<span style="font-size:12px;color:var(--ink-soft);align-self:center;"></span>');
  btnRow.appendChild(analyzeBtn); btnRow.appendChild(apiBtn); btnRow.appendChild(status);
  wrap.appendChild(btnRow);
  const reviewBox = el('<div style="max-height:460px;overflow-y:auto;"></div>');
  wrap.appendChild(reviewBox);

  let lastAnalyzed = textarea.value;
  // Ré-analyse le texte SANS perdre le travail de relecture déjà fait : les
  // traductions corrigées à la main (et les suggestions déjà reçues) sont
  // reportées sur les segments dont le coréen n'a pas changé.
  const syncFromText = ()=>{
    const known = new Map();
    exchanges.forEach(ex=>ex.segments.forEach(s=>{ if(s.fr) known.set(s.kr, { fr:s.fr, manual:s.manual, edited:s.edited }); }));
    exchanges = parseDialogueText(textarea.value);
    exchanges.forEach(ex=>ex.segments.forEach(s=>{
      const k = known.get(s.kr);
      if(k && (!s.fr || k.edited)){ s.fr = k.fr; s.manual = k.manual; if(k.edited) s.edited = true; }
    }));
    lastAnalyzed = textarea.value;
  };
  const countSummary = ()=>{
    const segs = exchanges.reduce((n,ex)=>n+ex.segments.length, 0);
    const withFr = exchanges.reduce((n,ex)=>n+ex.segments.filter(s=>s.fr).length, 0);
    return `${segs} segment(s) : ${withFr} avec traduction, ${segs-withFr} sans.`;
  };

  function renderReview(){
    reviewBox.innerHTML = '';
    if(exchanges.length===0) return;
    apiBtn.style.display = exchanges.some(ex=>ex.segments.some(s=>!s.fr)) ? 'inline-block' : 'none';
    exchanges.forEach(ex=>{
      const card = el('<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;"></div>');
      const tags = [];
      if(ex.speaker) tags.push(escapeHtml(ex.speaker) + (ex.role?' · '+escapeHtml(ex.role):''));
      if(ex.reply) tags.push('↳ réponse de l\'élève');
      if(ex.equiv) tags.push('= reformulation');
      if(tags.length){
        card.appendChild(el(`<div style="font-size:11px;font-weight:700;color:var(--celadon-dark);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">${tags.join(' — ')}</div>`));
      }
      ex.segments.forEach(seg=>{
        const row = el('<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"></div>');
        row.appendChild(el(`<div class="kr" style="flex:1;font-size:14px;">${escapeHtml(seg.kr)}${seg.gloss?' <span class="mono" style="font-size:10px;color:var(--ink-soft);">glose</span>':''}</div>`));
        const input = el(`<input type="text" value="${escapeHtml(seg.fr)}" placeholder="traduction..." style="flex:1;font-size:13px;">`);
        input.oninput = (e)=>{ seg.fr = e.target.value; seg.manual = true; seg.edited = true; };
        row.appendChild(input);
        if(!seg.manual && seg.fr){ row.appendChild(el('<span class="mono" style="font-size:10px;color:var(--gold);white-space:nowrap;">suggestion</span>')); }
        card.appendChild(row);
      });
      reviewBox.appendChild(card);
    });
  }

  analyzeBtn.onclick = ()=>{
    syncFromText();
    status.textContent = countSummary();
    renderReview();
  };

  apiBtn.onclick = async ()=>{
    apiBtn.disabled = true;
    const todo = []; let skippedWords = 0, numerals = 0;
    exchanges.forEach(ex=>ex.segments.forEach(seg=>{
      if(seg.fr) return;
      const k = seg.kr.trim();
      const n = koNumeralToNumber(k);
      if(n !== null){ seg.fr = n.toLocaleString('en-US'); seg.manual = false; numerals++; return; }
      // un mot isolé est trop ambigu sans contexte : on ne propose rien
      if(!/\s/.test(k) && k.length<=6){ skippedWords++; return; }
      if(k.length>160){ return; } // limite de longueur du service gratuit
      todo.push(seg);
    }));
    let done = 0, quota = false;
    for(const seg of todo){
      status.textContent = `Suggestion ${done+1}/${todo.length}…`;
      const r = await translateSentenceKoFr(seg.kr);
      if(r.quota){ quota = true; break; }
      if(r.text){ seg.fr = r.text; seg.manual = false; }
      done++;
    }
    apiBtn.disabled = false;
    status.textContent = quota
      ? `${numerals?numerals+' nombre(s) converti(s). ':''}Quota gratuit du service atteint pour aujourd\'hui — complète les phrases à la main ou réessaie demain.`
      : `Terminé${numerals?` — ${numerals} nombre(s) converti(s)`:''}${skippedWords?` — ${skippedWords} mot(s) isolé(s) laissé(s) vide(s), trop ambigus sans contexte`:''}. Relis et corrige avant d'enregistrer.`;
    renderReview();
  };

  if(exchanges.length) renderReview();

  return {
    element: wrap,
    // Si du texte a été collé/modifié sans cliquer sur "Analyser", on l'analyse
    // ici plutôt que de l'ignorer en silence à l'enregistrement.
    getExchanges: ()=>{ if(textarea.value !== lastAnalyzed){ syncFromText(); } return exchanges; },
    setText: (t)=>{
      const cur = textarea.value.trim();
      textarea.value = cur ? cur + '\n' + t : t;
      syncFromText();
      status.textContent = countSummary();
      renderReview();
    }
  };
}

function dialogueToVocab(exchanges){
  const seen = new Set();
  const vocab = [];
  (exchanges||[]).forEach(ex=> ex.segments.forEach(s=>{
    if(s.kr && s.fr && !seen.has(s.kr)){ seen.add(s.kr); vocab.push({kr:s.kr, rom:'', fr:s.fr}); }
  }));
  return vocab;
}

    if(!title){ addStatus.style.color='var(--danger)'; addStatus.textContent='Le titre est obligatoire.'; return; }
    addBtn.disabled = true; addStatus.style.color='var(--ink-soft)'; addStatus.textContent = 'Ajout en cours…';
    const dialogue = dialogueEditor.getExchanges();
    const manualVocab = parseVocabText(vocabArea.value);
    const dialogueVocab = dialogueToVocab(dialogue);
    const seenKr = new Set();
    const vocab = [...dialogueVocab, ...manualVocab].filter(v=>{
      if(seenKr.has(v.kr)) return false;
      seenKr.add(v.kr); return true;
    });
    const grammar = form2.querySelector('#mg-grammar').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const passScore = (parseFloat(form2.querySelector('#mg-pass').value)||80)/100;
    const transText = form2.querySelector('#mg-trans-text').value.trim();
    const transRef = form2.querySelector('#mg-trans-ref').value.trim();
    const transHelp = form2.querySelector('#mg-trans-help').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
      const [word,meaning] = line.split('|').map(s=>s&&s.trim());
      return {word:word||'', meaning:meaning||''};
    }).filter(h=>h.word);
    const translations = transText ? [{text:transText, ref:transRef, refAudio:pendingRefAudioUrl, help:transHelp}] : [];
    const list = await lessonsForLevel(state.level);
    const id = state.level[0] + (list.length+1) + '-' + Date.now().toString(36);
    const { error } = await sbAddLesson({id, space:state.level, position:list.length+1, title, vowels:[], vocab, dialogue, grammar, pass_score:passScore, translations, audio_url:pendingAudioUrl});
    addBtn.disabled = false;
    if(error){
      addStatus.style.color='var(--danger)';
      addStatus.textContent = 'Erreur : ' + error.message + ' — as-tu bien lancé toutes les migrations SQL (voir README) ?';
      return;
    }
    addStatus.style.color='var(--celadon-dark)'; addStatus.textContent = 'Leçon ajoutée ✓';
    delete LESSONS_CACHE[state.level];
    renderAssignAfterCreate(afterCreate, state.level, id, title);
  };
  wrap.appendChild(addBtn);
  wrap.appendChild(addStatus);
  wrap.appendChild(afterCreate);

  const list = await lessonsForLevel(state.level);
  const existing = el('<div class="section-block" style="margin-top:30px;"><h3>Leçons existantes</h3></div>');
  if(list.length===0){ existing.appendChild(el('<div class="empty-level">Aucune pour l\'instant.</div>')); }
  list.forEach(l=>{
    const row = el(`<div class="vocab-row" style="align-items:center;"><span>${escapeHtml(l.title)}${l.audio_url?' 🔊':''}</span><span></span><span></span></div>`);
    const editBtn = el('<button class="btn ghost small">✏️ Modifier</button>');
    editBtn.onclick = ()=> openEditLessonModal(l);
    const assignBtn = el('<button class="btn ghost small" style="margin-left:6px;">🎯 Assigner</button>');
    assignBtn.onclick = ()=> openAssignLessonToStudentsModal(state.level, l.id, l.title);
    const audioBtn = el(`<button class="btn ghost small" style="margin-left:6px;">🎙️ ${l.audio_url?'Remplacer':'Ajouter'} audio</button>`);
    audioBtn.onclick = ()=> openLessonAudioModal(l);
    const printBtn = el('<button class="btn ghost small" style="margin-left:6px;">🖨️ Imprimer</button>');
    printBtn.onclick = ()=> openPrintableLesson(l);
    const deleteBtn = el('<button class="btn ghost small" style="margin-left:6px;color:var(--danger);">🗑️ Supprimer</button>');
    deleteBtn.onclick = async ()=>{
      if(!confirm(`Supprimer définitivement la leçon "${l.title}" ? Toute la progression et les assignations liées seront aussi supprimées.`)) return;
      await sbDeleteLesson(l.id);
      delete LESSONS_CACHE[state.level];
      render();
    };
    row.lastElementChild.appendChild(editBtn);
    row.lastElementChild.appendChild(assignBtn);
    row.lastElementChild.appendChild(audioBtn);
    row.lastElementChild.appendChild(printBtn);
    row.lastElementChild.appendChild(deleteBtn);
    existing.appendChild(row);
  });
  wrap.appendChild(existing);
  return wrap;
}

function serializeVocab(vocab){
  return (vocab||[]).map(v => v.rom ? `${v.kr} | ${v.rom} | ${v.fr}` : `${v.kr} → ${v.fr}`).join('\n');
}

function openPrintableLesson(lesson){
  const vocabRows = (lesson.vocab||[]).map(v=>`<tr><td style="font-size:18px;">${escapeHtml(v.kr)}</td><td>${escapeHtml(v.rom||'')}</td><td>${escapeHtml(v.fr||'')}</td></tr>`).join('');
  const grammarItems = (lesson.grammar||[]).map(g=>`<li>${escapeHtml(g)}</li>`).join('');
  const t = (lesson.translations && lesson.translations[0]) || {};
  const transSection = t.text ? `
    <h2>Texte à traduire</h2>
    <p style="white-space:pre-wrap;font-size:16px;">${escapeHtml(t.text)}</p>
    ${t.ref ? `<h2>Traduction de référence</h2><p style="white-space:pre-wrap;">${escapeHtml(t.ref)}</p>` : ''}
  ` : '';
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${escapeHtml(lesson.title)}</title>
  <style>
    body{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;padding:40px;color:#211D1A;max-width:800px;margin:0 auto;}
    h1{font-size:24px;border-bottom:2px solid #211D1A;padding-bottom:10px;}
    h2{font-size:16px;margin-top:28px;margin-bottom:8px;}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    td{border-bottom:1px solid #ddd;padding:8px 10px;font-size:14px;vertical-align:top;}
    ul{padding-left:20px;} li{margin-bottom:8px;font-size:14px;line-height:1.5;}
    @media print{ body{padding:15px;} }
  </style></head><body>
  <h1>${escapeHtml(lesson.title)}</h1>
  <h2>Vocabulaire</h2>
  <table>${vocabRows || '<tr><td>Aucun</td></tr>'}</table>
  ${grammarItems ? `<h2>Grammaire</h2><ul>${grammarItems}</ul>` : ''}
  ${transSection}
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){ alert('Le navigateur a bloqué la fenêtre d\'impression — autorise les pop-ups pour ce site.'); return; }
  win.document.write(html);
  win.document.close();
  setTimeout(()=>{ win.print(); }, 300);
}

function renderAssignAfterCreate(container, level, lessonId, title){
  container.innerHTML = '';
  const students = ALL_PROFILES.filter(p=>p.role==='student');
  const box = el(`<div class="note" style="border-color:var(--celadon-dark);margin-top:14px;">
    <b>${escapeHtml(title)}</b> a été ajoutée. L'assigner tout de suite à :
  </div>`);
  container.appendChild(box);
  if(students.length===0){
    box.appendChild(el('<div style="margin-top:8px;font-size:12px;">Aucun élève créé pour l\'instant — la leçon reste visible pour tous ceux qui accèdent à cet espace.</div>'));
    return;
  }
  const list = el('<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;"></div>');
  const checks = [];
  students.forEach(p=>{
    const row = el(`<label style="display:flex;align-items:center;gap:8px;font-size:13px;"><input type="checkbox"> ${escapeHtml(p.name)}</label>`);
    const cb = row.querySelector('input');
    checks.push([cb, p.id]);
    list.appendChild(row);
  });
  box.appendChild(list);
  const btn = el('<button class="btn celadon small" style="margin-top:10px;">Assigner aux élèves cochés</button>');
  btn.onclick = async ()=>{
    const selected = checks.filter(([cb])=>cb.checked).map(([,id])=>id);
    if(selected.length===0) return;
    btn.disabled = true;
    await Promise.all(selected.map(id=>sbSetAssignment(id, lessonId)));
    btn.disabled = false;
    btn.textContent = 'Assigné ✓';
  };
  box.appendChild(btn);
}

/* ---------------- CHAT (live via Supabase Realtime) ---------------- */
function playNotifSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    osc.onended = ()=> ctx.close();
  }catch(e){ /* audio non disponible, on ignore silencieusement */ }
}

// Affiche tout de suite son propre message (sans attendre le temps réel) ;
// l'éventuel écho du temps réel est ignoré grâce au contrôle par id.
function echoChat(m){
  if(!m || CHAT.some(x=>x.id===m.id)) return;
  CHAT.push(m);
  if(state.space==='groupe' && !VOICE_BUSY) render();
}
function subscribeChat(){
  unsubscribeChat();
  CHAT_SUB = sb.channel('chat_messages_changes_'+(ACTIVE_GROUP_ID||'none'))
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages', filter: ACTIVE_GROUP_ID ? `group_id=eq.${ACTIVE_GROUP_ID}` : undefined}, payload=>{
      if(CHAT.some(x=>x.id===payload.new.id)) return;      // déjà affiché (écho local)
      CHAT.push(payload.new);
      if(payload.new.author_id !== SESSION.user.id){ playNotifSound(); }
      if(state.space==='groupe' && !VOICE_BUSY) render();
    }).subscribe();
}
function unsubscribeChat(){ if(CHAT_SUB){ sb.removeChannel(CHAT_SUB); CHAT_SUB=null; } }
