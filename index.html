      ? `<b>📌 Sujet du jour :</b> ${escapeHtml(topic)}`
      : `<span style="color:var(--ink-soft);">Aucun sujet donné par ta professeur pour l'instant.</span>`;
  }
  box.appendChild(topicBox);

  const list = el('<div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>');
  if(CHAT.length===0){ list.appendChild(el('<div class="empty-level">Aucun message pour l\'instant.</div>')); }
  CHAT.forEach(m=>{
    const time = new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const bodyHtml = m.audio_url
      ? `<audio controls src="${escapeHtml(m.audio_url)}" style="height:32px;margin-top:4px;"></audio>`
      : `<div>${escapeHtml(m.body)}</div>`;
    list.appendChild(el(`<div style="font-size:13px;line-height:1.4;"><b>${escapeHtml(m.author_name)}</b> <span class="mono" style="color:var(--ink-soft);font-size:11px;">${time}</span>${bodyHtml}</div>`));
  });
  box.appendChild(list);

  const row = el('<div style="display:flex;gap:8px;align-items:center;"></div>');
  const input = el('<input type="text" data-ko="1" placeholder="Écrire un message...">'); input.style.flex='1';
  const send = el('<button class="btn celadon small">Envoyer</button>');
  const doSend = async ()=>{
    const t=input.value.trim(); if(!t) return;
    const r = await sbSendChat(ACTIVE_GROUP_ID, t, null);
    if(r.error){ recStatus.style.color='var(--danger)'; recStatus.textContent = 'Envoi impossible : ' + r.error.message; return; }
    input.value=''; echoChat(r.data);
  };
  send.onclick = doSend; input.onkeydown=(e)=>{ if(e.key==='Enter') doSend(); };
  const recBtn = el('<button class="btn ghost small" title="Note vocale">🎙️</button>');
  const recStatus = el('<span style="font-size:11px;color:var(--ink-soft);"></span>');
  recBtn.onclick = async ()=>{
    if(RECORDING){
      RECORDING.stop();
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = (e)=> chunks.push(e.data);
      mr.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        RECORDING = null; VOICE_BUSY = false; recBtn.textContent = '🎙️'; recStatus.textContent = 'Envoi…';
        try{
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = await sbUploadVoiceNote(blob);
          const r = await sbSendChat(ACTIVE_GROUP_ID, '', url);
          if(r.error){ recStatus.textContent = 'Envoi impossible : ' + r.error.message; return; }
          echoChat(r.data);
          recStatus.textContent = '';
        }catch(err){ recStatus.textContent = 'Erreur d\'envoi.'; }
      };
      mr.start(); VOICE_BUSY = true;
      RECORDING = mr;
      recBtn.textContent = '⏹️';
      recStatus.textContent = 'Enregistrement…';
    }catch(err){
      recStatus.textContent = 'Micro indisponible ou refusé.';
    }
  };
  row.appendChild(input); row.appendChild(send); row.appendChild(recBtn); row.appendChild(recStatus);
  box.appendChild(row);
  return box;
}

/* ---------------- MESSAGERIE DIRECTE ÉLÈVE <-> PROF (indépendante des groupes) ---------------- */
// Un seul abonnement temps réel par session (et non un par conversation) : la
// prof reçoit les messages de TOUS les élèves, l'élève ceux de son propre fil.
// Ainsi la pastille "non lu", le bip et le titre de l'onglet fonctionnent
// depuis n'importe quelle page de l'outil.
const BASE_TITLE = document.title;
const DM_FIELDS = 'id,student_id,author_id,author_name,body,audio_url,created_at';

async function loadDMState(){
  INBOX = {}; STUDENT_LAST_DM = null;
  try{
    if(PROFILE.role==='teacher'){
      const { data } = await sb.from('direct_messages').select(DM_FIELDS).order('created_at',{ascending:false}).limit(2000);
      (data||[]).forEach(m=>{ if(!INBOX[m.student_id]) INBOX[m.student_id] = m; });
    } else {
      const { data } = await sb.from('direct_messages').select(DM_FIELDS).eq('student_id', SESSION.user.id).order('created_at',{ascending:false}).limit(1);
      STUDENT_LAST_DM = (data && data[0]) || null;
    }
  }catch(e){ /* table absente : la messagerie reste simplement vide */ }
}
function lastDMOf(threadId){ return PROFILE.role==='teacher' ? INBOX[threadId] : STUDENT_LAST_DM; }
function dmSeenAt(threadId){ const v = (PROFILE.dm_seen||{})[threadId]; return v ? new Date(v).getTime() : 0; }
// "Non lu" = le dernier message de la conversation vient de l'autre personne
// et date d'après la dernière fois que cette conversation a été ouverte.
function isThreadUnread(threadId){
  const last = lastDMOf(threadId);
  if(!last || last.author_id === SESSION.user.id) return false;
  return new Date(last.created_at).getTime() > dmSeenAt(threadId);
}
function unreadDMCount(){
  if(!PROFILE || !SESSION) return 0;
  if(PROFILE.role==='teacher') return Object.keys(INBOX).filter(isThreadUnread).length;
  return isThreadUnread(SESSION.user.id) ? 1 : 0;
}
function updateTitleBadge(){
  const n = unreadDMCount();
  document.title = (n>0 ? `(${n}) ` : '') + BASE_TITLE;
}
function dmTabLabel(key){
  const n = unreadDMCount();
  if(key==='inbox') return '💬 Messages' + (n>0 ? ` <span style="background:var(--seal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${n}</span>` : '');
  return '💬 Messagerie' + (n>0 ? ' <span style="color:var(--seal);">●</span>' : '');
}
// Met à jour les pastilles des onglets SUR PLACE, sans reconstruire la page :
// un message qui arrive ne doit jamais effacer ce que la prof est en train de
// saisir ailleurs (par exemple une leçon dans "Gérer les leçons").
function refreshTabBadges(){
  ['inbox','dm'].forEach(k=>{
    const b = document.querySelector(`.level-tab[data-space="${k}"]`);
    if(b) b.innerHTML = dmTabLabel(k);
  });
}
function markThreadSeen(threadId){
  const last = lastDMOf(threadId);
  const ts = last ? last.created_at : new Date().toISOString();
  PROFILE.dm_seen = Object.assign({}, PROFILE.dm_seen || {}, { [threadId]: ts });
  // sans la migration, la colonne n'existe pas : l'erreur est ignorée (le "lu"
  // n'est alors simplement pas retenu d'une session à l'autre)
  sb.from('profiles').update({ dm_seen: PROFILE.dm_seen }).eq('id', SESSION.user.id).then(()=>{}, ()=>{});
  updateTitleBadge();
}
function rememberLastDM(m){
  if(PROFILE.role==='teacher'){
    const cur = INBOX[m.student_id];
    if(!cur || new Date(m.created_at) >= new Date(cur.created_at)) INBOX[m.student_id] = m;
  } else if(m.student_id === SESSION.user.id){
    if(!STUDENT_LAST_DM || new Date(m.created_at) >= new Date(STUDENT_LAST_DM.created_at)) STUDENT_LAST_DM = m;
  }
}
function isDMThreadVisible(threadId){
  if(PROFILE.role==='teacher') return state.space==='inbox' && ACTIVE_DM_STUDENT_ID===threadId;
  return state.space==='dm' && threadId===SESSION.user.id;
}
// Point d'entrée UNIQUE pour tout message qui arrive dans une conversation :
// écho immédiat de ses propres envois ET messages reçus en temps réel
// (dédoublonnés par id, donc sans doublon si les deux arrivent).
async function onIncomingDM(m){
  if(!m) return;
  const already = DM.some(x=>x.id===m.id);
  rememberLastDM(m);
  const mine = m.author_id === SESSION.user.id;
  if(!mine && !already) playNotifSound();
  if(isDMThreadVisible(m.student_id)){
    if(!already) DM.push(m);
    markThreadSeen(m.student_id);
  }
  updateTitleBadge();
  const onMessagesPage = PROFILE.role==='teacher' ? state.space==='inbox' : state.space==='dm';
  if(!onMessagesPage){ refreshTabBadges(); return; }
  if(VOICE_BUSY) return;                       // ne pas casser un enregistrement vocal en cours
  const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.dmInput==='1';
  await render();
  if(typing){
    const i = document.querySelector('input[data-dm-input="1"]');
    if(i){ i.focus(); const L = i.value.length; try{ i.setSelectionRange(L,L); }catch(e){} }
  }
}

function subscribeDM(){
  unsubscribeDM();
  if(!SESSION || !PROFILE) return;
  const cfg = { event:'INSERT', schema:'public', table:'direct_messages' };
  if(PROFILE.role!=='teacher') cfg.filter = `student_id=eq.${SESSION.user.id}`;
  DM_SUB = sb.channel('dm_global_'+SESSION.user.id)
    .on('postgres_changes', cfg, payload=> onIncomingDM(payload.new))
    .subscribe();
}
function unsubscribeDM(){ if(DM_SUB){ sb.removeChannel(DM_SUB); DM_SUB=null; } }

function shortTime(iso){
  const d = new Date(iso), now = new Date();
  return d.toDateString()===now.toDateString()
    ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}

function renderDMMessages(container){
  container.innerHTML = '';
  const threadId = ACTIVE_DM_STUDENT_ID;
  const list = el('<div style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>');
  if(DM.length===0){ list.appendChild(el('<div class="empty-level">Aucun message pour l\'instant.</div>')); }
  DM.forEach(m=>{
    const time = new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const bodyHtml = m.audio_url
      ? `<audio controls src="${escapeHtml(m.audio_url)}" style="height:32px;margin-top:4px;"></audio>`
      : `<div>${escapeHtml(m.body)}</div>`;
    list.appendChild(el(`<div style="font-size:13px;line-height:1.4;"><b>${escapeHtml(m.author_name)}</b> <span class="mono" style="color:var(--ink-soft);font-size:11px;">${time}</span>${bodyHtml}</div>`));
  });
  container.appendChild(list);
  requestAnimationFrame(()=>{ list.scrollTop = list.scrollHeight; });   // toujours sur le dernier message

  const row = el('<div style="display:flex;gap:8px;align-items:center;"></div>');
  const input = el('<input type="text" data-ko="1" placeholder="Écrire un message..." data-dm-input="1">'); input.style.flex='1';
  input.value = DM_DRAFTS[threadId] || '';                                // le brouillon survit aux rafraîchissements
  input.oninput = (e)=>{ DM_DRAFTS[threadId] = e.target.value; };
  const send = el('<button class="btn celadon small">Envoyer</button>');
  const recBtn = el('<button class="btn ghost small" title="Note vocale">🎙️</button>');
  const recStatus = el('<span style="font-size:11px;color:var(--ink-soft);"></span>');
  const deliver = async (text, audioUrl, discordPreview)=>{
    const { data, error } = await sbSendDM(threadId, text, audioUrl);
    if(error){ recStatus.style.color='var(--danger)'; recStatus.textContent = 'Envoi impossible : ' + error.message; return false; }
    if(data){ onIncomingDM(data); }                                       // écho local, sans attendre le temps réel
    else { DM = await sbDMMessages(threadId); render(); }
    notifyDiscordIfStudent(discordPreview);
    return true;
  };
  const doSend = async ()=>{
    const t = input.value.trim(); if(!t) return;
    send.disabled = true; recStatus.textContent = '';
    const ok = await deliver(t, null, t);
    send.disabled = false;
    if(ok){ DM_DRAFTS[threadId] = ''; input.value = ''; }
  };
  send.onclick = doSend; input.onkeydown=(e)=>{ if(e.key==='Enter') doSend(); };
  wireVoiceRecorder(recBtn, recStatus, async (url)=>{ await deliver('', url, '🎙️ Note vocale'); });
  row.appendChild(input); row.appendChild(send); row.appendChild(recBtn); row.appendChild(recStatus);
  container.appendChild(row);
}

async function renderDMPanel(){
  const box = el('<div class="main-card"></div>');
  box.appendChild(el('<h2 style="margin:0 0 4px;">💬 Messagerie</h2>'));
  box.appendChild(el('<div class="note" style="margin-bottom:16px;">Échange privé avec le professeur : seuls toi et lui pouvez le lire. Il est indépendant des groupes.</div>'));
  const container = el('<div></div>');
  box.appendChild(container);
  renderDMMessages(container);
  return box;
}

/* ---- Sauvegarde des leçons de la professeure ---- */
function lessonsToText(rows){
  const LV = Object.assign({ hyeseon:'Hyeseon' }, LEVEL_LABELS);
  const out = [];
  let lastSpace = null;
  rows.forEach(l=>{
    if(l.space!==lastSpace){ lastSpace = l.space; out.push('##########  ' + (LV[l.space]||l.space).toUpperCase() + '  ##########', ''); }
    out.push('=== ' + l.title + ' ===');
    const segTxt = sg=> (sg.kr||'') + (sg.fr ? ' = ' + sg.fr : '');
    const dlg = Array.isArray(l.dialogue) ? l.dialogue : [];
    if(dlg.length){
      out.push('Dialogue :');
      dlg.forEach(ex=>{
        const who = ex.speaker ? ex.speaker + (ex.role?' ('+ex.role+')':'') + ' : ' : '';
        out.push('  ' + who + (ex.segments||[]).map(segTxt).join(' | '));
      });
    }
    const vo = Array.isArray(l.vowels) ? l.vowels : [];
    if(vo.length){ out.push('Voyelles :'); vo.forEach(v=>out.push('  ' + (v.kr||'') + (v.rom?' ['+v.rom+']':'') + (v.fr?' = '+v.fr:''))); }
    const vc = Array.isArray(l.vocab) ? l.vocab : [];
    if(vc.length){ out.push('Vocabulaire :'); vc.forEach(v=>out.push('  ' + (v.kr||'') + (v.rom?' ['+v.rom+']':'') + (v.fr?' = '+v.fr:''))); }
    const gr = Array.isArray(l.grammar) ? l.grammar : [];
    if(gr.length){ out.push('Grammaire :'); gr.forEach(g=>out.push('  ' + (typeof g==='string' ? g : JSON.stringify(g)))); }
    out.push('');
  });
  return out.join('\n');
}
async function exportLessons(fmt){
  const { data, error } = await sb.from('lessons').select('*').order('space').order('position');
  if(error || !data){ alert("Sauvegarde impossible pour le moment. Réessaie dans un instant."); return; }
  const d = new Date(); const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const isJson = fmt==='json';
  const content = isJson ? JSON.stringify({ exporte_le: d.toISOString(), nombre_de_lecons: data.length, lecons: data }, null, 2) : lessonsToText(data);
  const blob = new Blob([content], { type: isJson ? 'application/json' : 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'lecons-' + stamp + (isJson ? '.json' : '.txt');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

async function openSuggest(kind){
  if(state.space!=='suggest') SUGGEST_CTX = suggestContextLabel();
  state.suggestKind = kind || 'idee';
  state.space = 'suggest'; state.lessonId=null; state.controlResult=null; state.quizResult=null; state.headerMenuOpen=false;
  state.reviewMode=false; state.grammarMode=false; state.listenMode=false; state.puzzleMode=false; state.globalQuizMode=false;
  unsubscribeChat();
  SUGGESTIONS = await sbSuggestions();
  render();
}
/* ---- Prochain cours : date saisie par la professeure, compte à rebours côté élève ---- */
async function sbNextClassRows(){
  try{ const { data, error } = await sb.from('next_class').select('*'); return error ? [] : (data||[]); }catch(e){ return []; }
}
async function sbSetNextClass(type, id, iso){
  const r = iso
    ? await sb.from('next_class').upsert({ target_type:type, target_id:id, class_at:iso }, { onConflict:'target_type,target_id' })
    : await sb.from('next_class').delete().eq('target_type', type).eq('target_id', id);
  return r && r.error ? r.error : null;
}
function nextClassFor(type, id){ return (NEXT_CLASS||[]).find(x=>x.target_type===type && x.target_id===id) || null; }
// Prochain cours à venir pour l'élève : la date la plus proche entre la sienne et celle de son groupe (encore affichée 1 h après le début)
function myNextClass(now){
  if(!PROFILE || PROFILE.role!=='student') return null;
  const t = (now||Date.now()) - 3600*1000;
  return (NEXT_CLASS||[]).filter(x=> new Date(x.class_at).getTime() >= t).sort((a,b)=> new Date(a.class_at)-new Date(b.class_at))[0] || null;
}
function nextClassText(iso, now){
  const d = new Date(iso), n = new Date(now||Date.now());
  const startOf = x=> new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((startOf(d) - startOf(n)) / 86400000);
  const when = d.toLocaleString('fr-FR', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
  let rel;
  if(d.getTime() < n.getTime()) rel = 'c\'est maintenant !';
  else if(days<=0) rel = 'aujourd\'hui';
  else if(days===1) rel = 'demain';
  else rel = 'dans ' + days + ' jours';
  return { when, rel, days };
}
function renderNextClassBanner(){
  const nc = myNextClass(); if(!nc) return el('<div></div>');
  const t = nextClassText(nc.class_at);
  const hint = (t.days>=0 && t.days<=7) ? 'Un peu de révision chaque jour, et tu seras prêt(e) 📚' : '';
  return el(`<div class="note" style="margin-bottom:12px;border-color:var(--celadon-dark);display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <span>📅 <b>Prochain cours : ${escapeHtml(t.when)}</b> — ${escapeHtml(t.rel)}</span>${hint?`<span style="color:var(--ink-soft);font-size:12.5px;">${hint}</span>`:''}</div>`);
}
// Sélecteur de date pour la professeure (groupe ou élève)
function nextClassPicker(type, id){
  const cur = nextClassFor(type, id);
  const pad = n=>String(n).padStart(2,'0');
  const toLocal = iso=>{ const d = new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
  const wrap = el('<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;"></span>');
  const input = el('<input type="datetime-local" style="font-size:12px;padding:3px 6px;">');
  if(cur) input.value = toLocal(cur.class_at);
  input.onclick = e=> e.stopPropagation();
  input.onchange = async (e)=>{
    e.stopPropagation();
    const iso = input.value ? new Date(input.value).toISOString() : null;
    const err = await sbSetNextClass(type, id, iso);
    if(err){ alert("Impossible d'enregistrer : " + err.message + " (as-tu lancé migration-prochain-cours.sql ?)"); return; }
    NEXT_CLASS = await sbNextClassRows(); render();
  };
  wrap.appendChild(input);
  if(cur){
    const clr = el('<button type="button" class="btn ghost small" style="padding:2px 8px;" title="Effacer la date">✕</button>');
    clr.onclick = async (e)=>{ e.stopPropagation(); await sbSetNextClass(type, id, null); NEXT_CLASS = await sbNextClassRows(); render(); };
    wrap.appendChild(clr);
  }
  return wrap;
}

/* ---- Suggestions : idées et problèmes des élèves, lus par la professeure ---- */
async function sbSuggestions(){
  try{
    const { data, error } = await sb.from('suggestions').select('*, author:profiles(name)').order('created_at', { ascending:false }).limit(300);
    if(error){ SUGGEST_OK = false; return []; }
    SUGGEST_OK = true;
    try{ const r = await sb.from('suggestions').select('images').limit(1); SUGGEST_IMG_OK = !r.error; }catch(e){ SUGGEST_IMG_OK = false; }
    return data || [];
  }catch(e){ SUGGEST_OK = false; return []; }
}
let SUGGEST_IMG_OK = false;
const SUGGEST_BUCKET = 'suggestion-images';
// Réduit une capture (1280 px max, JPEG) : légère, lisible, quelques centaines de Ko
async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,ko)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const k = Math.min(1, 1280/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=> c.toBlob(b=>ok(b), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
// Sélecteur de captures : bouton, collage (Ctrl+V) dans la zone de texte, aperçus avec ✕
function buildImagePicker(max, pasteTarget){
  const wrap = el('<div style="margin-top:10px;"></div>');
  const blobs = [];
  const input = el('<input type="file" accept="image/*" multiple style="display:none;">');
  const add = el('<button type="button" class="btn ghost small">📎 Joindre une capture d\'écran</button>');
  const note = el('<span style="font-size:12px;color:var(--ink-soft);margin-left:8px;"></span>');
  const thumbs = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></div>');
  wrap.appendChild(input); wrap.appendChild(add); wrap.appendChild(note); wrap.appendChild(thumbs);
  const draw = ()=>{
    thumbs.innerHTML = '';
    blobs.forEach((b,i)=>{
      const u = URL.createObjectURL(b);
      const t = el(`<div style="position:relative;"><img src="${u}" alt="" style="height:72px;max-width:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);"></div>`);
      const x = el('<button type="button" title="Retirer" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--seal);color:#fff;font-size:12px;line-height:20px;padding:0;cursor:pointer;">✕</button>');
      x.onclick = ()=>{ blobs.splice(i,1); draw(); };
      t.appendChild(x); thumbs.appendChild(t);
    });
    note.textContent = blobs.length ? `${blobs.length}/${max}` : (SUGGEST_IMG_OK ? 'facultatif — sur ordinateur, tu peux aussi coller avec Ctrl+V' : '');
    add.disabled = blobs.length>=max;
  };
  const addFiles = async (files)=>{
    for(const f of files){
      if(blobs.length>=max) break;
      if(!/^image\//.test(f.type)) continue;
      try{ const b = await shrinkImage(f); if(b) blobs.push(b); }catch(e){ note.textContent = 'Image illisible.'; }
    }
    draw();
  };
  add.onclick = ()=> input.click();
  input.onchange = ()=>{ addFiles([...input.files]); input.value = ''; };
  if(pasteTarget) pasteTarget.addEventListener('paste', e=>{
    const fs = [...((e.clipboardData&&e.clipboardData.items)||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
    if(fs.length){ e.preventDefault(); addFiles(fs); }
  });
  draw();
  return { element:wrap, blobs:()=>blobs.slice() };
}
async function uploadSuggestImages(blobs){
  const paths = [];
  for(let i=0;i<blobs.length;i++){
    const path = `${SESSION.user.id}/${Date.now()}-${i}.jpg`;
    const { error } = await sb.storage.from(SUGGEST_BUCKET).upload(path, blobs[i], { contentType:'image/jpeg' });
    if(error){ if(paths.length) sb.storage.from(SUGGEST_BUCKET).remove(paths).catch(()=>{}); throw error; }
    paths.push(path);
  }
  return paths;
}
// Affiche les captures d'un message (adresses temporaires : les images restent privées)
async function fillSuggestImages(box, paths){
  if(!paths || !paths.length) return;
  try{
    const { data } = await sb.storage.from(SUGGEST_BUCKET).createSignedUrls(paths, 3600);
    (data||[]).forEach(r=>{ if(!r.signedUrl) return;
      box.appendChild(el(`<a href="${r.signedUrl}" target="_blank" rel="noopener"><img src="${r.signedUrl}" alt="capture jointe" style="height:90px;max-width:160px;object-fit:cover;border-radius:6px;border:1px solid var(--line);"></a>`));
    });
  }catch(e){}
}
function suggestImagesBox(x){
  const box = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;"></div>');
  fillSuggestImages(box, x.images);
  return box;
}
function suggestTabLabel(){
  const n = (SUGGESTIONS||[]).filter(x=>x.status==='nouveau').length;
  return '💡 Suggestions' + (n>0 ? ` <span style="background:var(--seal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;">${n}</span>` : '');
}
// Où l'élève se trouvait avant d'ouvrir l'onglet : aide la professeure à comprendre le message
function suggestContextLabel(){
  if(!PROFILE || PROFILE.role!=='student') return '';
  if(state.space==='groupe') return 'Cours en groupe';
  if(state.space==='dm') return 'Messagerie';
  if(state.reviewMode) return 'Mots à revoir';
  if(state.grammarMode) return 'Aide-mémoire grammaire';
  if(state.listenMode) return 'Mot entendu';
  if(state.puzzleMode) return 'Puzzle';
  if(state.globalQuizMode) return 'Quiz global';
  const lvl = LEVEL_LABELS[state.level] || state.level || '';
  if(state.lessonId){
    const l = (LESSONS_CACHE[state.level]||[]).find(x=>x.id===state.lessonId);
    const tabs = { cours:'Cours', memoriser:'À mémoriser', exercices:'Exercices', traduction:'Traduction', pratique:"Texte d'entraînement", quiz:'Quiz', controle:'Contrôle', revision:'Révision' };
    return (lvl + ' · ' + (l ? l.title : 'leçon') + ' · ' + (tabs[state.tab] || state.tab)).slice(0,300);
  }
  return lvl;
}
const SUGGEST_KIND = { idee:'💡 Idée', probleme:'⚠️ Problème' };
function suggestDate(t){ try{ return new Date(t).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } }
/* ---------------- Clavier coréen à l'écran ----------------
   Tout champ marqué data-ko="1" reçoit un bouton « 한 » qui ouvre un clavier
   coréen (disposition standard 2-beolsik) : les lettres s'assemblent en syllabes. */
const KB_INI = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const KB_MED = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const KB_FIN = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KB_VOW_COMBO = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const KB_FIN_COMBO = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const kbIsSyl = c => !!c && c.charCodeAt(0)>=0xAC00 && c.charCodeAt(0)<=0xD7A3;
const kbIsVowel = c => KB_MED.includes(c);
const kbIsCons = c => KB_INI.includes(c) || ['ㄳ','ㄵ','ㄶ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅄ'].includes(c);
function kbCompose(i,m,f){ return String.fromCharCode(0xAC00 + (i*21+m)*28 + f); }
function kbSplit(c){ const n=c.charCodeAt(0)-0xAC00; return { i:Math.floor(n/588), m:Math.floor((n%588)/28), f:n%28 }; }
function kbSplitFinal(fch){ for(const k in KB_FIN_COMBO){ if(KB_FIN_COMBO[k]===fch) return [k[0],k[1]]; } return null; }
// Ajoute la lettre j après le texte `before` ; renvoie le nouveau texte.
function kbAppend(before, j){
  const last = before.slice(-1), head = before.slice(0,-1);
  if(kbIsSyl(last)){
    const {i,m,f} = kbSplit(last);
    if(kbIsVowel(j)){
      if(f===0){
        const comb = KB_VOW_COMBO[KB_MED[m]+j];
        if(comb) return head + kbCompose(i, KB_MED.indexOf(comb), 0);
      } else {
        const fch = KB_FIN[f], sp = kbSplitFinal(fch);
        if(sp){ return head + kbCompose(i,m,KB_FIN.indexOf(sp[0])) + kbCompose(KB_INI.indexOf(sp[1]), KB_MED.indexOf(j), 0); }
        return head + kbCompose(i,m,0) + kbCompose(KB_INI.indexOf(fch), KB_MED.indexOf(j), 0);
      }
    } else if(kbIsCons(j)){
      if(f===0){ const fi = KB_FIN.indexOf(j); if(fi>0) return head + kbCompose(i,m,fi); }
      else { const comb = KB_FIN_COMBO[KB_FIN[f]+j]; if(comb) return head + kbCompose(i,m,KB_FIN.indexOf(comb)); }
    }
  } else if(KB_INI.includes(last) && kbIsVowel(j)){
    return head + kbCompose(KB_INI.indexOf(last), KB_MED.indexOf(j), 0);
  }
  return before + j;
}
// Efface la dernière lettre (pas la syllabe entière).
function kbBackspace(before){
  const last = before.slice(-1), head = before.slice(0,-1);
  if(!last) return before;
  if(kbIsSyl(last)){
    const {i,m,f} = kbSplit(last);
    if(f>0){ const sp = kbSplitFinal(KB_FIN[f]); return head + kbCompose(i,m, sp ? KB_FIN.indexOf(sp[0]) : 0); }
    const mch = KB_MED[m];
    for(const k in KB_VOW_COMBO){ if(KB_VOW_COMBO[k]===mch) return head + kbCompose(i, KB_MED.indexOf(k[0]), 0); }
    return head + KB_INI[i];
  }
  return head;
}
const KB_ROWS = [
  ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],
  ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
  ['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']
];
const KB_SHIFT = {'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};

function attachKoKeyboard(field){
  if(field.dataset.koDone) return;
  field.dataset.koDone = '1';
  const par = field.parentNode; if(!par) return;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'ko-btn'; btn.textContent = '한'; btn.title = 'Clavier coréen';
  btn.setAttribute('aria-label','Ouvrir le clavier coréen');
  let flexRow = false;
  try{ flexRow = field.tagName==='INPUT' && /flex/.test(getComputedStyle(par).display); }catch(e){}
  let anchor;
  if(flexRow){ par.insertBefore(btn, field.nextSibling); anchor = par; }
  else { const w = document.createElement('div'); w.className = 'ko-wrap'; w.appendChild(btn); field.parentNode.insertBefore(w, field.nextSibling); anchor = w; }

  let panel = null, shift = false;
  const prevMode = field.getAttribute('inputmode');
  const press = (key)=>{
    const start = field.selectionStart==null ? field.value.length : field.selectionStart;
    const end = field.selectionEnd==null ? start : field.selectionEnd;
    const sel = end>start;
    let before = field.value.slice(0, start), after = field.value.slice(end);
    if(key==='⌫'){ before = sel ? before : kbBackspace(before); }
    else if(key==='␣'){ before += ' '; }
    else { before = kbAppend(before, key); }
    field.value = before + after;
    try{ field.setSelectionRange(before.length, before.length); }catch(e){}
    field.dispatchEvent(new Event('input',{bubbles:true}));
  };
  const build = ()=>{
    panel.innerHTML = '';
    const mk = (label, cls, fn)=>{
      const b = document.createElement('button');
      b.type='button'; b.className='ko-key '+(cls||''); b.textContent=label; b.tabIndex=-1;
      b.onmousedown = e=>e.preventDefault();
      b.onclick = ()=>{ fn(); };
      return b;
    };
    KB_ROWS.forEach(row=>{
      const r = document.createElement('div'); r.className='ko-row';
      row.forEach(k=>{
        if(k==='⇧') r.appendChild(mk('⇧', 'wide'+(shift?' on':''), ()=>{ shift=!shift; build(); }));
        else if(k==='⌫') r.appendChild(mk('⌫','wide',()=>press('⌫')));
        else { const shown = shift && KB_SHIFT[k] ? KB_SHIFT[k] : k; r.appendChild(mk(shown,'',()=>{ press(shown); if(shift){ shift=false; build(); } })); }
      });
      panel.appendChild(r);
    });
    const last = document.createElement('div'); last.className='ko-row';
    last.appendChild(mk('espace','space',()=>press('␣')));
    ['.',',','?','!'].forEach(p=> last.appendChild(mk(p,'punct',()=>press(p))));
    panel.appendChild(last);
  };
  const close = ()=>{
    if(panel){ panel.remove(); panel = null; }
    btn.classList.remove('on');
    if(prevMode==null) field.removeAttribute('inputmode'); else field.setAttribute('inputmode', prevMode);
  };
  btn.onmousedown = e=>e.preventDefault();
  btn.onclick = ()=>{
    if(panel){ close(); return; }
    panel = document.createElement('div'); panel.className = 'ko-kb';
    build();
    anchor.parentNode.insertBefore(panel, anchor.nextSibling);
    btn.classList.add('on');
    field.setAttribute('inputmode','none');   // évite que le clavier du téléphone se superpose
    try{ const wasFocused = document.activeElement===field; field.focus({preventScroll:true}); if(!wasFocused) field.setSelectionRange(field.value.length, field.value.length); }catch(e){}
  };
}
function scanKoKeyboards(root){
  (root.querySelectorAll ? root.querySelectorAll('[data-ko]') : []).forEach(attachKoKeyboard);
  if(root.matches && root.matches('[data-ko]')) attachKoKeyboard(root);
}
(function(){
  const start = ()=>{
    scanKoKeyboards(document.body);
    new MutationObserver(muts=>{
      muts.forEach(m=> m.addedNodes.forEach(n=>{ if(n.nodeType===1) scanKoKeyboards(n); }));
    }).observe(document.body, {childList:true, subtree:true});
  };
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();

function petalBurst(){
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cols=['#B8433A','#C08A2E','#6E8F78','#E8B7B0','#211D1A','#F3C8D0'];
    for(let i=0;i<45;i++){ const p=document.createElement('div'); p.className='petal';
      p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%cols.length];
      p.style.setProperty('--dx',(Math.random()*160-80)+'px'); p.style.setProperty('--r',(Math.random()*720-360)+'deg');
      p.style.animationDuration=(2+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(p); setTimeout(()=>p.remove(),4500); }
  }catch(e){}
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>false);
  try{ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return Promise.resolve(ok); }catch(e){ return Promise.resolve(false); }
}

/* ---- « Où ça pèche » : les mots les plus ratés, leçon par leçon ---- */
function weakSpotsOf(lessonId, students){
  const names = {}; students.forEach(p=>names[p.id]=p.name);
  const byWord = {};
  ALL_PROGRESS.filter(r=>r.lesson_id===lessonId && r.misses && names[r.student_id]).forEach(r=>{
    Object.keys(r.misses).forEach(kr=>{
      const e = r.misses[kr] || {}; if(!(e.m>0)) return;
      const w = byWord[kr] || (byWord[kr] = { kr, m:0, c:0, who:[] });
      w.m += e.m; w.c += (e.c||0); w.who.push({ name:names[r.student_id], m:e.m });
    });
  });
  return Object.values(byWord).sort((a,b)=> (b.who.length-a.who.length) || (b.m-a.m) || a.kr.localeCompare(b.kr));
}
function renderWeakSpots(students, flat){
  const box = el('<div class="section-block" style="border:1.5px dashed var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:26px;"></div>');
  box.appendChild(el('<h3 style="margin-top:0;">🎯 Où ça pèche</h3>'));
  const withData = {};
  ALL_PROGRESS.forEach(r=>{ if(r.misses && Object.keys(r.misses).some(k=>r.misses[k] && r.misses[k].m>0)) withData[r.lesson_id] = (withData[r.lesson_id]||0) + 1; });
  const ids = Object.keys(withData).filter(id=>flat[id]);
  if(!ids.length){
    box.appendChild(el('<div class="note">Les mots que les élèves ratent dans les exercices, quiz et contrôles apparaîtront ici, leçon par leçon, pour savoir quoi reprendre au prochain cours. (Si rien n\'apparaît après leurs premiers essais, lance <b>migration-erreurs.sql</b> dans Supabase.)</div>'));
    return box;
  }
  if(!state.weakLesson || !withData[state.weakLesson]) state.weakLesson = ids.sort((a,b)=> (withData[b]-withData[a]))[0];
  const sel = el('<select style="margin-bottom:12px;max-width:100%;"></select>');
  ids.forEach(id=>{ const o = el(`<option value="${escapeHtml(id)}">${escapeHtml(flat[id].title)} (${escapeHtml(LEVEL_LABELS[flat[id].level]||'')})</option>`); if(id===state.weakLesson) o.selected = true; sel.appendChild(o); });
  sel.onchange = ()=>{ state.weakLesson = sel.value; render(); };
  box.appendChild(sel);
  const list = weakSpotsOf(state.weakLesson, students).slice(0, 12);
  if(!list.length){ box.appendChild(el('<div class="note">Aucun mot raté pour cette leçon.</div>')); return box; }
  const words = flat[state.weakLesson].words || {};
  box.appendChild(el('<div class="note" style="margin-bottom:10px;font-size:12.5px;">Les mots les plus ratés d\'abord (nombre d\'élèves concernés, puis nombre d\'erreurs). C\'est une bonne liste pour ouvrir le prochain cours.</div>'));
  list.forEach(w=>{
    const who = w.who.sort((a,b)=>b.m-a.m).slice(0,5).map(x=>`${escapeHtml(x.name)} (${x.m})`).join(', ') + (w.who.length>5 ? ' …' : '');
    box.appendChild(el(`<div class="vocab-row" style="align-items:flex-start;gap:10px;"><span><span class="kr" style="font-size:17px;">${escapeHtml(w.kr)}</span>${words[w.kr]?` <span style="color:var(--ink-soft);font-size:12px;">${escapeHtml(words[w.kr])}</span>`:''}</span><span style="text-align:right;font-size:12px;">${w.m} erreur${w.m>1?'s':''} · ${w.who.length} élève${w.who.length>1?'s':''}<br><span style="color:var(--ink-soft);">${who}</span></span></div>`));
  });
  return box;
}

/* ---- Boîte de réception de la prof : une conversation par élève ---- */
async function enterInbox(preferredStudentId){
  state.space = 'inbox'; state.lessonId = null; state.reviewMode=false; state.grammarMode=false; state.listenMode=false; state.puzzleMode=false; state.globalQuizMode = false;
  unsubscribeChat();
  ALL_PROFILES = await sbAllProfiles();
  await loadDMState();
  const students = ALL_PROFILES.filter(p=>p.role==='student');
  const has = id => !!id && students.some(s=>s.id===id);
  let id = has(preferredStudentId) ? preferredStudentId : (has(ACTIVE_DM_STUDENT_ID) ? ACTIVE_DM_STUDENT_ID : null);
  if(!id){
    const lastTs = s => INBOX[s.id] ? new Date(INBOX[s.id].created_at).getTime() : 0;
    const unread = students.find(s=>isThreadUnread(s.id));
    const recent = students.slice().sort((a,b)=> lastTs(b)-lastTs(a))[0];
    id = (unread || recent || {}).id || null;
  }
  ACTIVE_DM_STUDENT_ID = id;
  DM = id ? await sbDMMessages(id) : [];
  if(id) markThreadSeen(id);
  render();
}
async function openInboxThread(studentId){
  ACTIVE_DM_STUDENT_ID = studentId;
  DM = await sbDMMessages(studentId);
  markThreadSeen(studentId);
  render();
}
async function renderInbox(){
  const students = ALL_PROFILES.filter(p=>p.role==='student');
  const layout = el('<div class="layout"></div>');

  const side = el('<div class="sidebar"></div>');
  side.appendChild(el('<h3 style="margin:0 0 12px;font-size:15px;">Conversations</h3>'));
  if(students.length===0){ side.appendChild(el('<div class="empty-level">Aucun élève pour l\'instant.</div>')); }
  const lastTs = s => INBOX[s.id] ? new Date(INBOX[s.id].created_at).getTime() : 0;
  students.slice().sort((a,b)=> (lastTs(b)-lastTs(a)) || a.name.localeCompare(b.name)).forEach(st=>{
    const last = INBOX[st.id];
    const unread = isThreadUnread(st.id);
    const preview = !last ? 'Aucun message' : ((last.author_id===SESSION.user.id ? 'Toi : ' : '') + (last.audio_url ? '🎙️ Note vocale' : last.body));
    const active = st.id===ACTIVE_DM_STUDENT_ID;
    const item = el(`<div data-thread="${st.id}" style="border:1.5px solid ${active?'var(--ink)':'var(--line)'};background:${active?'var(--paper-dim)':'transparent'};border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;">
        <span style="${unread?'font-weight:700;':''}">${escapeHtml(st.name)}${unread?' <span style="color:var(--seal);">●</span>':''}</span>
        <span class="mono" style="font-size:10px;color:var(--ink-soft);white-space:nowrap;">${last?shortTime(last.created_at):''}</span>
      </div>
      <div style="font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;color:${unread?'var(--ink)':'var(--ink-soft)'};">${escapeHtml(preview)}</div>
    </div>`);
    item.onclick = ()=> openInboxThread(st.id);
    side.appendChild(item);
  });

  const main = el('<div class="main-card"></div>');
  const active = students.find(s=>s.id===ACTIVE_DM_STUDENT_ID);
  if(!active){
    main.appendChild(el('<div class="empty-state">Choisis un élève dans la liste pour voir ou écrire un message.</div>'));
  } else {
    main.appendChild(el(`<h2 style="margin:0 0 4px;">💬 ${escapeHtml(active.name)}</h2>`));
    main.appendChild(el('<div class="note" style="margin-bottom:16px;">Fil privé avec cet élève — personne d\'autre n\'y a accès.</div>'));
    const container = el('<div></div>');
    main.appendChild(container);
    renderDMMessages(container);
  }
  layout.appendChild(side); layout.appendChild(main);
  return layout;
}

/* ---------------- INIT ---------------- */
sb.auth.onAuthStateChange((event, session)=>{ /* handled manually via doLogin/doLogout to keep control flow simple */ });
boot();

} // end runApp
