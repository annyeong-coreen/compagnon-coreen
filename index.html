async function sbLessons(space){
  const {data,error} = await sb.from('lessons').select('*').eq('space',space).order('position');
  if(error){ console.error(error); return []; }
  // retire du vocabulaire les entrées abîmées par d'anciennes modifications (voir isJunkVocab)
  return (data||[]).map(l=> Array.isArray(l.vocab) ? Object.assign({}, l, { vocab:l.vocab.filter(v=>!isJunkVocab(v)) }) : l);
}

async function sbAllProgressForSelf(){
  const {data} = await sb.from('progress').select('*').eq('student_id', SESSION.user.id);
  const map = {}; (data||[]).forEach(r=>map[r.lesson_id]=r); return map;
}
async function sbUpsertProgress(lessonId, patch){
  const existing = PROGRESS[lessonId] || {};
  const merged = Object.assign({student_id:SESSION.user.id, lesson_id:lessonId}, existing, patch);
  delete merged.updated_at;
  const payload = Object.assign({}, merged); delete payload.misses;     // les mots ratés ont leur propre enregistrement (sbRecordAnswers)
  await sb.from('progress').upsert(payload, {onConflict:'student_id,lesson_id'});
  PROGRESS[lessonId] = merged;
  markStudyDay();
}
// « Où ça pèche » : pour chaque mot, nombre de fois raté (m) et réussi (c), par leçon. Sans la migration, on ignore sans rien casser.
async function sbRecordAnswers(lessonId, results){
  try{
    if(!lessonId || !results || !results.length || !SESSION || !PROFILE || PROFILE.role!=='student') return;
    markStudyDay();
    const cur = Object.assign({}, (PROGRESS[lessonId] && PROGRESS[lessonId].misses) || {});
    results.forEach(r=>{
      const k = String(r.kr||'').trim().slice(0,60); if(!k) return;
      const e = Object.assign({ m:0, c:0 }, cur[k]||{}); if(r.ok) e.c++; else e.m++; cur[k] = e;
    });
    const { error } = await sb.from('progress').upsert({ student_id:SESSION.user.id, lesson_id:lessonId, misses:cur }, { onConflict:'student_id,lesson_id' });
    if(!error) PROGRESS[lessonId] = Object.assign({ student_id:SESSION.user.id, lesson_id:lessonId }, PROGRESS[lessonId]||{}, { misses:cur });
  }catch(e){ /* colonne absente ou réseau : on laisse tomber, l'élève n'est pas gêné */ }
}

async function sbAddWeakWord(word, meaning, note){
  if(!SESSION || PROFILE.role!=='student') return;
  const existing = WEAK_WORDS.find(w=>w.word===word);
  if(existing) return; // déjà suivi
  const row = {student_id:SESSION.user.id, word, meaning, hit_count:1};
  let savedNote = null;
  if(note){
    const r = await sb.from('weak_words').upsert(Object.assign({note}, row), {onConflict:'student_id,word'});
    if(!r || !r.error) savedNote = note;
    else await sb.from('weak_words').upsert(row, {onConflict:'student_id,word'});   // colonne « note » pas encore créée
  }else{
    await sb.from('weak_words').upsert(row, {onConflict:'student_id,word'});
  }
  WEAK_WORDS.push({word, meaning, note: savedNote || note || null});
}
async function sbAddWeakWordsBulk(items){
  if(!SESSION || PROFILE.role!=='student' || items.length===0) return 0;
  const fresh = items.filter(it=>!WEAK_WORDS.find(w=>w.word===it.kr));
  if(fresh.length===0) return 0;
  const rows = fresh.map(it=>({student_id:SESSION.user.id, word:it.kr, meaning:it.fr, hit_count:1}));
  await sb.from('weak_words').upsert(rows, {onConflict:'student_id,word'});
  fresh.forEach(it=> WEAK_WORDS.push({word:it.kr, meaning:it.fr}));
  return fresh.length;
}

  WEAK_WORDS = WEAK_WORDS.filter(w=>w.word!==word);
}

// Révision espacée + série de jours (voir migration-revision.sql). Sans la migration, tout marche, mais rien n'est gardé entre deux sessions.
let STUDY_DAYS = [], ALL_STUDY_DAYS = null, SRS_OK = true, STUDY_OK = true;
const SRS_STEPS = [0,1,3,7,14,30];     // jours avant la prochaine révision, selon la « boîte » du mot
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return dateStr(new Date()); }
function addDaysStr(n){ const d=new Date(); d.setDate(d.getDate()+n); return dateStr(d); }
function wwDue(w){ return !w.due_at || String(w.due_at).slice(0,10) <= todayStr(); }
function dueWords(){ return WEAK_WORDS.filter(wwDue); }
async function srsRecord(word, ok){
  const w = WEAK_WORDS.find(x=>x.word===word); if(!w) return;
  w.box = ok ? Math.min((w.box||0)+1, SRS_STEPS.length-1) : 0;
  w.due_at = addDaysStr(SRS_STEPS[w.box]);
  if(!SRS_OK || !SESSION || !PROFILE || PROFILE.role!=='student') return;
  try{
    const r = await sb.from('weak_words').update({box:w.box, due_at:w.due_at}).eq('student_id', SESSION.user.id).eq('word', word);
    if(r && r.error) SRS_OK = false;
  }catch(e){ SRS_OK = false; }
}
async function sbLoadStudyDays(){
  try{
    const {data,error} = await sb.from('study_days').select('day').eq('student_id', SESSION.user.id).order('day',{ascending:false}).limit(400);
    if(error) throw error;
    STUDY_DAYS = (data||[]).map(r=>String(r.day).slice(0,10)); STUDY_OK = true;
  }catch(e){ STUDY_OK = false; STUDY_DAYS = []; }
}
async function markStudyDay(){
  if(!SESSION || !PROFILE || PROFILE.role!=='student') return;
  const t = todayStr(); if(STUDY_DAYS.includes(t)) return;
  STUDY_DAYS.unshift(t);
  if(!STUDY_OK) return;
  try{ const r = await sb.from('study_days').upsert({student_id:SESSION.user.id, day:t}, {onConflict:'student_id,day'}); if(r && r.error) STUDY_OK = false; }catch(e){ STUDY_OK = false; }
}
function studyStreak(){
  const set = new Set(STUDY_DAYS); let n = 0, i = set.has(todayStr()) ? 0 : -1;
  while(set.has(addDaysStr(i))){ n++; i--; }
  return n;
}
async function sbAllStudyDays(){
  try{
    const {data,error} = await sb.from('study_days').select('student_id,day').gte('day', addDaysStr(-14));
    if(error) return null; return data||[];
  }catch(e){ return null; }
}

let GRAMMAR_SEEN = [];
let GRAMMAR_TABLE_OK = true;
async function sbLoadGrammarSeen(){
  GRAMMAR_SEEN = []; GRAMMAR_TABLE_OK = true;
  if(!SESSION || !PROFILE || PROFILE.role!=='student') return;
  try{
    const res = await sb.from('grammar_seen').select('*').eq('student_id', SESSION.user.id);
    if(res.error) throw res.error;
    GRAMMAR_SEEN = res.data || [];
  }catch(e){ GRAMMAR_TABLE_OK = false; }
}
let FICHE_SAVE_OK = true;     // faux tant que migration-fiches.sql n'est pas lancée : les fiches ne durent alors que la session
async function markGrammarSeen(kind, key){
  if(!SESSION || !PROFILE || PROFILE.role!=='student') return;
  if(GRAMMAR_SEEN.some(g=>g.kind===kind && g.key===key)) return;
  GRAMMAR_SEEN.push({ kind, key, created_at:new Date().toISOString(), _session:true });
  if(!GRAMMAR_TABLE_OK || (kind==='fiche' && !FICHE_SAVE_OK)) return;
  try{
    const res = await sb.from('grammar_seen').upsert({ student_id:SESSION.user.id, kind, key }, { onConflict:'student_id,kind,key', ignoreDuplicates:true });
    if(res && res.error){ if(kind==='fiche') FICHE_SAVE_OK = false; else GRAMMAR_TABLE_OK = false; }
  }catch(e){ if(kind==='fiche') FICHE_SAVE_OK = false; else GRAMMAR_TABLE_OK = false; }
}

function grammarVisitKey(){ return 'grammarNotebookVisit:' + (SESSION ? SESSION.user.id : ''); }
function openGrammarNotebookVisit(){
  try{
    GRAMMAR_VISIT_BASELINE = localStorage.getItem(grammarVisitKey()) || '';
    localStorage.setItem(grammarVisitKey(), new Date().toISOString());
  }catch(e){ GRAMMAR_VISIT_BASELINE = null; }
}
function isGrammarEntryNew(entry){
  return !!(entry && (entry._session || (GRAMMAR_VISIT_BASELINE!==null && (entry.created_at||'') > GRAMMAR_VISIT_BASELINE)));
}
async function unmarkGrammarSeen(kind, key){
  GRAMMAR_SEEN = GRAMMAR_SEEN.filter(g=>!(g.kind===kind && g.key===key));
  if(!GRAMMAR_TABLE_OK) return;
  try{ await sb.from('grammar_seen').delete().eq('student_id', SESSION.user.id).eq('kind', kind).eq('key', key); }catch(e){}
}

const KO_PARTICLES = ['에서','으로','에게','한테','까지','부터','이라','라서','이고','에','는','은','이','가','을','를','로','와','과','도','만','의','께'];
function stripKoParticle(word){
  for(const p of KO_PARTICLES){
    if(word.length>p.length && word.endsWith(p)) return word.slice(0, -p.length);
  }
  return word;
}
let KRDICT_UNAVAILABLE = false; // évite de retenter à chaque mot si non configuré

/* GRAMMAR:BEGIN — expressions de grammaire courantes, reconnues localement (gratuit,
   sans API). Un dictionnaire comme KRDict ne connaît que des mots isolés : il ne sait
   pas que "탈 수 있어요" veut dire "pouvoir prendre". Ici, on repère l'expression sur
   plusieurs mots d'une phrase et on affiche son sens.
   - tests : un test par mot consécutif (RegExp ou fonction)
   - fn    : positions des mots purement grammaticaux (수, 있어요…) : pas de recherche
             dictionnaire pour eux, seulement l'explication de l'expression
   - stem  : comment retrouver la forme du dictionnaire du verbe (position 0) */
function hFinal(ch){ const c = (ch||'').charCodeAt(0) - 0xAC00; return (c>=0 && c<11172) ? c % 28 : -1; }
function endsRieul(t){ return t.endsWith('을') || hFinal(t.slice(-1))===8; }
function endsNieun(t){ return t.endsWith('은') || hFinal(t.slice(-1))===4; }
function dropFinal(syl){ const f = hFinal(syl); return f>0 ? String.fromCharCode(syl.charCodeAt(0)-f) : syl; }
function stripSuffixes(t, sufs){
  for(const s of sufs){ if(t.length>s.length && t.endsWith(s)) return t.slice(0,-s.length); }
  return null;
}
// Radical d'une forme en -아/어 : "가" -> "가", "먹어" -> "먹", "해" -> "하", "와" -> "오", "봐" -> "보", "줘" -> "주", "마셔" -> "마시"
function aoBase(t){
  if(!t) return null;
  const last = t.slice(-1), c = last.charCodeAt(0) - 0xAC00;
  if(t.length>1 && (last==='아' || last==='어')) return t.slice(0,-1);
  if(last==='해') return t.slice(0,-1) + '하';
  if(c>=0 && c<11172 && c%28===0){
    const v = Math.floor(c/28) % 21;
    if(v===0 || v===4) return t;                                              // 가, 서, 사… (voyelle de 아/어 absorbée)
    if(v===9 || v===14) return t.slice(0,-1) + String.fromCharCode(0xAC00+c-28);   // 와->오, 봐->보, 줘->주
    if(v===6) return t.slice(0,-1) + String.fromCharCode(0xAC00+c+14*28);          // 셔->시
  }
  return null;
}
const GRAMMAR_STEMS = {
  go:      t=>stripSuffixes(t,['고']),
  ji:      t=>stripSuffixes(t,['지']),
  gi:      t=>stripSuffixes(t,['기']),
  reo:     t=>stripSuffixes(t,['으러','러']),
  ryeogo:  t=>stripSuffixes(t,['으려고','려고']),
  seyo:    t=>stripSuffixes(t,['으세요','세요']),
  rieul:   t=>{ if(t.endsWith('을') && t.length>1) return t.slice(0,-1); if(hFinal(t.slice(-1))===8) return t.slice(0,-1)+dropFinal(t.slice(-1)); return null; },
  rieul2:  t=>GRAMMAR_STEMS.rieul(t.slice(0,-2)),
  ao:      t=>aoBase(t),
  aoya:    t=>{ const r = stripSuffixes(t,['야']); return r ? aoBase(r) : null; },
  aodo:    t=>{ const r = stripSuffixes(t,['도']); return r ? aoBase(r) : null; },
  myeon:   t=>stripSuffixes(t,['으면','면']),
  neun:    t=>stripSuffixes(t,['는']),
  nieun:   t=>{ if(t.endsWith('은') && t.length>1) return t.slice(0,-1); if(hFinal(t.slice(-1))===4) return t.slice(0,-1)+dropFinal(t.slice(-1)); return null; }
};
// Forme du dictionnaire d'un verbe conjugué ("탈" -> "타다"), ou null si on ne sait pas
function verbDictionaryForm(token, stemKey){
  const f = GRAMMAR_STEMS[stemKey]; if(!f) return null;
  const base = f(token);
  return base ? base + '다' : null;
}
const AO_END = /[아어여해와워줘봐]$/; // forme en -아/어 (pour distinguer "도와 주세요" de "커피 주세요")
// version plus large pour "보다" : toute syllabe ouverte en ㅏ/ㅐ/ㅓ/ㅕ ("가 봤어요"), mais pas "영화 봤어요"
function aoEndWide(t){
  const last = t.slice(-1), c = last.charCodeAt(0) - 0xAC00;
  if(AO_END.test(t)) return true;
  return c>=0 && c<11172 && c%28===0 && [0,1,4,6].includes(Math.floor(c/28)%21);
}

// Formes de dictionnaire possibles d'un verbe conjugué courant ("가요" -> "가다").
// "strong" : terminaisons qui sont presque toujours un verbe (…요, …습니다) -> on les essaie
// avant le mot entier. "weak" : terminaisons ambiguës (…고, …지 : 바지, 냉장고) -> après le mot entier.
// Tout est vérifié dans KRDict seul : une forme inconnue du dictionnaire est simplement écartée.
function guessVerbBases(t){
  const strong = [], weak = [];
  const add = (arr, b)=>{ if(b && b.length>=2 && !strong.includes(b) && !weak.includes(b)) arr.push(b); };
  let m;
  if((m = t.match(/^(.+)(했어요|했습니다|합니다|해요|하세요)$/))) add(strong, m[1]+'하다');
  if((m = t.match(/^(.+)(습니다|았어요|었어요|아요|어요|으세요|세요)$/))) add(strong, m[1]+'다');
  if(t.endsWith('니다') && hFinal(t.slice(-3,-2))===17) add(strong, t.slice(0,-3)+dropFinal(t.slice(-3,-2))+'다');
  if(t.endsWith('요') && t.length>=2){
    const syl = t.slice(-2,-1), c = syl.charCodeAt(0)-0xAC00;
    if(c>=0 && c<11172 && c%28===0){
      const v = Math.floor(c/28)%21, pre = t.slice(0,-2);
      if(v===0 || v===4) add(strong, t.slice(0,-1)+'다');                                   // 가요, 서요
      else if(v===9 || v===14) add(strong, pre+String.fromCharCode(0xAC00+c-28)+'다');       // 와요 -> 오다, 봐요 -> 보다, 줘요 -> 주다
      else if(v===6)  add(strong, pre+String.fromCharCode(0xAC00+c+14*28)+'다');             // 마셔요 -> 마시다
    }
  }
  if((m = t.match(/^(.+)(하고|하지|하는)$/))) add(weak, m[1]+'하다');
  if((m = t.match(/^(.+)(고|지)$/))) add(weak, m[1]+'다');
  return { strong, weak };
}
function grammarTestOk(test, tok){ return typeof test === 'function' ? !!test(tok) : test.test(tok); }
// words : liste des mots nettoyés d'une phrase (sans ponctuation).
// Renvoie pour chaque mot la liste des expressions qui le contiennent.
function findGrammarPatterns(words){
  const perWord = words.map(()=>[]);
  GRAMMAR_PATTERNS.forEach(pat=>{
    const n = pat.tests.length;
    for(let i=0; i+n<=words.length; i++){
      let ok = true;
      for(let k=0; k<n; k++){ if(!grammarTestOk(pat.tests[k], words[i+k])){ ok=false; break; } }
      if(!ok) continue;
      const text = words.slice(i,i+n).join(' ');
      for(let k=0; k<n; k++) perWord[i+k].push({ pat, pos:k, text });
    }
  });
  return perWord;
}

const PARTICLE_SURFACE_TO_KEY = {'은':'은/는','는':'은/는','이':'이/가','가':'이/가','을':'을/를','를':'을/를','에':'에','에서':'에서','에게':'에게/한테','한테':'에게/한테','께':'께','도':'도','만':'만','으로':'으로/로','로':'으로/로','와':'와/과','과':'와/과','하고':'하고','이랑':'(이)랑','랑':'(이)랑','의':'의','부터':'부터','까지':'까지','보다':'보다','마다':'마다','처럼':'처럼','이에요':'이에요/예요','예요':'이에요/예요','입니다':'이에요/예요'};
const PARTICLE_ENDINGS = Object.keys(PARTICLE_SURFACE_TO_KEY).sort((a,b)=>b.length-a.length);
// Particules qui, seules entre deux espaces, ne peuvent pas être un autre mot (contrairement à 이, 도, 만…)
const BARE_PARTICLES = ['가','를','을','는','은','에','에서','에게','한테','께','부터','까지','로','으로','와','과','의','하고','랑'];
// Retire jusqu'à 2 particules collées en fin de mot : "서울에서는" -> [{stem:'서울에서', parts:['는']}, {stem:'서울', parts:['에서','는']}]
function particleCandidates(tok){
  const out = []; let cur = tok, parts = [];
  for(let i=0; i<2; i++){
    const hit = PARTICLE_ENDINGS.find(p=> cur.length>p.length && cur.endsWith(p));
    if(!hit) break;
    parts = [hit].concat(parts); cur = cur.slice(0,-hit.length);
    out.push({ stem:cur, parts:parts.slice() });
  }
  return out;
}
function particleKeysOf(parts){ return [...new Set(parts.map(p=>PARTICLE_SURFACE_TO_KEY[p]).filter(Boolean))]; }

const COUNTER_KEYS = Object.keys(COUNTER_REF).sort((a,b)=>b.length-a.length);
const COUNTER_REST = ['','이','가','은','는','을','를','도','만','에','에서','씩','째','쯤','이나','나','밖에','정도','이에요','예요','입니다','으로','로','의','와','과','하고','까지','부터','마다','이고','요'];
const KO_DET = {한:1,두:2,세:3,석:3,서:3,네:4,넉:4,너:4};
const FR_NUMBERS = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];
// Valeur d'un nombre placé devant un classificateur : chiffres, sino-coréen, natif (한, 두, 세, 네, 스무, 열두…)
function counterNumberValue(w){
  if(/^\d[\d,]*$/.test(w)) return parseInt(w.replace(/,/g,''),10);
  if(w==='스무') return 20;
  if(w in KO_DET) return KO_DET[w];
  for(const t of Object.keys(KO_NATIVE_TENS)){
    if(w.startsWith(t) && (w.slice(t.length) in KO_DET)) return KO_NATIVE_TENS[t] + KO_DET[w.slice(t.length)];
  }
  return koNumeralToNumber(w);
}
function matchCounterWord(w){
  for(const c of COUNTER_KEYS){
    if(w.startsWith(c) && COUNTER_REST.includes(w.slice(c.length))) return c;
  }
  return null;
}
// Pour chaque mot : null, ou { role:'number'|'counter', key, number } quand il fait partie d'un "nombre + classificateur"
function findCounters(words){
  const out = words.map(()=>null);
  for(let i=0; i<words.length; i++){
    const m = words[i].match(/^(\d[\d,]*)(\D.*)$/);                       // 3명, 12개
    if(m){ const c = matchCounterWord(m[2]); if(c) out[i] = { role:'counter', key:c, number:parseInt(m[1].replace(/,/g,''),10) }; continue; }
    if(i+1 >= words.length) continue;
    const val = counterNumberValue(words[i]);
    if(val===null) continue;
    const c = matchCounterWord(words[i+1]);
    if(!c) continue;
    if(words[i]==='이' && !['층','원','월','년','시'].includes(c)) continue;   // "이 분" = « cette personne », pas « 2 personnes »
    out[i]   = { role:'number',  key:c, number:val };
    out[i+1] = { role:'counter', key:c, number:val };
  }
  return out;
}
function frNumberWord(n){ return (n>=0 && n<=20) ? FR_NUMBERS[n] : String(n); }

// Cherche un mot dans KRDict (verbe sous sa forme du dictionnaire, mot entier, particules en moins),
// puis en dernier recours avec le repli habituel. Renvoie { word, variants, particles }.
/* Formules toutes faites : le dictionnaire ne les contient pas telles quelles, et les ramener à un verbe donnerait un faux sens (안녕하세요 ≠ « calme ») */
const FIXED_PHRASES = {
  '안녕하세요':['bonjour (poli)'], '안녕하십니까':['bonjour (très formel)'], '안녕':['salut (familier)','au revoir (familier)'],
  '안녕히계세요':['au revoir (à celui qui reste)'], '안녕히가세요':['au revoir (à celui qui part)'],
  '감사합니다':['merci (formel)'], '고맙습니다':['merci (formel)'], '고마워요':['merci'], '고마워':['merci (familier)'], '감사해요':['merci'],
  '죄송합니다':['je suis désolé(e) (formel)'], '죄송해요':['je suis désolé(e)'], '미안해요':['désolé(e)'], '미안합니다':['désolé(e) (formel)'], '미안해':['désolé(e) (familier)'],
  '괜찮아요':['ça va, ce n\'est pas grave'], '괜찮습니다':['ça va, ce n\'est pas grave (formel)'], '괜찮아':['ça va (familier)'],
  '실례합니다':['excusez-moi','pardon'], '어서오세요':['bienvenue'], '처음뵙겠습니다':['enchanté(e) (première rencontre)'],
  '잘먹겠습니다':['merci pour le repas (avant de manger)'], '잘먹었습니다':['merci pour le repas (après avoir mangé)'],
  '수고하셨습니다':['merci pour votre travail'], '수고하세요':['bon courage'], '안녕히주무세요':['bonne nuit (poli)'],
  '축하해요':['félicitations'], '축하합니다':['félicitations (formel)'], '환영합니다':['bienvenue (formel)'], '또만나요':['à bientôt'],
  '여보세요':['allô'], '화이팅':['courage ! allez !'], '파이팅':['courage ! allez !'], '대박':['incroyable, génial (familier)'], '아이고':['oh là là, aïe'],
  '맞아요':['c\'est ça, exact'], '알겠습니다':['compris (formel)'], '알겠어요':['compris'], '몰라요':['je ne sais pas'], '그래요':['c\'est vrai ? / oui, en effet'],
  '네':['oui'], '아니요':['non'], '잠깐만요':['un instant'], '천만에요':['de rien']
};
async function lookupWordSmart(clean, preferredBase){
  { const fp = FIXED_PHRASES[String(clean).replace(/\s+/g,'')]; if(fp) return { word:clean, variants:fp.slice(), particles:[] }; }
  const tryDict = async (w)=>{
    try{ const v = await translateWordKoFr(w, {dictOnly:true, noStrip:true}); return (v && v.length) ? v : null; }
    catch(e){ return null; }
  };
  const guess = guessVerbBases(clean);
  const strong = (preferredBase ? [preferredBase] : []).concat(guess.strong.filter(b=>b!==preferredBase));
  for(const b of strong){ const v = await tryDict(b); if(v) return { word:b, variants:v, particles:[] }; }
  const cands = particleCandidates(clean);
  const whole = await tryDict(clean);
  // Mot entier connu ET courant (débutant/intermédiaire) : c'est lui. Sinon (ex. "비가" = élégie, rare) on regarde
  // d'abord si "mot + particule" donne un mot courant, car c'est presque toujours ce que l'élève a sous les yeux.
  const wholeIsCommon = whole && (!whole.meta || whole.meta.common !== false);
  if(whole && wholeIsCommon) return { word:clean, variants:whole, particles:[] };
  for(const b of guess.weak){ const v = await tryDict(b); if(v) return { word:b, variants:v, particles:[] }; }
  for(const c of cands){ const v = await tryDict(c.stem); if(v) return { word:c.stem, variants:v, particles:c.parts }; }
  if(whole) return { word:clean, variants:whole, particles:[] };
  const last = cands.length ? cands[cands.length-1] : null;
  const fb = last ? last.stem : clean;
  return { word:fb, variants: await translateWordKoFr(fb, {noStrip:true}), particles: last ? last.parts : [] };
}

async function translateWordKoFr(word, opts){
  opts = opts || {};
  const stem = opts.noStrip ? word : stripKoParticle(word);

  // 1) Dictionnaire coréen officiel (KRDict) si configuré — bien plus fiable
  // que MyMemory pour distinguer les vrais sens différents d'un mot (ex.
  // 새 = "nouveau" et "oiseau" sont deux mots distincts dans un vrai
  // dictionnaire, alors que MyMemory les mélange).
  if(!KRDICT_UNAVAILABLE){
    try{
      const { data, error } = await sb.functions.invoke('krdict-lookup', { body:{ word: stem } });
      if(!error && data){
        if(data.configured === false){ KRDICT_UNAVAILABLE = true; }
        else if(data.senses && data.senses.length){
          let senses = data.senses;
          // Mot exact seulement : KRDict renvoie aussi des mots composés (맛있다 pour 있다, 가요제 pour 가요).
          // (Nécessite la version à jour de la fonction krdict-lookup ; l'ancienne ne donne pas le mot exact.)
          const normHead = x=>String(x||'').replace(/[\s\d\-^·]/g,'');
          if(senses.some(s=>s.word)) senses = senses.filter(s=>normHead(s.word)===normHead(stem));
          // Sens de niveau débutant puis intermédiaire d'abord (les sens rares passent après)
          const GRADE_ORDER = {'초급':0,'중급':1,'고급':2};
          const gradeOf = s=> (s.grade in GRADE_ORDER) ? GRADE_ORDER[s.grade] : 3;
          const hasGrade = senses.some(s=>gradeOf(s)<3);
          if(hasGrade) senses = senses.map((s,i)=>({s,i})).sort((a,b)=> (gradeOf(a.s)-gradeOf(b.s)) || (a.i-b.i)).map(x=>x.s);
          const seenDict = new Set();
          const dictVariants = [];
          senses.forEach(s=>{
            const t = (s.translation||'').trim();
            const key = t.toLowerCase();
            if(t && !seenDict.has(key)){ seenDict.add(key); dictVariants.push(t); }
          });
          if(dictVariants.length){
            const out = dictVariants.slice(0,4);
            out.meta = { common: hasGrade ? senses.some(s=>gradeOf(s)<=1) : null };   // mot courant ? (null = inconnu)
            return out;
          }
        }
      }
    }catch(e){ /* on retombe sur MyMemory en cas de souci */ }
  }

  if(opts.dictOnly) throw new Error('not in dictionary'); // pas de repli : on préfère ne rien afficher que du faux

  // 2) Repli : MyMemory (base de traductions existantes, moins fiable sur les
  // mots courts/ambigus mais fonctionne sans configuration).
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(stem)}&langpair=ko|fr`);
  const data = await res.json();

  // MyMemory renvoie plusieurs correspondances existantes (data.matches),
  // pas qu'une seule "meilleure" réponse — utile pour repérer un mot ambigu
  // comme 새 (nouveau / oiseau) au lieu de se fier aveuglément à un seul choix.
  const seen = new Set();
  const variants = [];
  (data.matches || [])
    .slice()
    .sort((a,b)=> (parseFloat(b.match)||0) - (parseFloat(a.match)||0))
    .forEach(m=>{
      const t = (m.translation||'').trim();
      const key = t.toLowerCase();
      if(t && !seen.has(key)){ seen.add(key); variants.push(t); }
    });

  const best = data && data.responseData && data.responseData.translatedText;
  if(best && !seen.has(best.trim().toLowerCase())){ variants.unshift(best.trim()); }

  if(variants.length===0) throw new Error('no translation');
  return variants.slice(0,4); // jusqu'à 4 propositions
}

// Bouton d'enregistrement réutilisable : câble un bouton + une zone de statut,
// enregistre au clic, envoie au stockage, et appelle onUploaded(url) une fois fait.
function wireVoiceRecorder(recBtn, statusEl, onUploaded){
  let mr = null;
  recBtn.onclick = async ()=>{
    if(mr){ mr.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      mr = new MediaRecorder(stream);
      mr.ondataavailable = (e)=> chunks.push(e.data);
      mr.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        mr = null; VOICE_BUSY = false; recBtn.textContent = '🎙️';
        statusEl.textContent = 'Envoi…';
        try{
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = await sbUploadVoiceNote(blob);
          statusEl.textContent = 'Envoyé ✓';
          onUploaded(url);
        }catch(err){ statusEl.textContent = "Erreur d'envoi."; }
      };
      mr.start(); VOICE_BUSY = true;
      recBtn.textContent = '⏹️';
      statusEl.textContent = 'Enregistrement…';
    }catch(err){
      statusEl.textContent = 'Micro indisponible ou refusé.';
    }
  };
}

function isUnlockedSync(list, idx){
  return true;   // plus de verrouillage : l'élève révise librement, le contrôle sert à voir ce qui est acquis
  if(idx===0) return true;
  const l = list[idx];

  right.appendChild(optionsWrap);
  return h;
}

// ---------- Prévenir les élèves qu'une leçon a été modifiée ----------
let LESSON_VIEWS = {}, VIEWS_OK = true;
async function sbLoadLessonViews(){
  try{
    const {data,error} = await sb.from('lesson_views').select('lesson_id,seen_at').eq('student_id', SESSION.user.id);
    if(error) throw error;
    LESSON_VIEWS = {}; (data||[]).forEach(r=>{ LESSON_VIEWS[r.lesson_id] = r.seen_at; }); VIEWS_OK = true;
  }catch(e){ VIEWS_OK = false; LESSON_VIEWS = {}; }
}
function lessonIsUpdated(l){
  if(!VIEWS_OK || !l || !l.notified_at || !PROFILE || PROFILE.role!=='student') return false;
  const concerned = !!PROGRESS[l.id] || l.space==='groupe' || (ASSIGNMENT && ASSIGNMENT.lesson_id===l.id);
  if(!concerned) return false;
  const seen = LESSON_VIEWS[l.id];
  return !seen || new Date(seen) < new Date(l.notified_at);
}
function markLessonSeen(l){
  if(!VIEWS_OK || !l || !PROFILE || PROFILE.role!=='student' || !l.notified_at) return;
  if(!lessonIsUpdated(l)) return;
  LESSON_VIEWS[l.id] = new Date().toISOString();
  try{ sb.from('lesson_views').upsert({student_id:SESSION.user.id, lesson_id:l.id, seen_at:LESSON_VIEWS[l.id]}, {onConflict:'student_id,lesson_id'}).then(r=>{ if(r && r.error) VIEWS_OK=false; }); }catch(e){ VIEWS_OK=false; }
}

    <div class="note" style="margin:10px 0 16px;">Niveau 1 dès 80 pts, niveau 2 dès 140 (TOPIK I) · niveau 3 dès 120, niveau 4 dès 150, niveau 5 dès 190, niveau 6 dès 230 (TOPIK II). Le résultat est valable 2 ans. <b>Dates, lieux et tarifs changent chaque année</b> : renseigne-toi sur <b>topik.go.kr</b> ou auprès du Centre culturel coréen.</div></div>`));
  w.appendChild(el(`<div><h3>Les leçons de chaque niveau</h3><div class="note" style="margin-bottom:14px;">À gauche, une leçon par niveau (1 à 6) : vocabulaire, notes de grammaire et phrases types, avec les exercices, le quiz et le contrôle habituels. Ta professeure peut les compléter si tu lui en fais la demande.</div></div>`));

  w.appendChild(el('<h3>S\'entraîner</h3>'));
  const lv = el('<div class="level-tabs" style="margin-bottom:14px;"></div>');
  for(let n=1;n<=6;n++){
    const b = el(`<button class="level-tab ${state.topikLevel===n?'active':''}">Niveau ${n}</button>`);
    b.onclick = ()=>{ state.topikLevel = n; state.topikAns = {}; state.topikOrder = {}; render(); };
    lv.appendChild(b);
  }
  w.appendChild(lv);
  if(!state.topikLevel){
    w.appendChild(el('<div class="note">Choisis un niveau pour t\'essayer à 6 questions de grammaire (les corrections t\'expliquent chaque réponse). Pas de note ni de pression : si c\'est trop difficile, c\'est normal.</div>'));
    return w;
  }
  const n = state.topikLevel, qs = TOPIK_QS[n] || [];
  state.topikAns = state.topikAns || {}; state.topikOrder = state.topikOrder || {};
  w.appendChild(el(`<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">${escapeHtml(TOPIK_META[n].title)} — ${escapeHtml(TOPIK_META[n].desc)}</div>`));
  let good = 0;
  qs.forEach((q,i)=>{
    const key = n+'-'+i;
    if(!state.topikOrder[key]){ const o=q.o.map((_,k)=>k); for(let k=o.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [o[k],o[j]]=[o[j],o[k]]; } state.topikOrder[key]=o; }
    const ans = state.topikAns[key];
    if(ans===q.a) good++;
    const card = el(`<div class="section-block" style="margin-bottom:12px;"><div style="font-size:18px;margin-bottom:8px;"><b>${i+1}.</b> <span class="kr">${escapeHtml(q.q)}</span></div></div>`);
    const row = el('<div style="display:flex;flex-wrap:wrap;gap:8px;"></div>');
    state.topikOrder[key].forEach(k=>{
      const b = el(`<button class="btn ghost small topik-opt">${escapeHtml(q.o[k])}</button>`);
      if(ans!==undefined){ b.disabled = true; if(k===q.a) b.style.borderColor='var(--celadon-dark)'; else if(k===ans) b.style.borderColor='var(--seal)'; }
      b.onclick = ()=>{ state.topikAns[key] = k; render(); };
      row.appendChild(b);
    });
    card.appendChild(row);
    if(ans!==undefined) card.appendChild(el(`<div class="note" style="margin-top:8px;border-color:${ans===q.a?'var(--celadon-dark)':'var(--seal)'};">${ans===q.a?'✅ Bien joué.':'❌ Pas tout à fait.'} ${escapeHtml(q.e)}</div>`));
    w.appendChild(card);
  });
  const done = Object.keys(state.topikAns).filter(k=>k.startsWith(n+'-')).length;
  if(done===qs.length) w.appendChild(el(`<div class="note" style="border-color:var(--gold);">Résultat : <b>${good} / ${qs.length}</b>. C'est un simple aperçu : l'important est de repérer ce qui reste à apprendre.</div>`));
  return w;
}

/* ---- À mémoriser : on trie ce que la professeure a mis dans le cours ---- */
// Renvoie { kind:'word'|'grammar'|'phrase'|'note', kr, fr, rom }
function classifyStudyItem(v){
  let kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim(); const rom = v.rom||'';
  const hasKo = t => /[가-힣]/.test(t);
  const hasLatin = t => /[A-Za-zÀ-ÿ]{3,}/.test(t);
  // « (exception) 춥다 » : l'annotation entre parenthèses passe du côté du sens
  const ann = [];
  kr = kr.replace(/\(([^()]*)\)/g, (m, inner)=>{ if(hasLatin(inner) && !hasKo(inner)){ ann.push(inner.trim()); return ' '; } return m; }).replace(/\s+/g,' ').trim();
  const annOrig = ann.slice();
  if(ann.length) fr = (fr ? fr + ' ' : '') + '(' + ann.join(', ') + ')';
  if(kr && !hasKo(kr) && fr && hasKo(fr) && !hasLatin(fr)){ const t = kr; kr = fr; fr = t; }   // entrée écrite à l'envers (« nominalisation = 것 ») : on la remet dans le bon sens
  if(!kr || !hasKo(kr) || hasLatin(kr)) return { kind:'note', kr, fr, rom };       // explication en français : sa place est dans le Cours
  if(/[ㄱ-ㅎ]|[가-힣]\/[가-힣ㄱ-ㅎ]|~|…|\.\.\.|\+/.test(kr)) return { kind:'grammar', kr, fr, rom, ann:annOrig };   // ㄹ/을, 은/ㄴ, ~…
  const tokens = kr.split(/\s+/).length;
  if(/[.?!]$/.test(kr) || tokens>=3 || kr.length>14) return { kind:'phrase', kr, fr, rom };
  return { kind:'word', kr, fr, rom, ann:annOrig };
}
// Répare ce que l'analyse du cours a pu abîmer, et sort les petites gloses « mot(sens) » en cartes à part.
function expandStudyItem(v){
  const out = [];
  let kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim(); const rom = v.rom||'';
  const KO = '[\\uAC00-\\uD7A3]', LAT = "[A-Za-zÀ-ÿ' ]";
  const hasKo = t => /[가-힣]/.test(t);
  kr = kr.replace(/^\s*(\d+[.)]|[*•\-–])\s*/, '').trim();                       // « 1. », « * » en début de ligne
  // « 볼 것이 많아요. (=구경할 곳이 많아요.) … » coupé en « 볼 것이 많아요. ( » / « 구경할 곳이 많아요.) … »
  if(/\(\s*$/.test(kr) && fr.indexOf(')')>-1){
    const close = fr.indexOf(')');
    const alt = fr.slice(0, close).replace(/^\s*=\s*/, '').trim();
    let rest = fr.slice(close+1).trim();
    kr = kr.replace(/\(\s*$/, '').trim();
    let tail = rest.match(new RegExp('(?:^|\\s)(' + KO + '+)\\s+(' + LAT + '{3,})$'));
    if(tail){ rest = rest.slice(0, tail.index).trim(); out.push({ kind:'word', kr:tail[1], fr:tail[2].trim(), rom:'' }); }
    if(rest && hasKo(rest)) kr = (kr + ' ' + rest).trim();
    fr = '';
    if(alt && hasKo(alt)) out.push({ kind:'phrase', kr:alt, fr:'', rom:'' });
  }
  // « 킹크랩, 게 crab, 새우 » + « crevette » : une liste de mots avec leurs sens
  if(kr.indexOf(',')>-1 && /[A-Za-zÀ-ÿ]{3,}/.test(kr) && hasKo(kr) && !/[().?!]/.test(kr)){
    const parts = kr.split(',').map(x=>x.trim()).filter(Boolean);
    parts.forEach((part, i)=>{
      const m = part.match(new RegExp('^(' + KO + '[\\uAC00-\\uD7A3 ]*?)\\s+(' + LAT + '+)$'));
      if(m) out.push({ kind:'word', kr:m[1].trim(), fr:m[2].trim(), rom:'' });
      else if(new RegExp('^' + KO + '[\\uAC00-\\uD7A3 ]*$').test(part)) out.push({ kind:'word', kr:part, fr:(i===parts.length-1 && fr && !hasKo(fr)) ? fr : '', rom:'' });
    });
    return out;
  }
  // « 순대국, 감(kaki), 배(poire) 먹어 봤어요. » : les gloses deviennent des cartes, la phrase reste propre
  const gl = [];
  kr = kr.replace(new RegExp('(' + KO + '+)\\(\\s*(' + LAT + '{2,})\\s*\\)', 'g'), (m, w, g2)=>{ gl.push({ kind:'word', kr:w, fr:g2.trim(), rom:'' }); return w; });
  gl.forEach(x=>out.push(x));
  const c = classifyStudyItem({ kr, fr, rom });
  if(c.kind!=='note') out.push(c);
  return out;
}
// Une règle de grammaire garde ses exemples (« 춥다 → 추운 것 ») : on les relie à la règle au lieu d'en faire des mots à part.
function lessonStudyGroups(lesson){
  const out = { word:[], grammar:[], phrase:[], note:[] };
  const seen = new Set();
  const add = (c)=>{ const k = c.kind + '|' + c.kr; if(seen.has(k)) return false; seen.add(k); out[c.kind].push(c); return true; };
  (lesson.vowels||[]).forEach(v=> add({kind:'word', kr:v.kr, fr:v.fr, rom:v.rom||''}));
  const vocab = lesson.vocab || [];
  const isHeading = v=>{ const k = String(v.kr||'').trim(); return !!k && !/[가-힣]/.test(k) && !/[가-힣]/.test(String(v.fr||'')) && !/^\d/.test(k) && k.split(/\s+/).length<=5 && !/[.:?!()=]/.test(k); };
  const syl = t=>{ const n = String(t||'').trim().charCodeAt(0) - 0xAC00; return n>=0 && n<11172 ? [Math.floor(n/588), Math.floor((n%588)/28)] : null; };
  const related = (a,b)=>{ const x = syl(a), y = syl(b); return !!(x && y && x[0]===y[0] && x[1]===y[1]); };   // 먹다 → 먹어 보다, 춥다 → 추운 것
  const cap = t=> t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  const soloWord = v=>{ if(isHeading(v)) return null; const p = expandStudyItem(v); return (p.length===1 && p[0].kind==='word') ? p[0] : null; };
  let heading = null, headingUsed = true, lastRule = null, adj = false;
  for(let i=0; i<vocab.length; i++){
    const v = vocab[i];
    if(isHeading(v)){ heading = String(v.kr).trim(); headingUsed = false; lastRule = null; adj = true; continue; }
    if(adj && (lastRule || !headingUsed)){
      // les paires qui suivent directement une règle (ou un titre) sont ses exemples
      let j = i; const pairs = [];
      while(j+1 < vocab.length){
        const a = soloWord(vocab[j]), b = soloWord(vocab[j+1]);
        if(!a || !b || !related(a.kr, b.kr)) break;
        pairs.push({ a:a.kr, b:b.kr, note:(a.ann||[]).concat(b.ann||[]).join(', ') });
        j += 2;
      }
      if(pairs.length){
        if(!lastRule){ lastRule = { kind:'grammar', kr:heading, fr:'', rom:'', examples:[], isTitle:true }; headingUsed = true; add(lastRule); }
        lastRule.examples.push(...pairs);
        i = j-1; adj = true; continue;
      }
    }
    const parts = expandStudyItem(v);
    parts.forEach(c=>{
      if(c.kind==='grammar'){
        // l'explication du professeur est montrée telle quelle, une seule fois (jamais la traduction automatique de la ligne)
        if(c.ann && c.ann.length) c.fr = cap(c.ann.join(', '));
        c.examples = [];
        headingUsed = true;
        if(add(c)) lastRule = c; else lastRule = out.grammar.find(x=>x.kr===c.kr) || lastRule;
      } else add(c);
    });
    adj = parts.length===1 && parts[0].kind==='grammar';
  }
  // un mot sans sens donné par la professeure mais déjà présent avec un sens : on garde celui qui a un sens
  out.word = out.word.filter(w=> w.fr || !out.word.some(o=> o!==w && o.kr===w.kr && o.fr));
  return out;
}
function renderMemorize(lesson){
  const wrap = el('<div></div>');
  const g = lessonStudyGroups(lesson);
  if(g.word.length+g.grammar.length+g.phrase.length===0){ wrap.appendChild(el(`<div class="empty-state">Rien à mémoriser ici.</div>`)); return wrap; }
  const makeCard = (v)=>{
    const c = el(`<div class="flip-card"><div><span class="kr">${escapeHtml(v.kr)}</span></div></div>`);
    let revealed=false;
    c.onclick = ()=>{
      revealed = !revealed; c.classList.toggle('revealed', revealed);
      const exo = (v.examples && v.examples.length) ? '<div class="meaning" style="margin-top:8px;text-align:left;font-size:13px;">' + v.examples.map(e=>`<div><span class="kr" style="font-size:15px;">${escapeHtml(e.a)} → ${escapeHtml(e.b)}</span>${e.note?` <span style="color:var(--ink-soft);">(${escapeHtml(e.note)})</span>`:''}</div>`).join('') + '</div>' : '';
      const sens = v.fr ? `<div class="meaning">${escapeHtml(v.fr)}</div>` : ((v.examples && v.examples.length) ? '' : '<div class="meaning"><span style="color:var(--ink-soft);font-size:12px;">pas de traduction dans le cours</span></div>');
      const paint = (auto)=>{
        const noFr = !v.fr && !(v.examples && v.examples.length);
        const sens2 = (noFr && auto!==undefined) ? (auto ? `<div class="meaning">${escapeHtml(auto)}</div><div style="font-size:11px;color:var(--ink-soft);">suggestion du dictionnaire (KRDict) — le professeur n'a pas donné de sens</div>` : sens) : sens;
        c.querySelector('div').innerHTML = revealed ? `<span class="kr">${escapeHtml(v.kr)}</span>${v.rom?`<div class="meaning mono">${escapeHtml(v.rom)}</div>`:''}${sens2}${exo}` : `<span class="kr">${escapeHtml(v.kr)}</span>`;
      };
      paint();
      // un mot sans sens dans le cours : on propose celui du dictionnaire, sans toucher au cours ni à sa traduction
      if(revealed && v.kind==='word' && !v.fr){
        state.memoAuto = state.memoAuto || {};
        if(v.kr in state.memoAuto) paint(state.memoAuto[v.kr]);
        else translateWordKoFr(v.kr, {dictOnly:true, noStrip:true}).then(r=>{
          const txt = (r && r.length) ? r.slice(0,2).map(x=>typeof x==='string'?x:(x.fr||x.text||'')).filter(Boolean).join(' / ') : '';
          state.memoAuto[v.kr] = txt; if(revealed) paint(txt);
        }).catch(()=>{ state.memoAuto[v.kr] = ''; });
      }
    };
    return c;
  };
  if(g.word.length){
    wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">Clique sur une carte pour révéler le sens.</div>'));
    const grid = el('<div class="card-grid"></div>'); g.word.forEach(v=>grid.appendChild(makeCard(v))); wrap.appendChild(grid);
  }
  const fold = (key, title, hint, items)=>{
    if(!items.length) return;
    const open = !!(state.memoOpen && state.memoOpen[key]);
    const box = el('<div class="section-block" style="margin-top:22px;"></div>');

}

// Score d'un mot : erreurs moins la moitié des réussites (jamais négatif), toutes leçons confondues
function missScore(kr){
  let m = 0, c = 0;
  Object.keys(PROGRESS||{}).forEach(id=>{ const e = PROGRESS[id] && PROGRESS[id].misses && PROGRESS[id].misses[kr]; if(e){ m += e.m||0; c += e.c||0; } });
  return { score: Math.max(0, m - 0.5*c), known: c };
}
// Mélange aléatoire qui fait remonter les mots difficiles et laisse en fin de liste ceux déjà bien connus
function smartOrder(arr, krOf){
  return arr.map(x=>{ const s = missScore(krOf(x)); return { x, k: Math.random() - Math.min(3, s.score)*0.4 + Math.min(s.known, 6)*0.04 }; })
    .sort((a,b)=>a.k-b.k).map(o=>o.x);
}
function buildMCQ(lesson, count, smart){
  const items = (lesson.vowels||[]).concat((lesson.vocab||[]).map(v=>({kr:v.kr,rom:v.rom,fr:v.fr})));
  const shuffled = (smart ? smartOrder(items, x=>x.kr) : [...items].sort(()=>Math.random()-0.5)).slice(0,count||items.length);
  return shuffled.map((it,i)=>{
    const correct = it.fr || it.rom;
    const distractors = items.filter(x=>x!==it).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.fr||x.rom);
    return {id:'q'+lesson.id+'_'+i, kr:it.kr, options:[...distractors, correct].sort(()=>Math.random()-0.5), answer:correct};
  });
}

function normFr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}
// Réponse acceptée si elle correspond à la traduction entière OU à l'une de ses
// variantes ("être changé / être modifié" -> l'une ou l'autre), sans tenir
// compte des accents, majuscules ni de la ponctuation.
function frAnswerLevel(input, expected){
  const exp = (expected||'').trim();
  if(/^[\d\s.,']+$/.test(exp)){            // réponse numérique : seuls les chiffres comptent
    const digits = x=>(x||'').replace(/\D/g,'');
    return (digits(input)!=='' && digits(input)===digits(exp)) ? 'exact' : 'no';
  }
  const given = normFr(input);
  if(!given) return 'no';
  const alts = [expected].concat((expected||'').split(/[,;\/]/)).map(normFr).filter(Boolean);
  const noParen = normFr((expected||'').replace(/\([^)]*\)/g,''));
  if(noParen) alts.push(noParen);
  // notes entre crochets de la professeure : "3 [trois] fois" -> "3 fois" ou "trois fois"
  if(/\[[^\]]*\]/.test(expected||'')){
    alts.push(normFr((expected||'').replace(/\s*\[[^\]]*\]/g,'')));
    alts.push(normFr((expected||'').replace(/[\[\]]/g,'')));
    alts.push(normFr((expected||'').replace(/\S+\s*\[([^\]]*)\]/g,'$1')));   // « 3 [trois] » -> « trois »
  }
  if(alts.includes(given)) return 'exact';
  // Tolérance pour l'orthographe (dyslexie comprise) : petites fautes, lettres inversées,
  // petits mots oubliés. Jamais sur un chiffre ni sur une négation (le sens changerait).
  const SMALL = new Set(['le','la','les','l','un','une','des','de','du','d','a','au','aux','et','en']);
  const NEG = ['ne','pas','jamais','plus','non','sans','rien'];
  const core = x=> x.replace(/'/g,' ').split(' ').filter(w=>w && !SMALL.has(w)).join(' ');
  const nums = x=>(x.match(/\d+/g)||[]).join(',');
  const negs = x=> NEG.filter(n=> (' '+x+' ').includes(' '+n+' ')).join(',');
  const g = core(given);
  const near = alts.some(a=>{
    if(nums(a)!==nums(given) || negs(a)!==negs(given)) return false;
    const c = core(a);
    if(c.length<4 || !g) return false;
    if(c===g) return true;
    const allowed = c.length<=5 ? 0 : c.length<=9 ? 1 : c.length<=20 ? 2 : 3;
    if(editDistance(c,g) <= allowed) return true;
    // mêmes lettres, juste mélangées (ex. « frnace ») : faute de frappe ou de lecture
    return c.length>=5 && c.split('').sort().join('')===g.split('').sort().join('') && editDistance(c,g)<=2;
  });
  return near ? 'near' : 'no';
}
function frAnswerOk(input, expected){ return frAnswerLevel(input, expected)!=='no'; }
function editDistance(a,b){
  const m=a.length,n=b.length; const d=[];
  for(let i=0;i<=m;i++){ d[i]=[i]; }
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
// traduction attendue affichée sans les notes entre crochets
function frDisplay(s){ return (s||'').replace(/\s*\[[^\]]*\]/g,'').replace(/\s+([.,!?])/g,'$1').trim(); }
function renderExercices(lesson){
  const wrap = el('<div></div>');
  const allItems = (lesson.vowels||[]).concat(lesson.vocab||[]);
  // la saisie exacte n'a de sens que pour des mots/expressions courts : les
  // phrases entières se travaillent dans le Quiz et le Contrôle
  const items = allItems.filter(it=> it.rom || (it.fr||'').split(/\s+/).filter(Boolean).length <= 6);
  if(items.length===0){
    wrap.appendChild(el(allItems.length
      ? '<div class="empty-state">Cette leçon ne contient que des phrases longues — travaille-les dans le <b>Quiz</b> et le <b>Contrôle</b>.</div>'
      : '<div class="empty-state">Rien à travailler ici.</div>'));
    return wrap;
  }
  if(!lesson._exOrder || lesson._exOrder.length!==items.length) lesson._exOrder = smartOrder(items.map((_,i)=>i), i=>items[i].kr);
  const total = items.length;
  if(state.exerciseIndex >= total){
    const done = el(`<div class="result-box"><div class="score mono">${state.exerciseCorrectCount||0}/${total}</div><div style="margin:8px 0 16px;">Entraînement terminé — refais un tour, ou passe au Quiz.</div></div>`);
    const restart = el('<button class="btn celadon">Recommencer</button>');
    restart.onclick = ()=>{ state.exerciseIndex=0; state.exerciseCorrectCount=0; lesson._exOrder = smartOrder(items.map((_,i)=>i), i=>items[i].kr); render(); };
    done.appendChild(restart); wrap.appendChild(done); return wrap;
  }
  const item = items[lesson._exOrder[state.exerciseIndex]];
  const askRom = !!item.rom;
  wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">' + (askRom ? 'Tape la romanisation de mémoire, sans pression.' : 'Tape la traduction française de mémoire, sans pression.') + '</div>'));
  wrap.appendChild(el(`<div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Carte ${state.exerciseIndex+1} / ${total}</div>`));
  wrap.appendChild(el(`<div class="item-card" style="max-width:220px;padding:26px 16px;margin-bottom:16px;"><span class="kr" style="font-size:34px;">${item.kr}</span></div>`));
  const row = el('<div style="display:flex;gap:8px;max-width:340px;"></div>');
  const input = el(`<input type="text" placeholder="${askRom ? 'romanisation...' : 'traduction en français...'}">`); input.style.flex='1';
  const checkBtn = el('<button class="btn celadon">Vérifier</button>');
  row.appendChild(input); row.appendChild(checkBtn); wrap.appendChild(row);
  const fb = el('<div style="margin-top:10px;"></div>'); wrap.appendChild(fb);
  const nextBtn = el('<button class="btn ghost" style="margin-top:12px;display:none;">Suivant →</button>'); wrap.appendChild(nextBtn);
  const doCheck = ()=>{
    if(input.disabled) return;
    const expected = askRom ? item.rom : item.fr;
    const level = askRom ? ((input.value.trim().toLowerCase() === (expected||'').toLowerCase()) ? 'exact' : 'no') : frAnswerLevel(input.value, expected);
    const ok = level!=='no';
    sbRecordAnswers(lesson.id, [{ kr:item.kr, ok }]);
    if(ok){ state.exerciseCorrectCount=(state.exerciseCorrectCount||0)+1; fb.innerHTML = level==='near' ? `<div class="feedback ok">Presque, c'est bon 👍 — on écrit : « ${escapeHtml(frDisplay(expected))} »</div>` : `<div class="feedback ok">Exact 👍${(!askRom||!item.fr)?'':(' — '+item.fr)}</div>`; }
    else{ fb.innerHTML = `<div class="feedback ko">Pas tout à fait — "${escapeHtml(askRom?expected:frDisplay(expected))}"${(askRom&&item.fr)?(' ('+item.fr+')'):''}.</div>`; }
    checkBtn.disabled=true; input.disabled=true; nextBtn.style.display='inline-block';
  };
  checkBtn.onclick = doCheck;
  input.onkeydown = (e)=>{ if(e.key==='Enter') doCheck(); };
  nextBtn.onclick = async ()=>{
    state.exerciseIndex++;
    if(state.exerciseIndex>=total){ await sbUpsertProgress(lesson.id, {exercises:{correct:state.exerciseCorrectCount||0, total, date:new Date().toISOString().slice(0,10)}}); }
    render();
  };
  return wrap;
}

async function renderGlobalQuiz(){
  const wrap = el('<div></div>');
  wrap.appendChild(el(`<h2 style="margin:0 0 4px;">🌐 Quiz global</h2>`));
  wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">Mélange le vocabulaire de toutes les leçons que tu as déjà validées (contrôle réussi), tous niveaux confondus — pour réviser large avant un vrai contrôle avec ta professeur.</div>'));

  const pool = [];
  for(const lvl of Object.keys(LEVEL_LABELS)){
    const list = await lessonsForLevel(lvl);
    list.forEach(l=>{
      const pr = PROGRESS[l.id];
      if(pr && pr.control && pr.control.passed){
        (l.vowels||[]).forEach(v=>pool.push(v));
        (l.vocab||[]).forEach(v=>pool.push(v));
      }
    });
  }

  if(pool.length===0){
    wrap.appendChild(el(`<div class="empty-state es-lantern"><span class="kr">아직이에요</span><div>Rien à mélanger pour l'instant — valide au moins une leçon (contrôle réussi) pour débloquer ce quiz.</div></div>`));
    return wrap;
  }

  if(state.globalQuizResult){
    const r = state.globalQuizResult;
    const box = el(`<div class="result-box"><div class="score mono">${r.correct}/${r.total}</div><div style="margin:8px 0 16px;">${r.correct===r.total?'Sans faute 👏':'Sans enjeu — regarde ce qui a coincé, ou refais-en un autre.'}</div></div>`);
    const retry = el('<button class="btn celadon">Nouveau quiz global</button>');
    retry.onclick = ()=>{ state.globalQuizResult=null; state.globalQuizAnswers={}; render(); };
    box.appendChild(retry); wrap.appendChild(box);
    if(r.wrong.length){
      const rev = el('<div class="section-block" style="margin-top:24px;"><h3>À revoir</h3></div>');
      r.wrong.forEach(w=>rev.appendChild(el(`<div class="vocab-row"><span class="kr">${w.kr}</span><span class="rom mono">donné : ${w.given||'—'}</span><span class="fr">correct : ${w.answer}</span></div>`)));
      wrap.appendChild(rev);
    }
    return wrap;
  }

  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(15, pool.length));
  const qs = shuffled.map((it,i)=>{
    const correct = it.fr || it.rom;
    const distractors = pool.filter(x=>x!==it).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.fr||x.rom);
    return {id:'gq'+i, kr:it.kr, options:[...distractors, correct].sort(()=>Math.random()-0.5), answer:correct};
  });
  wrap.appendChild(el(`<div class="note" style="margin-bottom:16px;">${qs.length} question(s) piochées dans ${pool.length} mot(s) au total.</div>`));
  qs.forEach(q=>{
    const qb = el(`<div class="q-block"><div class="q-text">Que signifie <span class="kr">${q.kr}</span> ?</div></div>`);
    const opts = el('<div class="opt-list"></div>');
    q.options.forEach(opt=>{
      const b = el(`<button class="opt">${opt}</button>`);
      b.onclick = ()=>{ state.globalQuizAnswers[q.id]=opt; [...opts.children].forEach(c=>c.style.borderColor='var(--line)'); b.style.borderColor='var(--ink)'; };
      opts.appendChild(b);
    });
    qb.appendChild(opts); wrap.appendChild(qb);
  });
  const submit = el('<button class="btn celadon">Valider le quiz global</button>');
  submit.onclick = ()=>{
    let correct=0; const wrong=[];
    qs.forEach(q=>{ const g=state.globalQuizAnswers[q.id]; if(g===q.answer) correct++; else wrong.push({kr:q.kr, given:g, answer:q.answer}); });
    state.globalQuizResult = {correct, total:qs.length, wrong};
    render();
  };
  wrap.appendChild(submit);
  return wrap;
}

// ---- fiches de référence : elles se remplissent quand l'élève croise les mots (comme les particules) ----
let REF_INDEX = null;
function refIndex(){
  if(REF_INDEX) return REF_INDEX;
  REF_INDEX = [];
  REF_CATEGORIES.forEach(cat=> cat.groups.forEach(g=> g.rows.forEach(r=>{
    const forms = [];
    String(r[0]).split(/\s+\/\s+/).forEach(part=>{
      part.replace(/\s*\(([^)]*)\)/g,'|$1').split('|').forEach(p=>{
        p.split(/\s*→\s*/).forEach(q=>{ q = q.replace(/[?.!]+$/,'').trim(); if(q) forms.push(q); });
      });
    });
    REF_INDEX.push({ cat:cat.id, key:cat.id+'|'+r[0], forms });
  })));
  return REF_INDEX;
}
const REF_SUFFIXES = ['','가','이','는','은','를','을','도','의','에','에서','에게','한테','께','부터','까지','로','으로','와','과','랑','하고','만','에는','에도','이에요','예요','이야','야','입니다','이고'];
const REF_ALONE_BLOCK = new Set(['이','일','사','오','구','나','너','그']);   // trop ambigus seuls (particule, mot courant…)
const REF_SINO_CHARS = /^[영공일이삼사오육칠팔구십백천만억]+$/;
// Quelles lignes de fiches correspondent au mot cliqué ? (clean = mot tel que cliqué, dict = forme du dictionnaire)
function refMatches(clean, dict, textNoSpace){
  const hits = [];
  const sinoParts = (REF_SINO_CHARS.test(clean) && clean.length>=2) ? new Set([...clean]) : null;
  refIndex().forEach(row=>{
    const ok = row.forms.some(f=>{
      if(f.includes(' ')){                                                   // expression de plusieurs mots
        return textNoSpace && textNoSpace.includes(f.replace(/\s+/g,'')) && f.split(' ').some(p=> p===clean || p===dict || (p.length>=2 && clean.startsWith(p)));
      }
      if(clean===f || (dict && dict===f)){ return f.length>1 || !REF_ALONE_BLOCK.has(f) || false; }
      if(sinoParts && sinoParts.has(f)) return true;                         // 이십오 -> 이, 십, 오
      if(clean.startsWith(f) && f.length>=1){ const rem = clean.slice(f.length); return rem!=='' && REF_SUFFIXES.includes(rem) && (f.length>=2 || !REF_ALONE_BLOCK.has(f)); }
      return false;
    });
    if(ok) hits.push(row);
  });
  return hits;
}
function refMark(clean, dict, textNoSpace){
  if(!PROFILE || PROFILE.role!=='student') return;
  refMatches(clean, dict, textNoSpace).forEach(row=> markGrammarSeen('fiche', row.key));
}
// Lignes d'une fiche que l'élève a déjà rencontrées (la professeure voit tout)
function refSeenRows(cat){
  const rows = []; cat.groups.forEach(g=> g.rows.forEach(r=> rows.push(r)));
  if(PROFILE && PROFILE.role==='teacher') return rows;
  if(cat.unlockWith && GRAMMAR_SEEN.some(g=>g.kind==='fiche' && cat.unlockWith.some(id=>String(g.key).startsWith(id+'|')))) return rows;
  return rows.filter(r=> GRAMMAR_SEEN.some(g=>g.kind==='fiche' && g.key===cat.id+'|'+r[0]));
}
function refEntry(cat, r){ return GRAMMAR_SEEN.find(g=>g.kind==='fiche' && g.key===cat.id+'|'+r[0]); }
function refTiles(grid){
  const teacher = PROFILE && PROFILE.role==='teacher';
  REF_CATEGORIES.forEach(c=>{
    const seen = refSeenRows(c);
    const total = c.groups.reduce((t,g)=>t+g.rows.length,0);
    const nNew = teacher ? 0 : seen.filter(r=>isGrammarEntryNew(refEntry(c,r))).length;
    const tile = el(`<button type="button" class="ref-cat" data-ref="${c.id}" style="text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;background:var(--paper);border:1.5px solid ${seen.length?'var(--ink)':'var(--line)'};border-radius:12px;padding:16px 18px;${seen.length?'':'opacity:.7;'}">
      <div style="font-size:26px;line-height:1;">${c.icon}</div>
      <div style="font-size:16px;font-weight:600;margin:8px 0 2px;">${escapeHtml(c.title)}</div>
      <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.45;">${escapeHtml(c.hint)}</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="mono" style="font-size:12.5px;">${teacher ? (total+' entrées') : (seen.length ? (seen.length+' rencontré'+(seen.length>1?'s':'')) : 'Rien pour l\'instant')}</span>
        ${nNew?`<span class="mono" style="font-size:11px;background:var(--seal);color:#fff;border-radius:999px;padding:1px 9px;">${nNew} nouveau${nNew>1?'x':''}</span>`:''}
      </div></button>`);
    tile.onclick = ()=>{ state.refCategory = c.id; state.refTest = null; render(); };
    grid.appendChild(tile);
  });
}
function renderRefCategory(wrap, cat){
  const back = el('<button class="btn ghost small gm-back" style="margin-bottom:14px;">← Aide-mémoire</button>');
  back.onclick = ()=>{ state.refCategory = null; state.refTest = null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h2 style="margin:0 0 4px;">${cat.icon} ${escapeHtml(cat.title)}</h2>`));
  if(cat.intro) wrap.appendChild(el(`<div class="note" style="margin-bottom:14px;font-size:12.5px;">${escapeHtml(cat.intro)}</div>`));
  const teacher = PROFILE && PROFILE.role==='teacher';
  const shownRows = refSeenRows(cat);
  const allRows = shownRows;                    // le test ne porte que sur ce que l'élève a rencontré
  if(teacher) wrap.appendChild(el('<div class="note" style="margin-bottom:14px;font-size:12.5px;border-color:var(--gold);">Aperçu professeure : tu vois toute la fiche. Chaque élève voit seulement les lignes qu\'il a rencontrées en cliquant sur les mots d\'un texte (onglet Traduction).</div>'));
  // ----- mode « Me tester » : cartes à retourner
  const T = state.refTest;
  if(T){
    const total = T.order.length;
    if(T.i >= total){
      const miss = T.miss.map(i=>allRows[i]);
      const box = el(`<div class="result-box"><div class="score mono">${total-miss.length}/${total}</div><div style="margin:8px 0 12px;">${miss.length?'À revoir :':'Tout est bon, bravo !'}</div></div>`);
      miss.forEach(r=> box.appendChild(el(`<div style="text-align:left;margin:4px 0;"><span class="kr" style="font-size:18px;">${escapeHtml(r[0])}</span> <span style="color:var(--ink-soft);font-size:13px;">${escapeHtml(r[1])}</span></div>`)));
      if(miss.length && PROFILE && PROFILE.role==='student'){
        const keep = el('<button class="btn ghost small" style="margin-top:10px;">Garder dans « Mots à revoir »</button>');
        keep.onclick = async ()=>{ keep.disabled = true; for(const r of miss){ await sbAddWeakWord(String(r[0]).split(' / ')[0], r[1]); } keep.textContent = '✓ Gardés dans Mots à revoir'; };
        box.appendChild(keep);
      }
      const again = el('<button class="btn celadon" style="margin-top:12px;margin-left:8px;">Recommencer</button>');
      again.onclick = ()=>{ state.refTest = { order:allRows.map((_,i)=>i).sort(()=>Math.random()-0.5), i:0, flipped:false, miss:[] }; render(); };
      const stop = el('<button class="btn ghost" style="margin-top:12px;margin-left:8px;">Retour à la fiche</button>');
      stop.onclick = ()=>{ state.refTest = null; render(); };
      box.appendChild(again); box.appendChild(stop); wrap.appendChild(box); return;
    }
    const r = allRows[T.order[T.i]];
    wrap.appendChild(el(`<div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Carte ${T.i+1} / ${total}</div>`));
    const card = el(`<div class="item-card ref-card" style="max-width:320px;padding:26px 16px;margin-bottom:14px;cursor:pointer;text-align:center;"><div class="kr" style="font-size:30px;">${escapeHtml(r[0])}</div>${T.flipped?`<div style="margin-top:12px;font-size:16px;">${escapeHtml(r[1])}</div>${r[2]?`<div style="margin-top:6px;font-size:12px;color:var(--ink-soft);">${escapeHtml(r[2])}</div>`:''}`:'<div style="margin-top:12px;font-size:12px;color:var(--ink-soft);">touche pour voir la réponse</div>'}</div>`);
    card.onclick = ()=>{ T.flipped = true; render(); };
    wrap.appendChild(card);
    if(T.flipped){
      const row = el('<div style="display:flex;gap:8px;flex-wrap:wrap;"></div>');
      const yes = el('<button class="btn celadon">Je savais ✓</button>'); yes.onclick = ()=>{ T.i++; T.flipped=false; render(); };
      const no = el('<button class="btn ghost">Pas encore</button>'); no.onclick = ()=>{ T.miss.push(T.order[T.i]); T.i++; T.flipped=false; render(); };
      row.appendChild(yes); row.appendChild(no); wrap.appendChild(row);
    }
    const quit = el('<button class="btn ghost small" style="margin-top:16px;">Arrêter le test</button>');
    quit.onclick = ()=>{ state.refTest = null; render(); };
    wrap.appendChild(quit);
    return;

const LISTEN = { input:'', note:'', cands:[], tokens:[], result:null, msg:'', busy:false, listening:false, added:null };
function speechRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
async function listenSearch(rawWord){
  const clean = String(rawWord||'').replace(/[^가-힣]/g,'');
  LISTEN.added = null;
  if(!clean){ LISTEN.result=null; LISTEN.msg="Écris le mot en hangul (한글), par exemple copié depuis les sous-titres."; render(); return; }
  LISTEN.busy = true; LISTEN.msg=''; LISTEN.result=null; render();
  try{
    const found = await lookupWordSmart(clean);
    if(found && found.variants && found.variants.length){ LISTEN.result = {heard:clean, word:found.word, variants:found.variants}; }
    else LISTEN.msg = "Je ne trouve pas ce mot dans le dictionnaire. Vérifie l'écriture (sous-titres) ou essaie un autre choix.";
  }catch(e){ LISTEN.msg = "Je ne trouve pas ce mot dans le dictionnaire. Vérifie l'écriture (sous-titres) ou essaie un autre choix."; }
  LISTEN.busy = false; render();
}
function listenSetInput(text, andSearch){
  LISTEN.input = text;
  LISTEN.tokens = String(text).trim().split(/\s+/).filter(t=>/[가-힣]/.test(t));
  if(andSearch){
    if(LISTEN.tokens.length<=1) listenSearch(LISTEN.tokens[0]||text); else { LISTEN.result=null; LISTEN.msg='Plusieurs mots : clique sur celui que tu veux chercher.'; render(); }
  }
}
let LISTEN_REC = null, LISTEN_TIMER = null;
function listenStopMic(){ try{ if(LISTEN_REC) LISTEN_REC.stop(); }catch(e){} }
function listenStartMic(){
  const SR = speechRecognitionCtor(); if(!SR) return;
  if(LISTEN.listening) return;
  let rec; try{ rec = new SR(); }catch(e){ LISTEN.msg="Le micro n'est pas disponible ici. Tape le mot à la place."; render(); return; }
  LISTEN_REC = rec;
  rec.lang='ko-KR'; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
  LISTEN.listening=true; LISTEN.msg=''; LISTEN.result=null; LISTEN.cands=[]; LISTEN.tokens=[]; render();
  const finish = ()=>{ clearTimeout(LISTEN_TIMER); if(LISTEN.listening){ LISTEN.listening=false; render(); } };
  LISTEN_TIMER = setTimeout(()=>{ listenStopMic(); setTimeout(()=>{ if(LISTEN.listening){ LISTEN.msg="Le micro n'a rien renvoyé. Réessaie, ou tape le mot."; finish(); } }, 1500); }, 8000);
  rec.onresult = (ev)=>{
    const r = ev.results && ev.results[0]; const alts=[];
    if(r) for(let i=0;i<r.length;i++){ const t=(r[i].transcript||'').trim(); if(t && !alts.includes(t)) alts.push(t); }
    LISTEN.listening=false; clearTimeout(LISTEN_TIMER);
    const hangul = alts.filter(t=>/[\uAC00-\uD7A3]/.test(t));
    if(hangul.length){ LISTEN.cands = hangul; listenSetInput(hangul[0], true); }
    else if(alts.length){ LISTEN.msg = "J'ai entendu « "+alts[0]+" », mais ce n'est pas du coréen. Réessaie en parlant plus lentement, ou tape le mot."; render(); }
    else { LISTEN.msg="Je n'ai rien compris. Réessaie ou tape le mot."; render(); }
  };
  rec.onerror = (ev)=>{
    const e = ev && ev.error;
    LISTEN.msg = e==='not-allowed' || e==='service-not-allowed' ? "Le micro est bloqué : autorise-le dans ton navigateur (cadenas à côté de l'adresse), ou tape le mot."
      : e==='no-speech' ? "Je n'ai rien entendu. Réessaie en parlant plus près du micro, ou tape le mot."
      : e==='audio-capture' ? "Aucun micro détecté sur cet appareil. Tape le mot."
      : e==='network' ? "La reconnaissance vocale a besoin d'Internet et n'a pas pu joindre son service. Tape le mot."
      : e==='language-not-supported' ? "Ce navigateur ne reconnaît pas le coréen à la voix. Tape le mot."
      : "La reconnaissance vocale n'a pas marché ("+(e||'erreur')+"). Tape le mot (par exemple d'après les sous-titres).";
    finish();
  };
  rec.onspeechend = ()=>{ try{ rec.stop(); }catch(e){} };
  rec.onend = ()=>{ finish(); };
  try{ rec.start(); }catch(e){ LISTEN.listening=false; LISTEN.msg="Le micro n'est pas disponible ici. Tape le mot à la place."; render(); }
}
