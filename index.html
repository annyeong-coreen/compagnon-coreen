  state.reviewMode=false; state.grammarMode=false; state.listenMode=false; state.globalQuizMode=false; state.puzzleMode=true;
  unsubscribeChat(); render();
}
function puzzleGrid(artIndex, pieces, small){
  const url = puzzleArtUrl(artIndex);
  const grid = el(`<div class="puzzle-grid" style="display:grid;grid-template-columns:repeat(${PUZZLE_COLS},1fr);gap:${small?2:4}px;max-width:${small?150:420}px;"></div>`);
  const shown = new Set(PUZZLE_ORDER.slice(0, pieces));
  for(let i=0;i<PUZZLE_PIECES;i++){
    const col=i%PUZZLE_COLS, row=Math.floor(i/PUZZLE_COLS);
    const x = PUZZLE_COLS>1 ? col*100/(PUZZLE_COLS-1) : 0, y = PUZZLE_ROWS>1 ? row*100/(PUZZLE_ROWS-1) : 0;
    const on = shown.has(i);
    const t = el(on
      ? `<div class="puzzle-tile on" style="aspect-ratio:1/1;border-radius:6px;background-image:url('${url}');background-size:${PUZZLE_COLS*100}% ${PUZZLE_ROWS*100}%;background-position:${x}% ${y}%;border:1.5px solid var(--line);"></div>`
      : `<div class="puzzle-tile off" style="aspect-ratio:1/1;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:${small?10:22}px;">${small?'':'🧩'}</div>`);
    grid.appendChild(t);
  }
  return grid;
}
function renderPuzzle(){
  const wrap = el('<div></div>');
  wrap.appendChild(el('<h2 style="margin:0 0 6px;">🧩 Mon puzzle</h2>'));
  wrap.appendChild(el('<div class="note" style="margin-bottom:14px;font-size:12.5px;">Chaque contrôle réussi te donne une pièce. Quand l\'image est complète, ta professeur t\'envoie un petit cadeau 🎁.</div>'));
  if(!GIFTS_TABLE_OK) wrap.appendChild(el('<div class="note" style="border-color:var(--seal);font-size:12px;margin-bottom:10px;">Le suivi des cadeaux n\'est pas encore activé (migration-puzzle.sql). Ton puzzle fonctionne quand même.</div>'));
  const sh = puzzleShown();
  wrap.appendChild(el(`<div style="font-size:13px;margin-bottom:8px;"><b>Image ${sh.number}</b> · ${sh.pieces}/${PUZZLE_PIECES} pièces${sh.complete?' — terminée !':sh.n===0?' — réussis un contrôle pour gagner ta première pièce.':` — encore ${PUZZLE_PIECES-sh.pieces} contrôle${PUZZLE_PIECES-sh.pieces>1?'s':''} réussi${PUZZLE_PIECES-sh.pieces>1?'s':''}.`}</div>`));
  wrap.appendChild(puzzleGrid(sh.art, sh.pieces, false));
  const sent = (GIFTS||[]).some(g=>g.puzzle_no===sh.number);
  if(sh.complete) wrap.appendChild(el(`<div class="note" style="border-color:var(--celadon-dark);margin-top:12px;">${sent?'🎁 Ta professeur t\'a remis le cadeau de cette image. Profites-en !':'🎉 Bravo, image terminée ! Ta professeur est prévenue : elle t\'enverra un petit cadeau.'}</div>`));
  if(sh.done > (sh.complete?1:0)){
    const hist = el('<div class="section-block" style="margin-top:22px;"><h3>Images terminées</h3></div>');
    const row = el('<div style="display:flex;gap:14px;flex-wrap:wrap;"></div>');
    const last = sh.complete ? sh.done-1 : sh.done;
    for(let k=1;k<=last;k++){
      const cell = el(`<div style="font-size:11px;color:var(--ink-soft);text-align:center;"></div>`);
      cell.appendChild(puzzleGrid((k-1)%PUZZLE_ART_COUNT, PUZZLE_PIECES, true));
      cell.appendChild(el(`<div style="margin-top:4px;">Image ${k}${(GIFTS||[]).some(g=>g.puzzle_no===k)?' · 🎁 remis':' · 🎁 à venir'}</div>`));
      row.appendChild(cell);
    }
    hist.appendChild(row); wrap.appendChild(hist);
  }
  return wrap;
}

function renderGrammarNotebook(){
  const wrap = el('<div></div>');
  const entryOf = (kind,key)=>GRAMMAR_SEEN.find(x=>x.kind===kind && x.key===key);
  // éléments déjà croisés d'une catégorie, les plus récents en premier
  const seenItems = (cat)=> cat.items().filter(([key])=>entryOf(cat.kind,key))
    .sort((x,y)=> String((entryOf(cat.kind,y[0])||{}).created_at||'').localeCompare(String((entryOf(cat.kind,x[0])||{}).created_at||'')));
  const cat = GRAMMAR_CATEGORIES.find(c=>c.kind===state.grammarCategory);
  const refCat = REF_CATEGORIES.find(c=>c.id===state.refCategory);
  if(refCat){ renderRefCategory(wrap, refCat); return wrap; }

  if(!cat){
    // ----- accueil : les catégories -----
    wrap.appendChild(el('<h2 style="margin:0 0 4px;">📒 Aide-mémoire grammaire</h2>'));
    wrap.appendChild(el(`<div class="note" style="margin-bottom:16px;">Les <b>particules</b>, les <b>classificateurs</b> et les <b>expressions de grammaire</b> que tu croises en cliquant sur les mots d'un texte (onglet Traduction) viennent s'ajouter ici automatiquement, au fur et à mesure. Il en va de même pour les <b>nombres</b>, les <b>jours</b>, les <b>saisons</b>, la <b>famille</b>, les <b>couleurs</b>… : chaque fiche se remplit quand tu croises ces mots. Choisis une catégorie.</div>`));
    if(!GRAMMAR_TABLE_OK){
      wrap.appendChild(el(`<div class="note" style="border-color:var(--seal);margin-bottom:16px;font-size:12.5px;">⚠️ La sauvegarde de cette liste n'est pas encore activée : elle ne dure que le temps de cette session. Demande à celui qui gère l'outil de lancer <b>migration-grammaire.sql</b> dans Supabase.</div>`));
    }
    const grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;"></div>');
    GRAMMAR_CATEGORIES.forEach(c=>{
      const list = seenItems(c);
      const nNew = list.filter(([key])=>isGrammarEntryNew(entryOf(c.kind,key))).length;
      const tile = el(`<button type="button" class="gm-cat" data-kind="${c.kind}" style="text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;background:var(--paper);border:1.5px solid ${list.length?'var(--ink)':'var(--line)'};border-radius:12px;padding:16px 18px;${list.length?'':'opacity:.7;'}">
        <div style="font-size:26px;line-height:1;">${c.icon}</div>
        <div style="font-size:16px;font-weight:600;margin:8px 0 2px;">${escapeHtml(c.title)}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.45;">${escapeHtml(c.hint)}</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="mono gm-count" style="font-size:12.5px;">${list.length ? (list.length+' rencontré'+(list.length>1?'s':'')) : 'Rien pour l\'instant'}</span>
          ${nNew?`<span class="gm-new mono" style="font-size:11px;background:var(--seal);color:#fff;border-radius:999px;padding:1px 9px;">${nNew} nouveau${nNew>1?'x':''}</span>`:''}
        </div>
      </button>`);
      tile.onclick = ()=>{ state.grammarCategory = c.kind; render(); };
      grid.appendChild(tile);
    });
    refTiles(grid);
    wrap.appendChild(grid);
    if(!FICHE_SAVE_OK) wrap.appendChild(el('<div class="note" style="border-color:var(--seal);margin-top:16px;font-size:12.5px;">⚠️ Les nouvelles fiches ne sont pas encore sauvegardées : elles ne durent que le temps de cette session. Demande à celui qui gère l\'outil de lancer <b>migration-fiches.sql</b> dans Supabase.</div>'));
    return wrap;
  }

  // ----- une catégorie : la liste de ce que l'élève a croisé -----
  const back = el('<button class="btn ghost small gm-back" style="margin-bottom:14px;">← Aide-mémoire</button>');
  back.onclick = ()=>{ state.grammarCategory = null; render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h2 style="margin:0 0 4px;">${cat.icon} ${escapeHtml(cat.title)}</h2>`));
  wrap.appendChild(el(`<div class="note" style="margin-bottom:16px;font-size:12.5px;">${escapeHtml(cat.hint)}. Clique sur un élément pour voir le détail.</div>`));
  const list = seenItems(cat);
  if(list.length===0){
    wrap.appendChild(el(`<div class="empty-state es-bowl"><span class="kr">텅 비었어요</span><div>Rien dans cette catégorie pour l'instant — clique sur les mots d'un texte dans Traduction : ce que tu croiseras viendra ici.</div></div>`));
    return wrap;
  }
  list.forEach(([key,ref])=>{
    const isNew = isGrammarEntryNew(entryOf(cat.kind,key));
    const card = el(`<div class="item-card gm-item" style="text-align:left;padding:0;margin-bottom:10px;overflow:hidden;">
      <button type="button" class="gm-head" style="display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;font-family:inherit;color:var(--ink);background:none;border:none;padding:12px 16px;cursor:pointer;">
        <span class="kr" style="font-size:22px;">${escapeHtml(ref.label)}</span>
        <span style="font-size:13px;color:var(--ink-soft);flex:1;">${escapeHtml(ref.fr)}</span>
        ${isNew?'<span class="gm-new mono" style="font-size:11px;background:var(--seal);color:#fff;border-radius:999px;padding:1px 9px;">nouveau</span>':''}
        <span class="gm-arrow" style="color:var(--ink-soft);">▾</span>
      </button>
      <div class="gm-detail" style="display:none;padding:0 16px 14px;">
        ${ref.note?`<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(ref.note)}</div>`:''}
        ${ref.nums?`<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">Nombres : ${escapeHtml(ref.nums)}</div>`:''}
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">ex. ${escapeHtml(ref.ex)}</div>
      </div>
    </div>`);
    const detail = card.querySelector('.gm-detail');
    const rm = el('<button class="btn ghost small" style="margin-top:10px;">Retirer de ma liste</button>');
    rm.onclick = async ()=>{ await unmarkGrammarSeen(cat.kind, key); render(); };
    detail.appendChild(rm);
    card.querySelector('.gm-head').onclick = ()=>{
      const open = detail.style.display==='none';
      detail.style.display = open ? 'block' : 'none';
      card.querySelector('.gm-arrow').textContent = open ? '▴' : '▾';
    };
    wrap.appendChild(card);
  });
  return wrap;
}

function renderWeakWordsPractice(){
  const wrap = el('<div></div>');
  wrap.appendChild(el(`<h2 style="margin:0 0 4px;">🔁 Mots à revoir</h2>`));
  wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">Chaque mot que tu débloques en Traduction atterrit ici automatiquement — indépendamment de la leçon d\'origine.</div>'));

  const addBox = el(`<div class="section-block" style="border:1.5px dashed var(--celadon-dark);border-radius:10px;padding:14px 16px;margin-bottom:20px;">
    <h3 style="margin-top:0;font-size:15px;">+ Ajouter tes propres mots</h3>
    <div class="note" style="margin-bottom:10px;font-size:12px;">Tu as trouvé un mot en dehors des cours ? Écris-le en coréen et note sa traduction.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;">
      <div style="flex:1;min-width:150px;"><div style="font-size:12px;color:var(--ink-soft);margin-bottom:3px;">Mot en coréen</div>
        <div style="display:flex;align-items:center;"><input type="text" id="ww-kr" lang="ko" data-ko="1" placeholder="예쁘다" style="flex:1;min-width:0;font-size:16px;"></div></div>
      <div style="flex:1;min-width:150px;"><div style="font-size:12px;color:var(--ink-soft);margin-bottom:3px;">Traduction en français</div>
        <input type="text" id="ww-fr" placeholder="joli, mignon" style="width:100%;box-sizing:border-box;font-size:16px;"></div>
    </div>
    <button class="btn celadon small" id="ww-one-btn" style="margin-top:8px;">Ajouter ce mot</button>
    <span id="ww-one-status" style="margin-left:8px;font-size:12px;color:var(--ink-soft);"></span>
    <details style="margin-top:14px;"><summary style="cursor:pointer;font-size:12.5px;color:var(--ink-soft);">Ajouter plusieurs mots d'un coup (coller des notes de cours)</summary>
    <div class="note" style="margin:8px 0;font-size:12px;">Colle même un morceau brut de tes notes de cours — l'outil repère tout seul les lignes où il y a du coréen suivi d'une traduction en français (ex. "바람이 불다 il y a du vent"), même sans séparateur. Les lignes sans traduction sont simplement ignorées.</div>
    <textarea id="ww-paste" data-ko="1" style="width:100%;min-height:80px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;font-size:13px;" placeholder="예쁘다 → joli, mignon"></textarea>
    <button class="btn celadon small" id="ww-paste-btn" style="margin-top:8px;">Ajouter à mes révisions</button>
    <span id="ww-paste-status" style="margin-left:8px;font-size:12px;color:var(--ink-soft);"></span></details>
  </div>`);
  addBox.querySelector('#ww-one-btn').onclick = async ()=>{
    const kr = addBox.querySelector('#ww-kr').value.trim();
    const fr = addBox.querySelector('#ww-fr').value.trim();
    const status = addBox.querySelector('#ww-one-status');
    if(!kr || !fr){ status.textContent = 'Remplis le mot en coréen et sa traduction.'; return; }
    if(!isHangul(kr)){ status.textContent = 'Le premier champ doit contenir du coréen (utilise le bouton 한).'; return; }
    status.textContent = 'Ajout en cours…';
    await sbAddWeakWord(kr, fr);
    render();
  };
  addBox.querySelector('#ww-paste-btn').onclick = async ()=>{
    const raw = addBox.querySelector('#ww-paste').value;
    const status = addBox.querySelector('#ww-paste-status');
    const parsed = parseVocabText(raw).filter(v=>v.fr);
    if(parsed.length===0){ status.textContent = 'Rien de reconnu — vérifie le format.'; return; }
    status.textContent = 'Ajout en cours…';
    const added = await sbAddWeakWordsBulk(parsed);
    status.textContent = added>0 ? `${added} mot(s) ajouté(s) ✓` : 'Déjà tous présents.';
    addBox.querySelector('#ww-paste').value = '';
    render();
  };
  wrap.appendChild(addBox);

  const tabs = el('<div class="tabs"></div>');
  [['jour',`Aujourd'hui (${dueWords().length})`],['memoriser','À mémoriser'],['exercices','Exercices'],['jeu','Jeu']].forEach(([key,label])=>{
    const b = el(`<button class="tab-btn ${state.reviewTab===key?'active':''}">${label}</button>`);
    b.onclick = ()=>{ state.reviewTab=key; state.reviewExerciseIndex=0; state.reviewCorrectCount=0; state.reviewOrderFresh=false; state.pairGame=null; render(); };
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  if(state.reviewTab==='jeu'){ wrap.appendChild(renderPairGame()); return wrap; }
  if(WEAK_WORDS.length===0){
    wrap.appendChild(el(`<div class="empty-state es-bowl"><span class="kr">텅 비었어요</span><div>Rien à revoir pour l'instant — ajoute des mots ci-dessus, ou utilise l'aide en Traduction.</div></div>`));
    return wrap;
  }

  if(state.reviewTab==='memoriser'){
    wrap.appendChild(el('<div class="note" style="margin-bottom:14px;font-size:12.5px;">Une fois qu\'un mot est acquis, clique sur "Je le connais" pour l\'enlever de la liste — sinon elle ne fait que grossir. Tu peux aussi en cocher plusieurs et les retirer d\'un coup.</div>'));

    if(WEAK_WORDS.length > 4){
      const toolbar = el('<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;"></div>');
      const selectedCount = Object.values(state.reviewSelected).filter(Boolean).length;
      const allSelected = selectedCount>0 && selectedCount===WEAK_WORDS.length;
      const selectAllBtn = el(`<button class="btn ghost small">${allSelected?'Tout désélectionner':'Tout sélectionner'}</button>`);
      selectAllBtn.onclick = ()=>{
        if(allSelected){ state.reviewSelected = {}; }
        else{ WEAK_WORDS.forEach(w=>{ state.reviewSelected[w.word] = true; }); }
        render();
      };
      const bulkDeleteBtn = el(`<button class="btn seal small" ${selectedCount===0?'disabled':''}>🗑️ Retirer la sélection (${selectedCount})</button>`);
      bulkDeleteBtn.onclick = async ()=>{
        const words = Object.keys(state.reviewSelected).filter(w=>state.reviewSelected[w]);
        bulkDeleteBtn.disabled = true;
        await sbRemoveWeakWordsBulk(words);
        state.reviewSelected = {};
        render();
      };
      toolbar.appendChild(selectAllBtn);
      toolbar.appendChild(bulkDeleteBtn);
      wrap.appendChild(toolbar);
    }

    const grid = el('<div class="card-grid"></div>');
    WEAK_WORDS.forEach(w=>{
      const cell = el('<div></div>');
      const checkRow = el(`<label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);margin-bottom:4px;"><input type="checkbox" ${state.reviewSelected[w.word]?'checked':''}> sélectionner</label>`);
      checkRow.querySelector('input').onchange = (e)=>{ state.reviewSelected[w.word] = e.target.checked; render(); };
      cell.appendChild(checkRow);
      const c = el(`<div class="flip-card"><div><span class="kr">${escapeHtml(w.word)}</span></div></div>`);
      let revealed = false;
      c.onclick = ()=>{
        revealed = !revealed; c.classList.toggle('revealed', revealed);
        c.querySelector('div').innerHTML = revealed
          ? `<span class="kr">${escapeHtml(w.word)}</span><div class="meaning">${escapeHtml(w.meaning||'')}</div>${w.note?`<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">🎧 ${escapeHtml(w.note)}</div>`:''}`
          : `<span class="kr">${escapeHtml(w.word)}</span>`;
      };
      cell.appendChild(c);
      const knowBtn = el('<button class="btn ghost small" style="width:100%;margin-top:4px;font-size:11px;">✓ Je le connais</button>');
      knowBtn.onclick = async ()=>{
        knowBtn.disabled = true;
        await sbRemoveWeakWord(w.word);
        delete state.reviewSelected[w.word];
        render();
      };
      cell.appendChild(knowBtn);
      grid.appendChild(cell);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  // Exercices : drill de saisie. Chaque réponse règle la prochaine date de révision du mot (révision espacée).
  if(state.reviewTab==='jour'){
    wrap.appendChild(el('<div class="note" style="margin-bottom:14px;font-size:12.5px;">Ici, seulement les mots qui sont à revoir <b>aujourd\'hui</b>. Un mot réussi revient plus tard (demain, puis 3 jours, une semaine…) ; un mot raté revient tout de suite. Tu n\'as rien à régler.</div>'));
  }
  const base = state.reviewTab==='jour' ? dueWords() : WEAK_WORDS;
  if(!state.reviewPoolWords || state.reviewPoolTab!==state.reviewTab || (state.reviewExerciseIndex===0 && !state.reviewOrderFresh)){ state.reviewPoolWords = base.map(w=>w.word); state.reviewPoolTab = state.reviewTab; state.reviewOrder = null; }
  const POOL = state.reviewPoolWords.map(wd=>WEAK_WORDS.find(w=>w.word===wd)).filter(Boolean);
  const total = POOL.length;
  if(total===0){
    wrap.appendChild(el('<div class="empty-state es-fan"><span class="kr">잘했어요</span><div>Rien à revoir aujourd\'hui — reviens demain. Tu peux aussi t\'entraîner dans l\'onglet « Exercices » ou jouer aux paires.</div></div>'));
    return wrap;
  }
  if(!state.reviewOrder || state.reviewOrder.length!==total || state.reviewExerciseIndex===0 && !state.reviewOrderFresh){ state.reviewOrder = smartOrder(POOL.map((_,i)=>i), i=>POOL[i].word); state.reviewOrderFresh = true; }
  if(state.reviewExerciseIndex >= total){
    const done = el(`<div class="result-box"><div class="score mono">${state.reviewCorrectCount||0}/${total}</div><div style="margin:8px 0 16px;">Tour terminé — refais-en un autre pour renforcer la mémoire.</div></div>`);
    if(state.reviewTab==='jour') done.lastElementChild.textContent = 'Bravo, c\'est fait pour aujourd\'hui ! Les mots ratés reviendront dans un nouveau tour.';
    const restart = el('<button class="btn celadon">Recommencer</button>');
    restart.onclick = ()=>{ state.reviewExerciseIndex=0; state.reviewCorrectCount=0; state.reviewOrderFresh=false; render(); };
    done.appendChild(restart); wrap.appendChild(done); return wrap;
  }
  const item = POOL[state.reviewOrder[state.reviewExerciseIndex]];
  wrap.appendChild(el(`<div class="mono" style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Carte ${state.reviewExerciseIndex+1} / ${total}</div>`));
  wrap.appendChild(el(`<div class="item-card" style="max-width:220px;padding:26px 16px;margin-bottom:16px;"><span class="kr" style="font-size:34px;">${escapeHtml(item.word)}</span></div>`));
  const row = el('<div style="display:flex;gap:8px;max-width:340px;"></div>');
  const input = el('<input type="text" placeholder="traduction en français...">'); input.style.flex='1';
  const checkBtn = el('<button class="btn celadon">Vérifier</button>');
  row.appendChild(input); row.appendChild(checkBtn); wrap.appendChild(row);
  const fb = el('<div style="margin-top:10px;"></div>'); wrap.appendChild(fb);
  const nextBtn = el('<button class="btn ghost" style="margin-top:12px;display:none;">Suivant →</button>'); wrap.appendChild(nextBtn);
  const doCheck = ()=>{
    if(input.disabled) return;
    const level = frAnswerLevel(input.value, item.meaning);
    const ok = level!=='no';
    srsRecord(item.word, ok); markStudyDay();
    if(ok){ state.reviewCorrectCount=(state.reviewCorrectCount||0)+1; fb.innerHTML = level==='near' ? `<div class="feedback ok">Presque, c'est bon 👍 — on écrit : « ${escapeHtml(frDisplay(item.meaning))} »</div>` : `<div class="feedback ok">Exact 👍</div>`; }
    else{ fb.innerHTML = `<div class="feedback ko">Pas tout à fait — "${escapeHtml(item.meaning||'')}".</div>`; }
    checkBtn.disabled=true; input.disabled=true; nextBtn.style.display='inline-block';
  };
  checkBtn.onclick = doCheck;
  input.onkeydown = (e)=>{ if(e.key==='Enter') doCheck(); };
  nextBtn.onclick = ()=>{ state.reviewExerciseIndex++; render(); };
  return wrap;
}


// Jeu de paires : on relie chaque mot coréen à sa traduction. Pratique libre, sans note.
function pairPool(){
  const out=[], seenK=new Set(), seenF=new Set();
  const add=(kr,fr)=>{ kr=String(kr||'').trim(); fr=String(fr||'').trim().replace(/\s*\[.*?\]\s*/g,'').trim();
    if(!kr||!fr||!isHangul(kr)||kr.length>12||fr.length>30||seenK.has(kr)||seenF.has(fr.toLowerCase())) return;
    seenK.add(kr); seenF.add(fr.toLowerCase()); out.push({kr,fr}); };
  WEAK_WORDS.forEach(w=>add(w.word,w.meaning));
  Object.keys(LESSONS_CACHE).forEach(k=>(LESSONS_CACHE[k]||[]).forEach(l=>{ const pr=PROGRESS[l.id]; if(pr&&pr.control&&pr.control.passed) (l.vocab||[]).forEach(v=>add(v.kr,v.fr)); }));
  return out;
}
function renderPairGame(){
  const wrap = el('<div></div>');
  const pool = pairPool();
  if(pool.length<4){ wrap.appendChild(el('<div class="empty-state es-lantern"><span class="kr">아직이에요</span><div>Il te faut au moins 4 mots (dans « Mots à revoir » ou dans des leçons dont tu as réussi le contrôle) pour jouer aux paires.</div></div>')); return wrap; }
  if(!state.pairGame){
    const items = pool.sort(()=>Math.random()-0.5).slice(0,6);
    state.pairGame = { items, left:items.map((_,i)=>i).sort(()=>Math.random()-0.5), right:items.map((_,i)=>i).sort(()=>Math.random()-0.5), solved:[], sel:null, errors:0 };
  }
  const g = state.pairGame;
  wrap.appendChild(el('<div class="note" style="margin-bottom:14px;font-size:12.5px;">Touche un mot coréen, puis sa traduction. Quand tout est relié, la partie est finie.</div>'));
  const area = el('<div></div>'); wrap.appendChild(area);
  const draw = ()=>{
    area.innerHTML='';
    if(g.solved.length===g.items.length){
      const box = el(`<div class="result-box"><div class="score mono">${g.errors===0?'Sans faute !':g.errors+' erreur'+(g.errors>1?'s':'')}</div><div style="margin:8px 0 16px;">Bravo, toutes les paires sont reliées.</div></div>`);
      const again = el('<button class="btn celadon">Nouvelle partie</button>');
      again.onclick = ()=>{ state.pairGame=null; render(); };
      box.appendChild(again); area.appendChild(box); return;
    }
    const cols = el('<div class="pair-cols"></div>');
    const L = el('<div class="pair-col"></div>'), R = el('<div class="pair-col"></div>');
    g.left.forEach(i=>{
      const done = g.solved.includes(i);
      const b = el(`<button type="button" class="pair-tile kr ${done?'ok':''} ${g.sel===i?'sel':''}" ${done?'disabled':''}>${escapeHtml(g.items[i].kr)}</button>`);
      b.onclick = ()=>{ g.sel = (g.sel===i ? null : i); draw(); };
      L.appendChild(b);
    });
    g.right.forEach(i=>{
      const done = g.solved.includes(i);
      const b = el(`<button type="button" class="pair-tile ${done?'ok':''}" ${done?'disabled':''}>${escapeHtml(g.items[i].fr)}</button>`);
      b.onclick = ()=>{
        if(g.sel===null) return;
        if(g.sel===i){ g.solved.push(i); g.sel=null; if(g.solved.length===g.items.length) markStudyDay(); draw(); }
        else{ g.errors++; g.sel=null; b.classList.add('bad'); setTimeout(draw, 350); }
      };
      R.appendChild(b);
    });
    cols.appendChild(L); cols.appendChild(R); area.appendChild(cols);
  };
  draw();
  return wrap;
}

/* ===== Texte d'entraînement : construit uniquement à partir du cours ===== */
const PRACTICE_TEMPLATES = [
  { id:'copule', kr:(n)=> n + (hFinal(n.slice(-1))>0 ? '이에요' : '예요') + '.', fr:(f)=> "C'est " + f + '.' },
  { id:'existe', kr:(n)=> n + (hFinal(n.slice(-1))>0 ? '이' : '가') + ' 있어요.', fr:(f)=> 'Il y a ' + f + '.' },
  { id:'aime',   kr:(n)=> '저는 ' + n + (hFinal(n.slice(-1))>0 ? '을' : '를') + ' 좋아해요.', fr:(f)=> "J'aime " + f + '.' }
];
function practiceFrNoun(fr){
  const f = String(fr||'').trim().replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').trim();
  if(!f) return '';
  if(/^(le|la|l'|l’|les|un|une|des|mon|ma|mes|ton|ta|tes|son|sa|ses)\b/i.test(f) || /^(l'|l’)/i.test(f)) return f;
  return '« ' + f + ' »';
}
function collectLessonMaterial(lesson){
  const sentences = [], nouns = [], seen = new Set();
  const isKo = t => /[가-힣]/.test(t);
  (lesson.dialogue||[]).forEach(ex=>{
    if(ex.equiv) return;
    (ex.segments||[]).forEach(seg=>{
      const kr = String(seg.kr||'').trim(), fr = String(seg.fr||'').trim();
      if(seg.gloss || !kr || !fr || !isKo(kr)) return;
      if(/[A-Za-zÀ-ÿ]{3,}/.test(kr)) return;                 // ligne mêlée de français : on ne la prend pas
      const words = kr.split(/\s+/).length;
      if(words>=2 || /[.?!]$/.test(kr)){ if(!seen.has(kr)){ seen.add(kr); sentences.push({kr, fr}); } }
      else if(!/다$/.test(kr)) nouns.push({kr, fr});
    });
  });
  (lesson.vocab||[]).forEach(v=>{
    const kr = String(v.kr||'').trim(), fr = String(v.fr||'').trim();
    if(!kr || !fr || !isKo(kr) || /\s/.test(kr) || /다$/.test(kr) || /[^가-힣]/.test(kr)) return;
    nouns.push({kr, fr});
  });
  // exemples dans les notes de grammaire : « 한국어 = français », « 한국어 → français » ou « 한국어 (français) »
  (lesson.grammar||[]).forEach(g=>{
    String(g).replace(/<[^>]*>/g,'\n').split(/\n/).forEach(line=>{
      const m = line.match(/([가-힣][가-힣\s,]*[가-힣][.?!]?)\s*(?:=|→|:|\()\s*([^()=→가-힣]{4,}?)\)?\s*$/);
      if(m){ const kr=m[1].trim(), fr=m[2].trim(); if(kr.split(/\s+/).length>=2 && /[a-zà-ÿ]/i.test(fr) && !seen.has(kr)){ seen.add(kr); sentences.push({kr, fr}); } }
    });
  });
  const uniq = []; const sn = new Set(); nouns.forEach(n=>{ if(!sn.has(n.kr)){ sn.add(n.kr); uniq.push(n); } });
  return { sentences, nouns: uniq };
}
function buildPracticeText(lesson, rnd){
  rnd = rnd || Math.random;
  const { sentences, nouns } = collectLessonMaterial(lesson);
  const pick = [];
  if(sentences.length){
    const n = Math.min(5, sentences.length);
    const start = sentences.length>n ? Math.floor(rnd()*(sentences.length-n+1)) : 0;   // fenêtre continue : le texte garde son fil
    sentences.slice(start, start+n).forEach(x=>pick.push(x));
  }
  if(pick.length<4 && nouns.length){
    const pool = nouns.slice().sort(()=>rnd()-0.5);
    for(let i=0; i<pool.length && pick.length<4; i++){
      const noun = pool[i], tpl = PRACTICE_TEMPLATES[(i + Math.floor(rnd()*3)) % PRACTICE_TEMPLATES.length];
      pick.push({ kr: tpl.kr(noun.kr), fr: tpl.fr(practiceFrNoun(noun.fr)), template:true });
    }
  }
  if(pick.length<2) return null;
  return { text: pick.map(x=>x.kr).join('\n'), ref: pick.map(x=>x.fr).join('\n'),
           fromCourse: pick.filter(x=>!x.template).length, generated: pick.filter(x=>x.template).length };
}
function renderPractice(lesson){
  const wrap = el('<div></div>');

  const make = ()=>{

    state.practiceDraft = ''; state.practiceValidated = false;
    state.practice = r ? Object.assign({lessonId:lesson.id}, r) : { lessonId:lesson.id, empty:true };

  if(!cur){
    wrap.appendChild(el(`<div class="note" style="margin-bottom:14px;">Tu veux t'entraîner à lire ? Je compose un petit texte <b>à partir de ta leçon</b> (ses phrases et son vocabulaire). Il est généré automatiquement et n'est pas écrit par ta professeur.</div>`));
    const b = el('<button class="btn celadon">✨ Créer un texte pour m\'entraîner</button>'); b.onclick = make; wrap.appendChild(b);
    return wrap;
  }
  if(cur.empty){
    wrap.appendChild(el(`<div class="empty-state es-lantern"><span class="kr">아직이에요</span><div>Il n'y a pas encore assez de phrases ou de vocabulaire dans cette leçon pour composer un texte. Reviens quand ta professeur aura complété le cours.</div></div>`));
    const b = el('<button class="btn ghost small">Réessayer</button>'); b.onclick = make; wrap.appendChild(b);
    return wrap;
  }
  const bar = el('<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;"></div>');
  const again = el('<button class="btn ghost small">🔄 Un autre texte</button>'); again.onclick = make;
  bar.appendChild(again);
  wrap.appendChild(bar);
  wrap.appendChild(el(`<div class="note" style="margin-bottom:12px;font-size:12.5px;border-color:var(--celadon-dark);">📝 Texte généré automatiquement à partir de ta leçon (${cur.fromCourse} phrase${cur.fromCourse>1?'s':''} de ton cours${cur.generated?` + ${cur.generated} phrase${cur.generated>1?'s':''} simple${cur.generated>1?'s':''} construite${cur.generated>1?'s':''} avec ton vocabulaire`:''}).</div>`));
  wrap.appendChild(renderTraduction(Object.assign({}, lesson, { translations:[{ text:cur.text, ref:cur.ref, help:[] }] }), { generated:true }));
  return wrap;
}

function renderTraduction(lesson, opts){
  opts = opts || {};
  const dk = opts.generated ? 'practiceDraft' : 'translationDraft', vk = opts.generated ? 'practiceValidated' : 'translationValidated';
  const wrap = el('<div></div>');
  const items = lesson.translations || [];
  if(items.length===0){
    wrap.appendChild(el('<div class="empty-state">Pas de texte à traduire pour cette leçon pour l\'instant.</div>'));
    return wrap;
  }
  const item = items[0];
  wrap.appendChild(el('<div class="note" style="margin-bottom:16px;">Traduis ce texte en français. Bloqué sur un mot ? Clique dessus directement dans le texte pour voir une proposition de traduction.</div>'));
  wrap.appendChild(el(`<div class="note" style="border-color:var(--seal);margin-bottom:16px;font-size:12.5px;">⚠️ Ces traductions sont automatiques. Quand un mot a plusieurs sens possibles, tu verras plusieurs propositions séparées par "/" — à toi de choisir celle qui colle au contexte, ou de rester prudent si aucune ne te semble sûre. En cas de doute, fie-toi plutôt à la liste préparée par ta professeur ci-dessous, ou demande-lui directement dans le chat.</div>`));

  const textCard = el('<div class="item-card kr" style="text-align:left;font-size:19px;line-height:2.2;padding:20px;margin-bottom:16px;white-space:pre-wrap;"></div>');
  const tokens = (item.text||'').split(/(\s+)/);
  const cleanOf = tok => tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
  // expressions de grammaire (ex. "탈 수 있어요") et "nombre + classificateur" (ex. "세 번")
  const wordsClean = tokens.filter(tok=> tok!=='' && !/^\s+$/.test(tok)).map(cleanOf).filter(Boolean);
  const grammarPerWord = findGrammarPatterns(wordsClean);
  const counterPerWord = findCounters(wordsClean);
  const hasGrammar = grammarPerWord.some(g=>g.length>0) || counterPerWord.some(Boolean);
  const textNoSpace = (item.text||'').replace(/\s+/g,'');
  let wordIdx = -1;
  let gramOwner = null;
  let openClose = null;                    // une seule bulle de traduction ouverte à la fois
  const gramPanel = el('<div></div>');
  tokens.forEach(tok=>{
    if(tok==='' ){ return; }
    if(/^\s+$/.test(tok)){ textCard.appendChild(document.createTextNode(tok)); return; }
    const clean = cleanOf(tok);
    if(!clean){ textCard.appendChild(document.createTextNode(tok)); return; }
    wordIdx++;
    const gram = grammarPerWord[wordIdx] || [];
    const cinfo = counterPerWord[wordIdx];
    const span = el(`<span style="cursor:pointer;border-bottom:1.5px dashed ${(gram.length||cinfo)?'var(--seal)':'var(--celadon-dark)'};">${escapeHtml(tok)}</span>`);
    const variantsWrap = el('<span></span>');
    let revealed = false;
    const closeMe = ()=>{ revealed = false; variantsWrap.innerHTML = ''; };
    const makeVariantChip = (label, onPick)=>{
      const chip = el(`<button type="button" class="mono var-chip" style="font-size:11px;padding:2px 8px;margin:0 3px 3px 0;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;">${escapeHtml(label)}</button>`);
      chip.onclick = async (e)=>{
        e.stopPropagation();
        [...variantsWrap.querySelectorAll('button.var-chip')].forEach(b=>{ b.style.borderColor='var(--line)'; b.style.background='var(--paper)'; b.style.color='var(--ink)'; });
        chip.style.borderColor='var(--celadon-dark)'; chip.style.background='var(--celadon)'; chip.style.color='#fff';
        await onPick();
      };
      return chip;
    };
    span.onclick = async ()=>{
      if(span.dataset.busy==='1') return;
      if(revealed){
        closeMe(); if(openClose===closeMe) openClose = null;
        if(gramOwner===span){ gramPanel.innerHTML=''; gramOwner=null; }
        return;
      }
      if(openClose) openClose();           // on referme le mot précédemment ouvert
      openClose = closeMe;
      span.dataset.busy = '1';
      variantsWrap.innerHTML = '';
      variantsWrap.appendChild(document.createTextNode(' '));
      gramPanel.innerHTML = ''; gramOwner = span;   // l'explication de grammaire s'affiche sous le texte
      refMark(clean, null, textNoSpace);              // fiches de l'aide-mémoire (nombres, jours, saisons…)
      gram.forEach(g=>{ gramPanel.appendChild(buildGrammarChip(g.pat, g.text)); markGrammarSeen('expression', g.pat.label); });
      if(cinfo){ gramPanel.appendChild(buildCounterChip(cinfo.key)); markGrammarSeen('classificateur', cinfo.key); }
      const finish = ()=>{ revealed = true; span.dataset.busy = '0'; };
      // a) mot purement grammatical d'une expression (수, 있어요…) ou classificateur : l'explication suffit
      if((gram.length && gram.every(g=>g.pat.fn.includes(g.pos))) || (cinfo && cinfo.role==='counter')){ finish(); return; }
      // b) nombre placé devant un classificateur : on le calcule (한/두/세/네…)
      if(cinfo && cinfo.role==='number'){
        const fr = frNumberWord(cinfo.number);
        variantsWrap.appendChild(makeVariantChip(`${fr} (${cinfo.number})`, ()=>sbAddWeakWord(clean, fr)));
        finish(); return;
      }
      // c) particule isolée (가, 를, 에서…) : c'est une particule, pas un nom ni un verbe
      const verbHit = gram.find(g=>g.pos===0 && g.pat.stem);
      if(BARE_PARTICLES.includes(clean) && !verbHit){
        const key = PARTICLE_SURFACE_TO_KEY[clean];
        gramPanel.appendChild(buildParticleChip(key)); markGrammarSeen('particule', key);
        finish(); return;
      }
      // d) mot : forme du dictionnaire du verbe ("탈" -> "타다", "가" dans "가 봤어요" -> "가다"),
      //    ou nom + particule(s) collée(s) ("택시를" -> "택시" + 를)
      const loading = el('<span class="mono" style="font-size:11px;color:var(--ink-soft);">…</span>');
      variantsWrap.appendChild(loading);
      const preferred = verbHit ? verbDictionaryForm(clean, verbHit.pat.stem) : null;
      try{
        const found = await lookupWordSmart(clean, preferred);
        if(openClose!==closeMe){ span.dataset.busy='0'; return; }   // l'élève a cliqué ailleurs entre-temps
        loading.remove();
        if(found.word!==clean){
          variantsWrap.appendChild(el(`<span style="font-size:12px;margin-right:4px;color:var(--ink-soft);"><b>${escapeHtml(found.word)}</b> :</span>`));
        }
        found.variants.forEach(v=> variantsWrap.appendChild(makeVariantChip(v, ()=>sbAddWeakWord(found.word, v))));
        particleKeysOf(found.particles || []).forEach(key=>{ gramPanel.appendChild(buildParticleChip(key)); markGrammarSeen('particule', key); });
        if(found.word && found.word!==clean) refMark(clean, found.word, textNoSpace);
        revealed = true;
      }catch(e){
        if(openClose!==closeMe){ span.dataset.busy='0'; return; }
        loading.remove();
        if(gram.length){ variantsWrap.appendChild(el('<span style="font-size:11px;color:var(--ink-soft);">(pas de traduction pour ce mot seul)</span>')); revealed = true; }
        else variantsWrap.innerHTML = ' <span style="font-size:11px;color:var(--danger);">(indisponible)</span>';
      }
      span.dataset.busy = '0';
    };
    textCard.appendChild(span);
    textCard.appendChild(variantsWrap);
  });
  wrap.appendChild(textCard);
  wrap.appendChild(gramPanel);
  wrap.appendChild(el(`<div class="note" style="margin-top:-8px;margin-bottom:16px;font-size:12px;">Clique sur la proposition qui te semble la plus juste pour la valider — elle part alors dans "Mots à revoir" (choisie par toi, pas imposée par l'IA). Un mot suivi d'une particule (을/를, 에서, 가…) ? Clique dessus : la particule est expliquée sous le texte.${hasGrammar ? ` Les mots soulignés en <b style="color:var(--seal);">rouge</b> font partie d'une expression de grammaire ou d'un nombre avec son classificateur.` : ''}${PROFILE && PROFILE.role==='student' ? ` Tout ce que tu croises s'ajoute à ton 📒 Aide-mémoire grammaire.` : ''}</div>`));

  const textarea = el('<textarea style="width:100%;min-height:110px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;font-size:14px;" placeholder="Ta traduction en français..."></textarea>');
  textarea.value = state[dk] || '';
  textarea.disabled = state[vk];
  textarea.oninput = (e)=>{ state[dk] = e.target.value; };
  wrap.appendChild(textarea);

  if(!state[vk]){
    const validateBtn = el('<button class="btn celadon" style="margin-top:10px;">✓ Valider ma traduction</button>');
    validateBtn.onclick = ()=>{
      if(!textarea.value.trim()){ alert('Écris ta traduction avant de valider.'); return; }
      state[vk] = true;
      render();
    };
    wrap.appendChild(validateBtn);
  } else {
    const editAgainBtn = el('<button class="btn ghost small" style="margin-top:10px;">✏️ Modifier ma traduction</button>');
    editAgainBtn.onclick = ()=>{ state[vk] = false; render(); };
    wrap.appendChild(el('<div class="note" style="margin-top:10px;border-color:var(--celadon-dark);font-size:12.5px;">Traduction validée ✓ — la référence est débloquée plus bas.</div>'));
    wrap.appendChild(editAgainBtn);
  }

  if(item.help && item.help.length){
    const helpBlock = el('<div class="section-block" style="margin-top:20px;"><h3>Aide donnée par la professeur sur certains mots</h3></div>');
    const grid = el('<div class="card-grid"></div>');
    item.help.forEach(h=>{
      const c = el(`<div class="flip-card"><div><span class="kr">${escapeHtml(h.word)}</span></div></div>`);
      let revealed = false;
      c.onclick = ()=>{
        revealed = !revealed; c.classList.toggle('revealed', revealed);
        c.querySelector('div').innerHTML = revealed
          ? `<span class="kr">${escapeHtml(h.word)}</span><div class="meaning">${escapeHtml(h.meaning)}</div>`
          : `<span class="kr">${escapeHtml(h.word)}</span>`;
        if(revealed){ sbAddWeakWord(h.word, h.meaning); }
      };
      grid.appendChild(c);
    });
    helpBlock.appendChild(grid);
    wrap.appendChild(helpBlock);
  }

  if(item.ref || item.refAudio){
    const revealWrap = el('<div class="section-block" style="margin-top:24px;border-top:1.5px solid var(--line);padding-top:20px;"></div>');
    revealWrap.appendChild(el(`<h3>${opts.generated?'Traduction de référence (tirée de ton cours)':'Traduction de référence'}</h3>`));
    if(!state[vk]){
      revealWrap.appendChild(el('<div class="note" style="font-size:12.5px;">🔒 Valide d\'abord ta propre traduction ci-dessus pour débloquer la référence.</div>'));
      wrap.appendChild(revealWrap);
      return wrap;
    }
    revealWrap.appendChild(el('<div class="note" style="margin-bottom:10px;font-size:12.5px;">'+(opts.generated?'Construite à partir des phrases et du vocabulaire de ta leçon — fiable, contrairement à l\'aide automatique ci-dessus. Les phrases très simples (« C\'est… », « Il y a… ») sont générées par un modèle fixe.':'De ta professeur — fiable, contrairement à l\'aide automatique ci-dessus.')+'</div>'));
    const revealBtn = el('<button class="btn ghost">Révéler la traduction de référence</button>');
    const refBox = el('<div class="item-card" style="text-align:left;margin-top:12px;padding:16px 18px;display:none;white-space:pre-wrap;"></div>');
    revealBtn.onclick = ()=>{
      let html = '';
      if(item.ref) html += escapeHtml(item.ref);
      if(item.refAudio) html += `${item.ref?'<br><br>':''}<audio controls src="${escapeHtml(item.refAudio)}" style="width:100%;"></audio>`;
      refBox.innerHTML = html;

/* ---------- Contrôle : on ne quitte pas la page ---------- */
const CONTROL_MAX_LEAVES = 3;            // à la 3e sortie, le contrôle est annulé
const CONTROL_MIN_AWAY_MS = 1500;        // une sortie plus courte n'est pas comptée
const CONTROL_GUARD = { phase:'idle', leaves:0, awayAt:null, awaySecs:0, view:null, banner:'', reasons:[] };
let TAB_CHANNEL = null; const TAB_ID = Math.random().toString(36).slice(2);
try{
  if(typeof BroadcastChannel!=='undefined'){
    TAB_CHANNEL = new BroadcastChannel('compagnon-coreen-tabs');
    TAB_CHANNEL.onmessage = (e)=>{
      const m = e.data||{}; if(m.from===TAB_ID) return;
      if(m.type==='ping') TAB_CHANNEL.postMessage({type:'pong', from:TAB_ID});
      if(m.type==='hello' && CONTROL_GUARD.phase==='active'){ controlGuardAway('autre onglet ouvert'); controlGuardBack(true); }
    };
    TAB_CHANNEL.postMessage({type:'hello', from:TAB_ID});
  }
}catch(e){ TAB_CHANNEL = null; }
function controlOtherTabOpen(){
  return new Promise(resolve=>{
    if(!TAB_CHANNEL){ resolve(false); return; }
    let found = false;
    const h = (e)=>{ const m=e.data||{}; if(m.type==='pong' && m.from!==TAB_ID) found = true; };
    TAB_CHANNEL.addEventListener('message', h);
    try{ TAB_CHANNEL.postMessage({type:'ping', from:TAB_ID}); }catch(e){}
    setTimeout(()=>{ TAB_CHANNEL.removeEventListener('message', h); resolve(found); }, 400);
  });
}
function controlGuardReset(){ Object.assign(CONTROL_GUARD, { phase:'idle', leaves:0, awayAt:null, awaySecs:0, view:null, banner:'', reasons:[] }); }
function controlGuardAway(reason){
  if(CONTROL_GUARD.phase!=='active' || CONTROL_GUARD.awayAt!==null) return;
  CONTROL_GUARD.awayAt = Date.now(); CONTROL_GUARD.pendingReason = reason;
}
function controlGuardBack(force){
  const g = CONTROL_GUARD;
  if(g.phase!=='active' || g.awayAt===null) return false;
  const dur = Date.now() - g.awayAt; g.awayAt = null;
  if(!force && dur < CONTROL_MIN_AWAY_MS) return false;
  g.leaves++; g.awaySecs += Math.round(dur/1000); g.reasons.push(g.pendingReason||'page quittée');
  if(g.leaves >= CONTROL_MAX_LEAVES){ controlGuardCancel(); }
  else { g.banner = `⚠️ Tu as quitté la page du contrôle (${g.leaves}/${CONTROL_MAX_LEAVES}). À la ${CONTROL_MAX_LEAVES}ᵉ sortie, le contrôle est annulé.`; if(typeof render==='function') render(); }
  return true;
}
async function controlGuardCancel(){
  const g = CONTROL_GUARD, v = g.view || {};
  const lessonId = v.lessonId; const leaves = g.leaves, secs = g.awaySecs;
  g.phase = 'cancelled'; g.banner = '';
  state.controlResult = { cancelled:true, leaves, secs };
  if(lessonId) await sbRecordControl(lessonId, { cancelled:true, leaves, secs });
  render();
}
async function sbRecordControl(lessonId, info){
  // Cumule les sorties de page dans la progression : la professeure les voit dans son tableau de bord
  const prev = (PROGRESS[lessonId] && PROGRESS[lessonId].control) || {};
  const flags = Object.assign({ exits:0, cancelled:0, secs:0 }, prev.flags||{});
  flags.exits += info.leaves||0; flags.secs += info.secs||0; if(info.cancelled) flags.cancelled += 1; flags.last = new Date().toISOString().slice(0,10);
  const ctl = Object.assign({}, prev, { attempts:(prev.attempts||0)+(info.cancelled?1:0), flags });
  if(info.cancelled){ ctl.date = new Date().toISOString().slice(0,10); }
  if(prev.passed===undefined) ctl.passed = false;
  if(prev.score===undefined) ctl.score = 0;
  await sbUpsertProgress(lessonId, { control: ctl });
}
function controlViewMatches(){
  const v = CONTROL_GUARD.view; if(!v) return false;
  return state.tab==='controle' && state.space===v.space && state.level===v.level && (state.lessonId||null)===(v.lessonIdState||null)
    && !state.reviewMode && !state.grammarMode && !state.listenMode && !state.globalQuizMode && !state.puzzleMode;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) controlGuardAway('autre onglet ou application'); else controlGuardBack(); });
window.addEventListener('blur', ()=>{ controlGuardAway('autre fenêtre'); });
window.addEventListener('focus', ()=>{ controlGuardBack(); });
// Appelé à chaque affichage : si l'élève quitte l'écran du contrôle (autre onglet de l'outil, autre leçon…) en plein contrôle, ça compte comme une sortie
function controlGuardCheckView(){
  const g = CONTROL_GUARD;
  if(g.phase==='active' && !controlViewMatches()){
    g.leaves++; g.reasons.push("autre écran de l'outil");
    if(g.leaves>=CONTROL_MAX_LEAVES){ controlGuardCancel(); return true; }
    // le contrôle repart de zéro : on ne laisse pas voir le cours puis revenir sur les mêmes questions
    const lessonId = g.view && g.view.lessonId; const lv = g.leaves;
    controlGuardReset(); g.leaves = lv; g.phase='idle'; g.banner = `⚠️ Tu as quitté l'écran du contrôle (${lv}/${CONTROL_MAX_LEAVES}). Les questions ont changé.`;
    state.controlAnswers = {};
    for(const k of Object.keys(LESSONS_CACHE)){ (LESSONS_CACHE[k]||[]).forEach(l=>{ delete l._control; }); }
    g.carry = lv;
  }
  return false;
}

/* ---------------- TEACHER: manage lessons ---------------- */
function isHangul(s){ return /[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/.test(s||''); }
function hasLatinLetters(s){ return /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(s||''); }

// Tente d'extraire une paire coréen/français d'un fragment de texte qui n'a
// AUCUN séparateur explicite (ex. "바람이 불다 il y a du vent" collé tel quel
// dans des notes de cours). On repère juste où s'arrête le hangeul et où
// commence le texte en alphabet latin — pas besoin de comprendre le sens.
function splitEmbeddedKoFr(segment){
  let lastHangulIdx = -1;
  for(let i=0;i<segment.length;i++){ if(isHangul(segment[i])) lastHangulIdx = i; }
  if(lastHangulIdx===-1) return null; // pas de coréen du tout sur ce fragment
  // la ponctuation collée au dernier mot coréen (. ? ! …) reste avec le coréen
  const tail = segment.slice(lastHangulIdx+1);
  const punct = (tail.match(/^[.?!…。？！~]+/) || [''])[0];
  const kr = (segment.slice(0, lastHangulIdx+1) + punct).trim();
  let fr = tail.slice(punct.length).trim().replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ0-9(]+/, '').trim();
  if(!kr || !(hasLatinLetters(fr) || /\d/.test(fr))) return null; // pas de traduction accolée -> on ignore la ligne
  return {kr, rom:'', fr};
}

// Une entrée de vocabulaire valable = un mot coréen (kr), une romanisation en alphabet latin
// (rom, facultative) et une traduction qui n'est pas du coréen. Le reste est un déchet
// (ex. « 버스 | 지하철 | 택시 » ou « Il y a des bus | des métros | … »), né du découpage
// d'une phrase à virgules par une ancienne version.
function isJunkVocab(v){
  if(!v || !v.kr || !isHangul(v.kr)) return true;
  if(v.rom && isHangul(v.rom)) return true;
  if(v.fr && isHangul(v.fr) && !hasLatinLetters(v.fr)) return true;
  return false;
}

function parseVocabText(raw){
  const results = [];
  const seen = new Set();
  raw.split('\n').forEach(rawLine=>{
    let line = rawLine.trim();
    if(!line) return;
    // Retire les puces de correction ("* ..."), les reformulations ("= ...")
    // et les indicatifs de dialogue courts ("A :", "B:", "엄마 :"...)
    line = line.replace(/^[*=]\s*/, '').replace(/^[A-Za-z가-힣]{1,3}\s*[:：]\s*/, '').trim();
    if(!line) return;

    const arrowParts = line.split('→').map(s=>s.trim()).filter(Boolean);
    // « coréen → français » (ou l'inverse) : une seule paire, même s'il y a des virgules dedans
    if(arrowParts.length===2){
      const [l,r] = arrowParts;
      let pair = null;
      if(isHangul(l) && !isHangul(r) && hasLatinLetters(r)) pair = {kr:l, rom:'', fr:r};
      else if(isHangul(r) && !isHangul(l) && hasLatinLetters(l)) pair = {kr:r, rom:'', fr:l};
      if(pair){ if(!seen.has(pair.kr)){ seen.add(pair.kr); results.push(pair); } return; }
    }
    const segments = arrowParts.length>1 ? arrowParts : [line];

    segments.forEach(seg=>{
      let parts;
      if(seg.includes('\t')) parts = seg.split('\t');
      else if(seg.includes('->')) parts = seg.split('->');
      else if(seg.includes('|')) parts = seg.split('|');
      else if(seg.includes(';')) parts = seg.split(';');
      else if((seg.match(/,/g)||[]).length>=2) parts = seg.split(',');
      else parts = null;

      let entry = null;
      if(parts && parts.length>=2){
        parts = parts.map(s=>s&&s.trim());
        if(parts.length>=3){
          const [kr,rom,fr] = parts;
          if(kr) entry = {kr, rom:rom||'', fr:fr||''};
        } else {
          const [a,b] = parts;
          if(isHangul(a)) entry = {kr:a, rom:'', fr:b||''};
          else if(isHangul(b)) entry = {kr:b, rom:'', fr:a||''};
          else if(a) entry = {kr:a, rom:'', fr:b||''};
        }
      } else {
        entry = splitEmbeddedKoFr(seg);
      }
      if(entry && entry.kr && !isJunkVocab(entry) && !seen.has(entry.kr)){
        seen.add(entry.kr);
        results.push(entry);
      }
    });
  });
  return results;
}

// ---------------------------------------------------------------
// Analyseur de cours — lit les notes de la prof telles qu'elle les écrit,
// en acceptant ses DEUX habitudes de notation (souvent mélangées) :
//
//  A) Cours de groupe, avec locuteurs :
//       locuteur (rôle) : segment1 | segment2 = traduction1 | traduction2
//  B) Cours individuel, traduction collée juste après le coréen :
//       역사 histoire
//       이름 모르겠어요. Je ne connais pas le nom.
//
// Règles :
//  - ":" (ou "：") sépare un locuteur court du contenu. Sans ":", pas de locuteur.
//  - "(rôle)" après le nom du locuteur = étiquette affichée, jamais traduite ;
//    s'il manque, on réutilise le dernier rôle vu pour ce même locuteur.
//  - "*" en début de ligne = réponse de l'élève ; "=" en début de ligne =
//    reformulation de la phrase précédente.
//  - "|" sépare plusieurs segments coréens sur une même ligne.
//  - "=" ou "→" suivi de français = traduction MANUELLE du coréen qui précède
//    (fiable : jamais besoin de l'API pour ce bout-là).
//  - Sans séparateur, si du français suit directement le coréen, c'est lu
//    comme une traduction (on repère juste où le hangeul s'arrête).
//  - Une glose entre parenthèses en fin de ligne "(연말 fin d'année)" devient
//    une entrée de vocabulaire à part.
//  - Virgules, points, "!", "?" ne coupent JAMAIS un segment.
//  - Un segment coréen sans traduction reste vide : à compléter à la main ou
//    par suggestion automatique, toujours relue avant de valider.
// ---------------------------------------------------------------
function isFrenchish(s){ return !!s && !isHangul(s) && hasLatinLetters(s); }

function parseContentSegments(content){
  const out = [];
  let gloss = null;

  // glose entre parenthèses en fin de ligne : "phrase (연말 fin d'année)"
  const pm = content.match(/\s*\(([^()]*)\)\s*$/);
  if(pm && isHangul(pm[1])){
    const g = splitEmbeddedKoFr(pm[1]);
    if(g){ gloss = { kr:g.kr, fr:g.fr, manual:true, gloss:true }; content = content.slice(0, pm.index).trim(); }
  }

  // reformulation entre parenthèses "(=구경할 곳이 많아요)" : ce n'est PAS une traduction,
  // la phrase devient deux segments coréens (le « = » ne coupe plus la ligne en deux)
  const extra = [];
  content = content.replace(/\s*\(\s*=\s*([^()]*)\)/g, (all, inner)=>{ if(isHangul(inner)) extra.push(inner.trim()); return isHangul(inner) ? '' : all; });

  // mots glosés à la fin de la ligne, SANS parenthèses :
  //   "... 부산도 좋아요. 관광지 site touristique"  ou  "킹크랩 crabe royal, 게 crabe, 새우 crevette"
  const glossList = (txt)=>{
    if(/[=→|]/.test(txt) || !hasLatinLetters(txt) || !isHangul(txt)) return null;
    const parts = txt.split(/\s*,\s*/).filter(Boolean);
    const res = [];
    for(const p of parts){
      const e = splitEmbeddedKoFr(p);
      if(!e || /[.?!…]/.test(e.kr) || e.kr.split(/\s+/).length>3) return null;
      res.push({ kr:e.kr, fr:e.fr, manual:true, gloss:true });
    }
    return res.length ? res : null;
  };
  let tailGlosses = [];
  {
    const m = content.match(/^(.*[.?!…。？！])\s+([^.?!…。？！]+)$/);
    if(m){
      const g = glossList(m[2]);
      if(g){ tailGlosses = g; content = m[1].trim(); }
    } else if(content.includes(',')){
      const g = glossList(content);
      if(g && g.length>=2){ tailGlosses = g; content = ''; }
    }
  }

  if(content){
    const eqIdx = content.replace(/\([^()]*\)/g, s=>' '.repeat(s.length)).indexOf('=');
    if(eqIdx !== -1){
      // "ko1 | ko2 = fr1 | fr2" : les segments des deux côtés se correspondent un par un
      const koSegs = content.slice(0, eqIdx).split('|').map(s=>s.trim()).filter(Boolean);
      const frSegs = content.slice(eqIdx+1).split('|').map(s=>s.trim());
      koSegs.forEach((kr,i)=> out.push({ kr, fr: frSegs[i]||'', manual: !!frSegs[i] }));
    } else if(content.includes('→')){
      const parts = content.split('→').map(s=>s.trim()).filter(Boolean);
      if(parts.length===2 && isFrenchish(parts[1])){
        out.push({ kr: parts[0], fr: parts[1], manual: true });
      } else {
        parts.forEach(p=>{
          const e = splitEmbeddedKoFr(p);
          out.push(e ? { kr:e.kr, fr:e.fr, manual:true } : { kr:p, fr:'', manual:false });
        });
      }
    } else if(content.includes('|')){
      content.split('|').map(s=>s.trim()).filter(Boolean).forEach(kr=> out.push({ kr, fr:'', manual:false }));
    } else {
      const e = splitEmbeddedKoFr(content);
      out.push(e ? { kr:e.kr, fr:e.fr, manual:true } : { kr:content, fr:'', manual:false });
    }
  }
  extra.forEach(kr=> out.push({ kr, fr:'', manual:false }));
  tailGlosses.forEach(g=> out.push(g));
  if(gloss) out.push(gloss);
  return out;
}

function parseDialogueText(raw){
  const exchanges = [];
  const lastRoleBySpeaker = {};
  raw.split('\n').forEach(rawLine=>{
    let line = rawLine.trim();
    if(!line) return;

    let reply = false, equiv = false;
    if(/^\*/.test(line)){ reply = true; line = line.replace(/^\*+\s*/, ''); }
    if(/^=/.test(line)){ equiv = true; line = line.replace(/^=+\s*/, ''); }
    if(!line) return;

    let speaker = null, role = null, content = line;
    const i1 = line.indexOf(':'), i2 = line.indexOf('：');
    const colonIdx = (i1===-1) ? i2 : (i2===-1 ? i1 : Math.min(i1,i2));
    if(colonIdx !== -1){
      const before = line.slice(0, colonIdx).trim();
      // un vrai nom de locuteur est court, contient des lettres, et ne ressemble pas à une phrase
      if(before && before.length<=30 && !/[.?!]/.test(before) && /[A-Za-zÀ-ÖØ-öø-ÿ\uAC00-\uD7A3]/.test(before)){
        content = line.slice(colonIdx+1).trim();
        const m = before.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
        if(m){ speaker = m[1].trim(); role = m[2].trim(); if(speaker) lastRoleBySpeaker[speaker] = role; }
        else { speaker = before; role = lastRoleBySpeaker[speaker] || null; }
      }
    }
    if(!content) return;

    const segments = parseContentSegments(content);
    if(segments.length===0) return;
    exchanges.push({ speaker, role, reply, equiv, segments });
  });
  return exchanges;
}

// Nombres coréens : se CALCULENT (aucune API, aucun quota, aucune ambiguïté
// de traduction). Deux systèmes : sino-coréen (일 이 삼 … 십 백 천 만 억 조)
// et purement coréen (하나 둘 … 열 스물 서른 …).
const KO_SINO_DIGITS = {영:0,공:0,일:1,이:2,삼:3,사:4,오:5,육:6,칠:7,팔:8,구:9};
const KO_SINO_SMALL  = {십:10,백:100,천:1000};
const KO_SINO_BIG    = {만:1e4,억:1e8,조:1e12};
const KO_NATIVE_ONES = {하나:1,둘:2,셋:3,넷:4,다섯:5,여섯:6,일곱:7,여덟:8,아홉:9};
const KO_NATIVE_TENS = {열:10,스물:20,서른:30,마흔:40,쉰:50,예순:60,일흔:70,여든:80,아흔:90};
function koNumeralToNumber(raw){
  const s = (raw||'').replace(/\s+/g,'').replace(/[.,!?…~]+$/,'');
  if(!s) return null;
  if(/^[영공일이삼사오육칠팔구십백천만억조]+$/.test(s)){
    let total=0, section=0, num=0;
    for(const ch of s){
      if(ch in KO_SINO_DIGITS){ num = KO_SINO_DIGITS[ch]; }
      else if(ch in KO_SINO_SMALL){ section += (num||1)*KO_SINO_SMALL[ch]; num = 0; }
      else { section += num; total += (section||1)*KO_SINO_BIG[ch]; section = 0; num = 0; }
    }
    return total + section + num;
  }
  if(s in KO_NATIVE_ONES) return KO_NATIVE_ONES[s];
  for(const t of Object.keys(KO_NATIVE_TENS)){
    if(s===t) return KO_NATIVE_TENS[t];
    if(s.startsWith(t) && (s.slice(t.length) in KO_NATIVE_ONES)) return KO_NATIVE_TENS[t] + KO_NATIVE_ONES[s.slice(t.length)];
  }
  return null;
}

// Traduction d'une phrase entière via MyMemory — simple suggestion de départ
// pour les segments sans traduction ; la prof relit et corrige avant de valider.
// Le service gratuit a un quota quotidien : on le détecte pour ne jamais
// écrire son message d'avertissement à la place d'une traduction.
async function translateSentenceKoFr(text){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|fr`);
    const data = await res.json();
    const t = (data && data.responseData && data.responseData.translatedText) || '';
    const status = parseInt(data && data.responseStatus, 10);
    if(/MYMEMORY WARNING/i.test(t) || status===429) return { text:'', quota:true };
    if(status && status!==200) return { text:'', quota:false };
    return { text:t, quota:false };
  }catch(e){ return { text:'', quota:false }; }
}

// Widget réutilisable : zone de collage + analyse + tableau de relecture
// éditable, utilisé à la fois pour créer et pour modifier une leçon.
function buildDialogueEditor(initialExchanges){
  let exchanges = (initialExchanges||[]).map(ex=>({ ...ex, segments:(ex.segments||[]).map(s=>({...s})) }));
  const wrap = el('<div></div>');

  const toRaw = (list)=> list.map(ex=>{
    const prefix = (ex.reply?'* ':'') + (ex.equiv?'= ':'') + (ex.speaker ? `${ex.speaker}${ex.role?` (${ex.role})`:''} : ` : '');
    const hasFr = ex.segments.some(s=>s.fr);
    return prefix + ex.segments.map(s=>s.kr).join(' | ') + (hasFr ? ' = ' + ex.segments.map(s=>s.fr||'').join(' | ') : '');
  }).join('\n');
  const rawText = toRaw(exchanges);

  wrap.appendChild(el(`<div class="note" style="margin-bottom:10px;font-size:12px;line-height:1.55;">
    Colle ton cours <b>tel quel</b>. Sont reconnus :<br>
    • coréen suivi de sa traduction sur la même ligne : <code>역사 histoire</code><br>
    • <code>coréen → français</code> ou <code>coréen = français</code><br>
    • dialogues : <code>locuteur (rôle) : coréen | coréen = français | français</code><br>
    • <code>*</code> en début de ligne = réponse de l'élève<br>
    Les phrases sans traduction restent vides : tu les complètes à la main ou avec la suggestion automatique, et tu relis avant d'enregistrer.</div>`));
  const textarea = el(`<textarea data-ko="1" style="width:100%;min-height:180px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;font-size:13px;font-family:'IBM Plex Mono',monospace;">${escapeHtml(rawText)}</textarea>`);
  wrap.appendChild(textarea);
  const btnRow = el('<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;"></div>');
  const analyzeBtn = el('<button type="button" class="btn ghost small">Analyser le texte</button>');
  const apiBtn = el('<button type="button" class="btn ghost small" style="display:none;">🌐 Suggérer les traductions manquantes</button>');
  const status = el('<span style="font-size:12px;color:var(--ink-soft);align-self:center;"></span>');
  btnRow.appendChild(analyzeBtn); btnRow.appendChild(apiBtn); btnRow.appendChild(status);
  wrap.appendChild(btnRow);
  const reviewBox = el('<div style="max-height:460px;overflow-y:auto;"></div>');
  wrap.appendChild(reviewBox);

  let lastAnalyzed = textarea.value;
  // Ré-analyse le texte SANS perdre le travail de relecture déjà fait : les
  // traductions corrigées à la main (et les suggestions déjà reçues) sont
  // reportées sur les segments dont le coréen n'a pas changé.
  const syncFromText = ()=>{
    const known = new Map();
    exchanges.forEach(ex=>ex.segments.forEach(s=>{ if(s.fr) known.set(s.kr, { fr:s.fr, manual:s.manual, edited:s.edited }); }));
    exchanges = parseDialogueText(textarea.value);
    exchanges.forEach(ex=>ex.segments.forEach(s=>{
      const k = known.get(s.kr);
      if(k && (!s.fr || k.edited)){ s.fr = k.fr; s.manual = k.manual; if(k.edited) s.edited = true; }
    }));
    lastAnalyzed = textarea.value;
  };
  const countSummary = ()=>{
    const segs = exchanges.reduce((n,ex)=>n+ex.segments.length, 0);
    const withFr = exchanges.reduce((n,ex)=>n+ex.segments.filter(s=>s.fr).length, 0);
    return `${segs} segment(s) : ${withFr} avec traduction, ${segs-withFr} sans.`;
  };

  function renderReview(){
    reviewBox.innerHTML = '';
    if(exchanges.length===0) return;
    apiBtn.style.display = exchanges.some(ex=>ex.segments.some(s=>!s.fr)) ? 'inline-block' : 'none';
    exchanges.forEach(ex=>{
      const card = el('<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;"></div>');
      const tags = [];
      if(ex.speaker) tags.push(escapeHtml(ex.speaker) + (ex.role?' · '+escapeHtml(ex.role):''));
      if(ex.reply) tags.push('↳ réponse de l\'élève');
      if(ex.equiv) tags.push('= reformulation');
      if(tags.length){
        card.appendChild(el(`<div style="font-size:11px;font-weight:700;color:var(--celadon-dark);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">${tags.join(' — ')}</div>`));
      }
      ex.segments.forEach(seg=>{
        const row = el('<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"></div>');
        row.appendChild(el(`<div class="kr" style="flex:1;font-size:14px;">${escapeHtml(seg.kr)}${seg.gloss?' <span class="mono" style="font-size:10px;color:var(--ink-soft);">glose</span>':''}</div>`));
        const input = el(`<input type="text" value="${escapeHtml(seg.fr)}" placeholder="traduction..." style="flex:1;font-size:13px;">`);
        input.oninput = (e)=>{ seg.fr = e.target.value; seg.manual = true; seg.edited = true; };
        row.appendChild(input);
        if(!seg.manual && seg.fr){ row.appendChild(el('<span class="mono" style="font-size:10px;color:var(--gold);white-space:nowrap;">suggestion</span>')); }
        card.appendChild(row);
      });
      reviewBox.appendChild(card);
    });
  }

  analyzeBtn.onclick = ()=>{
    syncFromText();
    status.textContent = countSummary();
    renderReview();
  };

  apiBtn.onclick = async ()=>{
    apiBtn.disabled = true;
    const todo = []; let skippedWords = 0, numerals = 0;
    exchanges.forEach(ex=>ex.segments.forEach(seg=>{
      if(seg.fr) return;
      const k = seg.kr.trim();
      const n = koNumeralToNumber(k);
      if(n !== null){ seg.fr = n.toLocaleString('en-US'); seg.manual = false; numerals++; return; }
      // un mot isolé est trop ambigu sans contexte : on ne propose rien
      if(!/\s/.test(k) && k.length<=6){ skippedWords++; return; }
      if(k.length>160){ return; } // limite de longueur du service gratuit
      todo.push(seg);
    }));
    let done = 0, quota = false;
    for(const seg of todo){
      status.textContent = `Suggestion ${done+1}/${todo.length}…`;
      const r = await translateSentenceKoFr(seg.kr);
      if(r.quota){ quota = true; break; }
      if(r.text){ seg.fr = r.text; seg.manual = false; }
      done++;
    }
    apiBtn.disabled = false;
    status.textContent = quota
      ? `${numerals?numerals+' nombre(s) converti(s). ':''}Quota gratuit du service atteint pour aujourd\'hui — complète les phrases à la main ou réessaie demain.`
      : `Terminé${numerals?` — ${numerals} nombre(s) converti(s)`:''}${skippedWords?` — ${skippedWords} mot(s) isolé(s) laissé(s) vide(s), trop ambigus sans contexte`:''}. Relis et corrige avant d'enregistrer.`;
    renderReview();
  };

  if(exchanges.length) renderReview();

  return {
    element: wrap,
    // Si du texte a été collé/modifié sans cliquer sur "Analyser", on l'analyse
    // ici plutôt que de l'ignorer en silence à l'enregistrement.
    getExchanges: ()=>{ if(textarea.value !== lastAnalyzed){ syncFromText(); } return exchanges; },
    setText: (t)=>{
      const cur = textarea.value.trim();
      textarea.value = cur ? cur + '\n' + t : t;
      syncFromText();
      status.textContent = countSummary();
      renderReview();
    }
  };
}

function dialogueToVocab(exchanges){
  const seen = new Set();
  const vocab = [];
  (exchanges||[]).forEach(ex=> ex.segments.forEach(s=>{
    if(s.kr && s.fr && !seen.has(s.kr)){ seen.add(s.kr); vocab.push({kr:s.kr, rom:'', fr:s.fr}); }
  }));
  return vocab;
}

    deleteBtn.onclick = async ()=>{
      if(!confirm(`Supprimer définitivement la leçon "${l.title}" ? Toute la progression et les assignations liées seront aussi supprimées.`)) return;
      await sbDeleteLesson(l.id);
      delete LESSONS_CACHE[state.level];
      render();
    };
    row.lastElementChild.appendChild(editBtn);
    row.lastElementChild.appendChild(assignBtn);
    row.lastElementChild.appendChild(audioBtn);
    row.lastElementChild.appendChild(dupBtn);
    row.lastElementChild.appendChild(printBtn);
    row.lastElementChild.appendChild(deleteBtn);
    existing.appendChild(row);
  });
  wrap.appendChild(existing);
  wrap.appendChild(buildBackupBox());
  return wrap;
}

// Vocabulaire ajouté à la main = tout ce qui ne vient PAS du contenu du cours
// (les phrases et mots du cours sont recalculés à chaque enregistrement).
function manualVocabOf(lesson){
  const fromCourse = new Set(dialogueToVocab(lesson.dialogue||[]).map(v=>v.kr));
  return (lesson.vocab||[]).filter(v=> !fromCourse.has(v.kr) && !isJunkVocab(v));
}

function serializeVocab(vocab){
  return (vocab||[]).map(v => v.rom ? `${v.kr} | ${v.rom} | ${v.fr}` : `${v.kr} → ${v.fr}`).join('\n');
}

function openPrintableLesson(lesson){
  const vocabRows = (lesson.vocab||[]).map(v=>`<tr><td style="font-size:18px;">${escapeHtml(v.kr)}</td><td>${escapeHtml(v.rom||'')}</td><td>${escapeHtml(v.fr||'')}</td></tr>`).join('');
  const grammarItems = (lesson.grammar||[]).map(g=>`<li>${escapeHtml(g)}</li>`).join('');
  const dlg = (lesson.dialogue||[]).map(ex=>{
    const txt = (ex.segments||[]).map(sg=>escapeHtml(sg.kr||'')+(sg.fr?' — '+escapeHtml(sg.fr):'')).join('<br>');
    return txt ? `<p style="margin:8px 0;">${ex.speaker?'<b>'+escapeHtml(ex.speaker)+'</b> : ':''}${txt}</p>` : '';
  }).join('');
  const t = (lesson.translations && lesson.translations[0]) || {};
  const transSection = t.text ? `
    <h2>Texte à traduire</h2>
    <p style="white-space:pre-wrap;font-size:16px;">${escapeHtml(t.text)}</p>
    ${t.ref ? `<h2>Traduction de référence</h2><p style="white-space:pre-wrap;">${escapeHtml(t.ref)}</p>` : ''}
  ` : '';
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${escapeHtml(lesson.title)}</title>
  <style>
    body{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;padding:40px;color:#211D1A;max-width:800px;margin:0 auto;}
    h1{font-size:24px;border-bottom:2px solid #211D1A;padding-bottom:10px;}
    h2{font-size:16px;margin-top:28px;margin-bottom:8px;}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    td{border-bottom:1px solid #ddd;padding:8px 10px;font-size:14px;vertical-align:top;}
    ul{padding-left:20px;} li{margin-bottom:8px;font-size:14px;line-height:1.5;}
    @media print{ body{padding:15px;} }
  </style></head><body>
  <h1>${escapeHtml(lesson.title)}</h1>
  ${dlg ? `<h2>Cours</h2>${dlg}` : ''}
  <h2>Vocabulaire</h2>
  <table>${vocabRows || '<tr><td>Aucun</td></tr>'}</table>
  ${grammarItems ? `<h2>Grammaire</h2><ul>${grammarItems}</ul>` : ''}
  ${transSection}
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){ alert('Le navigateur a bloqué la fenêtre d\'impression — autorise les pop-ups pour ce site.'); return; }
  win.document.write(html);
  win.document.close();
  setTimeout(()=>{ win.print(); }, 300);
}

// Sauvegarde : toutes les leçons dans un fichier, et restauration depuis ce fichier
async function exportAllLessons(){
  const { data, error } = await sb.from('lessons').select('*').order('space').order('position');
  if(error) return { error };
  const payload = { app:'compagnon-coreen', kind:'lessons', exported_at:new Date().toISOString(), lessons:data||[] };
  const blob = new Blob([JSON.stringify(payload,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'sauvegarde-lecons-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); }, 500);
  return { count:(data||[]).length };
}
async function importLessonsFile(file){
  const txt = await file.text(); let obj;
  try{ obj = JSON.parse(txt); }catch(e){ return { error:{message:'Ce fichier n\'est pas une sauvegarde valable.'} }; }
  if(!obj || obj.app!=='compagnon-coreen' || !Array.isArray(obj.lessons)) return { error:{message:'Ce fichier n\'est pas une sauvegarde de l\'outil.'} };
  const rows = obj.lessons.filter(l=>l && l.id && l.space && l.title).map(l=>{ const r = Object.assign({}, l); delete r.created_at; return r; });
  if(!rows.length) return { error:{message:'La sauvegarde ne contient aucune leçon.'} };
  const { error } = await sb.from('lessons').upsert(rows, { onConflict:'id' });
  if(error) return { error };
  LESSONS_CACHE = {}; return { count:rows.length };
}
function buildBackupBox(){
  const box = el(`<div class="section-block" style="margin-top:30px;border:1.5px dashed var(--gold);border-radius:6px;padding:16px 18px;"><h3 style="margin-top:0;">💾 Sauvegarde des leçons</h3>
    <div class="note" style="margin-bottom:10px;font-size:12.5px;">Télécharge un fichier avec toutes tes leçons (tous niveaux) : garde-le sur ton ordinateur, par exemple une fois par mois. En cas de problème, tu peux les remettre en place avec « Restaurer ». Les progrès des élèves ne sont pas inclus.</div>
    <button class="btn celadon small" id="bk-export">Télécharger la sauvegarde</button>
    <label class="btn ghost small" style="margin-left:8px;cursor:pointer;">Restaurer depuis un fichier<input type="file" id="bk-file" accept=".json,application/json" style="display:none;"></label>
    <span id="bk-status" style="margin-left:10px;font-size:12.5px;"></span></div>`);
  const status = box.querySelector('#bk-status');
  box.querySelector('#bk-export').onclick = async ()=>{ status.style.color='var(--ink-soft)'; status.textContent='Préparation…'; const r = await exportAllLessons(); if(r.error){ status.style.color='var(--danger)'; status.textContent='Erreur : '+r.error.message; } else { status.style.color='var(--celadon-dark)'; status.textContent = r.count+' leçon(s) sauvegardée(s) ✓'; } };
  box.querySelector('#bk-file').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    if(!confirm('Restaurer les leçons de ce fichier ? Les leçons qui existent déjà avec le même identifiant seront remplacées par la version du fichier ; les autres ne sont pas touchées.')){ e.target.value=''; return; }
    status.style.color='var(--ink-soft)'; status.textContent='Restauration…';
    const r = await importLessonsFile(f); e.target.value='';
    if(r.error){ status.style.color='var(--danger)'; status.textContent='Erreur : '+r.error.message; return; }
    status.style.color='var(--celadon-dark)'; status.textContent = r.count+' leçon(s) restaurée(s) ✓'; render();
  };
  return box;
}

// Résumé de la semaine : qui a travaillé, qui est bloqué ou silencieux (7 derniers jours)
async function renderWeekSummary(students){
  if(ALL_STUDY_DAYS===null) ALL_STUDY_DAYS = (await sbAllStudyDays()) || false;
  const days = ALL_STUDY_DAYS || [];
  const last7 = []; for(let i=6;i>=0;i--) last7.push(addDaysStr(-i));
  const wk = new Set(last7), cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
  const box = el('<div class="section-block" style="border:1.5px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:22px;background:var(--card);"><h3 style="margin-top:0;">📅 Cette semaine</h3></div>');
  if(ALL_STUDY_DAYS===false) box.appendChild(el('<div class="note" style="font-size:12px;margin-bottom:10px;">Les jours de travail ne sont pas encore suivis : lance <b>migration-revision.sql</b> dans Supabase. En attendant, on se base sur la dernière connexion.</div>'));
  const rows = students.map(p=>{
    const mine = new Set(days.filter(d=>d.student_id===p.id).map(d=>String(d.day).slice(0,10)));
    const last = Math.max(p.last_activity_at ? new Date(p.last_activity_at).getTime() : 0, mine.size ? new Date(Array.from(mine).sort().pop()+'T12:00:00').getTime() : 0);
    const idle = last ? Math.floor((Date.now()-last)/86400000) : null;
    const prog = ALL_PROGRESS.filter(r=>r.student_id===p.id);
    const recentPass = prog.filter(r=>r.control && r.control.passed && r.updated_at && new Date(r.updated_at)>=cutoff).length;
    const active = last7.filter(d=>mine.has(d)).length;
    return { p, mine, idle, recentPass, active };
  }).sort((a,b)=>(b.idle??99)-(a.idle??99));
  const worked = rows.filter(r=>r.active>0 || (r.idle!==null && r.idle<7)).length;
  box.appendChild(el(`<div style="font-size:13px;margin-bottom:10px;"><b>${worked}</b> élève${worked>1?'s':''} sur ${rows.length} ${worked>1?'ont':'a'} travaillé ces 7 derniers jours.</div>`));
  rows.forEach(r=>{

    const flag = (r.idle!==null && r.idle>=5) ? ` <span style="color:var(--seal);font-size:12px;">⚠️ silencieux depuis ${r.idle} jours</span>` : (r.idle===null ? ' <span style="font-size:12px;color:var(--ink-soft);">jamais connecté</span>' : '');

  });
  return box;
}

/* ---------------- CHAT (live via Supabase Realtime) ---------------- */
function playNotifSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = 720;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    osc.onended = ()=> ctx.close();
  }catch(e){ /* audio non disponible, on ignore silencieusement */ }
}

// Affiche tout de suite son propre message (sans attendre le temps réel) ;
// l'éventuel écho du temps réel est ignoré grâce au contrôle par id.
function echoChat(m){
  if(!m || CHAT.some(x=>x.id===m.id)) return;
  CHAT.push(m);
  if(state.space==='groupe' && !VOICE_BUSY) render();
}
function subscribeChat(){
  unsubscribeChat();
  CHAT_SUB = sb.channel('chat_messages_changes_'+(ACTIVE_GROUP_ID||'none'))
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages', filter: ACTIVE_GROUP_ID ? `group_id=eq.${ACTIVE_GROUP_ID}` : undefined}, payload=>{
      if(CHAT.some(x=>x.id===payload.new.id)) return;      // déjà affiché (écho local)
      CHAT.push(payload.new);
      if(payload.new.author_id !== SESSION.user.id){ playNotifSound(); }
      if(state.space==='groupe' && !VOICE_BUSY) render();
    }).subscribe();
}
function unsubscribeChat(){ if(CHAT_SUB){ sb.removeChannel(CHAT_SUB); CHAT_SUB=null; } }

let RECORDING = null; // MediaRecorder instance while recording

async function renderChatPanel(){
  const box = el('<div class="main-card" style="margin-top:20px;"></div>');

    });

  const activeGroup = GROUPS.find(g=>g.id===ACTIVE_GROUP_ID);
